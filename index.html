const GLOSSARY={"digitization":{"t":"Digitization","d":"Mengubah informasi analog (kertas, suara, gambar fisik) menjadi format digital tanpa mengubah cara kerja.","id":"digitisasi"},"digitalization":{"t":"Digitalization","d":"Memakai teknologi digital untuk mengubah atau mengotomasi proses bisnis yang sudah ada.","id":"digitalisasi"},"digital-transformation":{"t":"Digital transformation","d":"Perubahan menyeluruh pada organisasi, termasuk model bisnis, proses, dan budaya, yang dipicu kombinasi teknologi digital untuk menciptakan nilai baru.","id":"transformasi digital"},"digital-technology":{"t":"Digital technology","d":"Kombinasi teknologi informasi, komputasi, komunikasi, dan konektivitas, misalnya cloud, data, AI, IoT, dan mobile.","id":"teknologi digital"},"business-model":{"t":"Business model","d":"Cara organisasi menciptakan, menyampaikan, dan menangkap nilai.","id":"model bisnis"},"value-proposition":{"t":"Value proposition","d":"Manfaat yang ditawarkan organisasi kepada pelanggan atau pengguna layanannya.","id":"proposisi nilai"},"customer-network":{"t":"Customer network","d":"Pelanggan sebagai jaringan yang aktif saling terhubung, memberi ulasan, dan memengaruhi satu sama lain.","id":"jaringan pelanggan"},"disruption":{"t":"Disruption","d":"Perubahan pasar ketika pendatang baru dengan model bisnis berbeda menggeser pemain lama.","id":"disrupsi"},"legacy-system":{"t":"Legacy system","d":"Sistem lama yang masih dipakai tetapi sulit diubah atau diintegrasikan dengan teknologi baru.","id":"sistem warisan"},"inertia":{"t":"Inertia","d":"Kecenderungan organisasi mempertahankan cara kerja, struktur, dan sumber daya yang sudah ada.","id":"inersia / kelembaman organisasi"},"digital-economy":{"t":"Digital economy","d":"Kegiatan ekonomi yang berlangsung melalui atau bergantung pada teknologi digital, misalnya e-commerce dan pembayaran digital.","id":"ekonomi digital"},"gmv":{"t":"Gross merchandise value (GMV)","d":"Total nilai transaksi barang/jasa yang terjadi melalui platform digital dalam periode tertentu.","id":"nilai transaksi bruto"},"super-app":{"t":"Super app","d":"Satu aplikasi yang menggabungkan banyak layanan, misalnya transportasi, pesan-antar makanan, dan pembayaran.","id":"aplikasi super"},"stakeholder":{"t":"Stakeholder","d":"Orang, kelompok, atau organisasi yang memengaruhi atau dipengaruhi oleh sebuah inisiatif.","id":"pemangku kepentingan"},"cloud-computing":{"t":"Cloud computing","d":"Model akses sumber daya komputasi bersama (server, penyimpanan, aplikasi) melalui jaringan, sesuai kebutuhan, dan cepat disediakan.","id":"komputasi awan"},"saas":{"t":"Software as a Service (SaaS)","d":"Aplikasi siap pakai yang dijalankan penyedia; pengguna cukup memakai lewat browser atau aplikasi.","id":"perangkat lunak sebagai layanan"},"paas":{"t":"Platform as a Service (PaaS)","d":"Platform untuk membangun dan menjalankan aplikasi sendiri tanpa mengelola server dan sistem operasi.","id":"platform sebagai layanan"},"iaas":{"t":"Infrastructure as a Service (IaaS)","d":"Sewa server virtual, penyimpanan, dan jaringan; pengguna mengelola sistem operasi dan aplikasinya.","id":"infrastruktur sebagai layanan"},"elasticity":{"t":"Rapid elasticity","d":"Kemampuan kapasitas cloud bertambah atau berkurang cepat mengikuti beban.","id":"elastisitas cepat"},"big-data":{"t":"Big data","d":"Data yang volumenya besar, datangnya cepat, dan jenisnya beragam sehingga butuh cara pengolahan baru.","id":"mahadata"},"analytics":{"t":"Analytics","d":"Pemakaian data, statistik, dan model untuk memahami keadaan dan mendukung keputusan.","id":"analitik"},"ai":{"t":"Artificial intelligence (AI)","d":"Sistem berbasis mesin yang, dari masukan yang diterima, menyimpulkan cara menghasilkan keluaran seperti prediksi, konten, rekomendasi, atau keputusan.","id":"kecerdasan artifisial"},"generative-ai":{"t":"Generative AI","d":"Jenis AI yang menghasilkan konten baru (teks, gambar, kode, suara) berdasarkan pola dari data latihnya.","id":"AI generatif"},"customer-experience":{"t":"Customer experience","d":"Keseluruhan pengalaman pelanggan saat berinteraksi dengan organisasi di semua titik kontak.","id":"pengalaman pelanggan"},"operational-backbone":{"t":"Operational backbone","d":"Sistem inti, data, dan proses terintegrasi yang menjamin operasi harian berjalan andal.","id":"tulang punggung operasional"},"digital-platform":{"t":"Digital platform","d":"Kumpulan komponen bisnis, data, dan infrastruktur yang dapat dipakai ulang untuk cepat membangun layanan digital baru.","id":"platform digital"},"vendor-lock-in":{"t":"Vendor lock-in","d":"Ketergantungan pada satu penyedia sehingga pindah ke penyedia lain menjadi mahal atau sulit.","id":"ketergantungan pada vendor"},"hallucination":{"t":"Hallucination","d":"Keluaran AI generatif yang terdengar meyakinkan tetapi salah atau tidak berdasar.","id":"halusinasi AI"}};
const QUOTES=[{"q":"Digital transformation is not about technology—it is about strategy and new ways of thinking.","a":"David L. Rogers","s":"The Digital Transformation Playbook, 2016"},{"q":"Software is eating the world.","a":"Marc Andreessen","s":"\"Why Software Is Eating the World\", The Wall Street Journal, 20 Aug 2011"},{"q":"Technology is nothing. What's important is that you have a faith in people, that they're basically good and smart, and if you give them tools, they'll do wonderful things with them.","a":"Steve Jobs","s":"Interview with Jeff Goodell, Rolling Stone, 1994"},{"q":"Indeed, Allah will not change the condition of a people until they change what is in themselves.","a":"Al-Qur'an, Ar-Ra'd 13:11","s":"Sahih International translation"}];
const MEETINGS=[{"no":1,"title":"Konsep Transformasi Digital","subtitle":"Digitisasi, digitalisasi, transformasi digital, pendorong, dan hambatannya","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 1</span><span>Transformasi Digital · SI24W15</span></div><h1>Konsep Transformasi Digital</h1><p class=\"lead\">Digitisasi, digitalisasi, transformasi digital, pendorong, dan hambatannya</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Program Studi</b>Sistem Informasi, Unusida</div><div><b>Semester</b>3 · 2 SKS</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-1</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menjelaskan konsep digitisasi, digitalisasi, dan transformasi digital beserta pendorongnya (C2).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian </h3><ol><li>Ketepatan membedakan digitisasi, digitalisasi, dan transformasi digital.</li><li>Ketepatan menjelaskan pendorong dan hambatan transformasi digital.</li><li>Ketepatan memberi contoh transformasi digital di Indonesia.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menjelaskan konsep transformasi digital, teknologi pendorongnya, dan model bisnis digital.</dd><dt>CPL-3</dt><dd class=\"id\">Menguasai konsep teoritis Sistem Informasi, Ilmu Komputer, dan Bisnis Digital secara umum serta konsep khusus secara mendalam untuk memformulasikan solusi prosedural.</dd><dt>Waktu</dt><dd>Tatap muka 2×50 menit · Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Tes Tulis (UTS: 5%)</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Peta perkuliahan</span><span>16 pertemuan · 2 SKS · Case Study</span></div><h2>Satu semester, satu organisasi mitra</h2><p>Setiap kelompok menganalisis <b>satu organisasi mitra nyata</b> (UMKM, instansi pemerintah, perguruan tinggi, atau pesantren/lembaga NU): dari teknologi dan model bisnisnya sampai roadmap transformasinya.</p><div class=\"assess\" role=\"img\" aria-label=\"Penilaian: Tugas 1 30 persen, UTS 20 persen, Tugas 2 30 persen, UAS 20 persen\"><div class=\"a1\" style=\"width:30%\"><b>30%</b>Tugas 1</div><div class=\"a2\" style=\"width:20%\"><b>20%</b>UTS</div><div class=\"a3\" style=\"width:30%\"><b>30%</b>Tugas 2</div><div class=\"a4\" style=\"width:20%\"><b>20%</b>UAS</div></div><div class=\"cols\" style=\"margin-top:.8em\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Tugas 1 · Kondisi saat ini</h3><p>Pemetaan teknologi digital, Business Model Canvas, serta analisis proses dan customer journey organisasi mitra. Dipresentasikan di Pertemuan 7.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Tugas 2 · Arah ke depan</h3><p>Asesmen kematangan digital, strategi dan roadmap transformasi, serta kajian aspek legal, etika, dan keberlanjutan untuk organisasi yang sama.</p></div></div><div class=\"weeks\" aria-hidden=\"true\"><span class=\"on\">1</span><span class=\"\">2</span><span class=\"\">3</span><span class=\"\">4</span><span class=\"\">5</span><span class=\"\">6</span><span class=\"\">7</span><span class=\"ex\">8</span><span class=\"\">9</span><span class=\"\">10</span><span class=\"\">11</span><span class=\"\">12</span><span class=\"\">13</span><span class=\"\">14</span><span class=\"\">15</span><span class=\"ex\">16</span></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Kontrak kuliah</span><span>Kita sepakati bersama</span></div><h2>Kesepakatan kelas kita</h2><div class=\"grid5\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Tepat waktu</h3><p>Hadir sebelum kelas dimulai. Tugas dikumpulkan sesuai tenggat.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kerja tim</h3><p>Setiap anggota punya peran dan kontribusi yang tercatat (<i>At Taawun</i>).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg>Menjaga mitra</h3><p>Santun, menepati janji, dan menjaga kerahasiaan data mitra (<i>Al Amanah</i>).</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Jujur</h3><p>Data dan sumber apa adanya. Hasil AI generatif tidak diakui sebagai tulisan sendiri (<i>As Shidqu</i>).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>Bertanya</h3><p>Kesulitan segera disampaikan, jangan ditunda sampai tenggat.</p></div></div><p class=\"muted\" style=\"margin-top:1em\">Ketentuan lain (kehadiran, keterlambatan pengumpulan) mengikuti peraturan akademik Unusida.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemanasan</span><span>3 menit · berpasangan</span></div><h2>Sekadar digital, atau benar-benar berubah?</h2><div class=\"cols w\"><div><p class=\"lead\">Beri tanda <b>A</b> bila hanya mengubah bentuk data, <b>B</b> bila mengubah cara kerja, <b>C</b> bila mengubah cara organisasi menciptakan nilai.</p><ol><li>Pesantren memindai rapor kertas santri menjadi PDF</li><li>Warung kopi menerima pembayaran QRIS</li><li>Kelurahan membuka pengajuan surat pengantar lewat formulir daring</li><li>Ojek pangkalan menjadi aplikasi transportasi, pesan-antar, dan pembayaran</li><li>Kampus memindahkan jadwal kuliah dari papan pengumuman ke website</li><li>UMKM batik mulai menjual desain sesuai pesanan lewat marketplace dan live streaming</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Petunjuk</h3><p>Tanyakan: <b>Apa yang berubah?</b> Hanya bentuk datanya, prosesnya, atau cara organisasi mendapat pendapatan dan melayani pelanggan?</p><p class=\"muted\">Jawaban dibahas di slide berikutnya.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>Tiga tahap: dari data ke organisasi</h2><figure class=\"fig\"><svg viewBox=\"0 0 860 280\" style=\"max-height:13em\" role=\"img\" aria-label=\"Tiga tahap bertingkat seperti anak tangga. Digitization: informasi analog diubah menjadi digital. Digitalization: proses yang ada diubah atau diotomasi dengan teknologi digital. Digital transformation: perubahan menyeluruh organisasi hingga model bisnis baru. Semakin ke kanan, cakupan perubahan makin luas.\"><defs><marker id=\"d3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><line x1=\"30\" y1=\"262\" x2=\"830\" y2=\"262\" class=\"s-line\" marker-end=\"url(#d3)\"/><text x=\"830\" y=\"252\" text-anchor=\"end\" class=\"s-hd\">CAKUPAN PERUBAHAN MAKIN LUAS</text><rect x=\"30\" y=\"150\" width=\"250\" height=\"90\" rx=\"12\" class=\"s-soft\"/><text x=\"155\" y=\"180\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:16px\">Digitization</text><text x=\"155\" y=\"204\" text-anchor=\"middle\" class=\"s-s\">analog → digital</text><text x=\"155\" y=\"226\" text-anchor=\"middle\" class=\"s-hd\" style=\"font-size:11px\">FOKUS: DATA/INFORMASI</text><rect x=\"300\" y=\"100\" width=\"250\" height=\"140\" rx=\"12\" class=\"s-soft\"/><text x=\"425\" y=\"130\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:16px\">Digitalization</text><text x=\"425\" y=\"154\" text-anchor=\"middle\" class=\"s-s\">proses diubah/diotomasi</text><text x=\"425\" y=\"176\" text-anchor=\"middle\" class=\"s-hd\" style=\"font-size:11px\">FOKUS: PROSES BISNIS</text><rect x=\"570\" y=\"50\" width=\"250\" height=\"190\" rx=\"12\" class=\"s-acc\"/><text x=\"695\" y=\"80\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:16px\">Digital transformation</text><text x=\"695\" y=\"104\" text-anchor=\"middle\" class=\"s-s\">model bisnis &amp; organisasi</text><text x=\"695\" y=\"126\" text-anchor=\"middle\" class=\"s-hd\" style=\"font-size:11px\">FOKUS: SELURUH ORGANISASI</text></svg><figcaption>Tiga tahap transformasi digital, diadaptasi dari Verhoef et al. (2021). Nama tahap ditulis sesuai sumber.</figcaption></figure><div class=\"grid3\" style=\"margin-top:.5em\"><div class=\"card\"><p><b><button type=\"button\" class=\"term\" data-term=\"digitization\">Digitization</button></b>: informasi analog diubah menjadi digital.</p></div><div class=\"card\"><p><b><button type=\"button\" class=\"term\" data-term=\"digitalization\">Digitalization</button></b>: proses yang ada diubah atau diotomasi dengan teknologi digital.</p></div><div class=\"card hl\"><p><b><button type=\"button\" class=\"term\" data-term=\"digital-transformation\">Digital transformation</button></b>: perubahan menyeluruh yang melahirkan model bisnis baru.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Definisi</span><span>Indikator 1</span></div><h2>Apa itu transformasi digital?</h2><div class=\"cols w\"><div><div class=\"callout\"><span class=\"quote\">Transformasi digital adalah proses yang bertujuan memperbaiki suatu entitas dengan memicu perubahan signifikan pada sifat-sifatnya melalui kombinasi teknologi informasi, komputasi, komunikasi, dan konektivitas.</span><div class=\"muted\" style=\"margin-top:.3em;font-size:.85em\"><span class=\"cite\">(Vial, 2019, terjemahan bebas)</span></div></div><ul style=\"margin-top:.8em\"><li><b>Proses</b>: berlangsung terus, bukan proyek sekali jadi.</li><li><b>Perubahan signifikan</b>: bukan sekadar menambah aplikasi.</li><li><b>Kombinasi teknologi</b>: <button type=\"button\" class=\"term\" data-term=\"digital-technology\">teknologi digital</button> bekerja bersama, bukan satu alat saja.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Bukan soal teknologi</h3><p class=\"quote\" style=\"font-size:1.05em\">\"Transformasi digital bukan soal teknologi; ini soal strategi dan cara berpikir baru.\"</p><p class=\"muted\" style=\"font-size:.85em\"><span class=\"cite\">(Rogers, 2016, terjemahan bebas)</span></p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh</span><span>Kasus ilustrasi · indikator 1</span></div><h2>Tiga tahap di tiga organisasi</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Organisasi</th><th>Digitization</th><th>Digitalization</th><th>Digital transformation</th></tr></thead><tbody><tr><td><b>Pesantren</b></td><td>Data santri dan rapor dipindai atau diketik ke spreadsheet</td><td>Pembayaran syahriah lewat virtual account; nilai diinput ustaz di aplikasi</td><td>Wali santri memantau perkembangan anak secara daring; pesantren membuka kelas daring berbayar untuk alumni dan masyarakat</td></tr><tr><td><b>UMKM keripik</b></td><td>Buku catatan pesanan difoto dan disimpan di galeri HP</td><td>Kasir digital mencatat stok dan penjualan otomatis</td><td>Menjual paket langganan bulanan ke kantor-kantor berdasarkan data pola pesanan</td></tr><tr><td><b>Kelurahan</b></td><td>Arsip surat kertas dipindai menjadi PDF</td><td>Pengajuan surat pengantar lewat formulir daring</td><td>Layanan terintegrasi dengan data kependudukan; warga tidak perlu datang dan tidak perlu menyerahkan fotokopi berulang</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pendorong</span><span>Indikator 2</span></div><h2>Lima domain yang berubah di era digital</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Domain</th><th>Dari…</th><th>Menjadi…</th><th>Contoh di Indonesia</th></tr></thead><tbody><tr><td><b>Customers</b></td><td>pasar massal yang pasif</td><td><button type=\"button\" class=\"term\" data-term=\"customer-network\">jaringan pelanggan</button> yang aktif</td><td>ulasan pembeli di marketplace</td></tr><tr><td><b>Competition</b></td><td>pesaing dalam industri yang sama</td><td>penantang dari luar industri</td><td>bank bersaing dengan dompet digital</td></tr><tr><td><b>Data</b></td><td>mahal, dikumpulkan terbatas</td><td>mengalir terus; aset strategis</td><td>jejak transaksi QRIS</td></tr><tr><td><b>Innovation</b></td><td>produk jadi, uji belakangan</td><td>eksperimen cepat, berulang</td><td>fitur aplikasi diuji ke sebagian pengguna</td></tr><tr><td><b>Value</b></td><td><button type=\"button\" class=\"term\" data-term=\"value-proposition\">proposisi nilai</button> tetap</td><td>terus beradaptasi</td><td>toko buku menjadi komunitas dan langganan</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Kolom dari–menjadi diringkas dari Rogers (2016); contoh oleh dosen (ilustrasi).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\" style=\"background:var(--warn-soft);color:var(--warn)\">Hambatan</span><span>Indikator 2</span></div><h2>Mengapa transformasi sering tersendat?</h2><div class=\"grid3\"><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg><button type=\"button\" class=\"term\" data-term=\"inertia\">Inersia</button></h3><p>Struktur, kebiasaan, dan anggaran lama membuat organisasi cenderung bertahan pada cara lama.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Resistensi</h3><p>Pegawai khawatir kehilangan peran, beban kerja bertambah, atau tidak percaya diri memakai teknologi.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg><button type=\"button\" class=\"term\" data-term=\"legacy-system\">Sistem warisan</button></h3><p>Aplikasi lama sulit diintegrasikan; data tersebar di banyak aplikasi yang tidak saling bicara.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Talenta &amp; literasi</h3><p>Kurang SDM yang paham teknologi sekaligus proses bisnis.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Visi kepemimpinan</h3><p>Transformasi dianggap \"urusan bagian IT\", bukan agenda pimpinan.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Sumber daya</h3><p>Anggaran dan waktu terbatas; hasil jangka pendek tidak langsung terlihat.</p></div></div><p class=\"muted\" style=\"margin-top:.6em;font-size:.85em\">Inersia dan resistensi sebagai penghambat diuraikan Vial <span class=\"cite\">(2019)</span>; butir lainnya rangkuman dosen dari Westerman et al. (2014) dan Rogers (2023).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Lanskap Indonesia</span><span>Indikator 3</span></div><h2><button type=\"button\" class=\"term\" data-term=\"digital-economy\">Ekonomi digital</button> Indonesia</h2><div class=\"grid3\"><div class=\"card hl\"><div class=\"big\">79,5%</div><p>penetrasi internet 2024, atau sekitar <b>221,5 juta</b> penduduk <span class=\"cite\">(APJII, 2024)</span>.</p></div><div class=\"card hl\"><div class=\"big\">US$90 miliar</div><p><button type=\"button\" class=\"term\" data-term=\"gmv\">GMV</button> ekonomi digital Indonesia 2024, terbesar di Asia Tenggara, tumbuh 13% dari 2023 <span class=\"cite\">(Google et al., 2024)</span>.</p></div><div class=\"card\"><div class=\"big\">Perpres 82/2023</div><p>kebijakan percepatan transformasi digital dan keterpaduan layanan digital nasional.</p></div></div><div class=\"callout\" style=\"margin-top:.9em\">Pengguna sudah digital; pertanyaannya adalah apakah <b>organisasi</b> di sekitarnya (UMKM, instansi, kampus, pesantren) ikut berubah.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\" style=\"background:var(--warn-soft);color:var(--warn)\">Studi kasus</span><span>Swasta dan pemerintah · indikator 3</span></div><h2>Dua contoh transformasi di Indonesia</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><path d=\"M12 18h.01\"/></svg>Gojek</h3><ul><li>2010: layanan ojek dengan <b>20 pengemudi dan 1 call center</b>.</li><li>2015: aplikasi diluncurkan; pesanan naik dari sekitar 3.000 menjadi 10.000 per hari.</li><li>Kemudian berkembang menjadi <button type=\"button\" class=\"term\" data-term=\"super-app\">super app</button>: transportasi, pesan-antar makanan, pembayaran, dan layanan bisnis.</li></ul><p class=\"muted\" style=\"font-size:.85em\"><span class=\"cite\">(Liputan6.com, 2022)</span></p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg>PeduliLindungi → SATUSEHAT Mobile</h3><ul><li>Mulai 1 Maret 2023, aplikasi PeduliLindungi bertransformasi menjadi SATUSEHAT Mobile.</li><li>Fungsi bergeser dari penanganan pandemi ke catatan kesehatan pribadi.</li><li>Direncanakan terhubung dengan rekam medis elektronik melalui platform SATUSEHAT.</li></ul><p class=\"muted\" style=\"font-size:.85em\"><span class=\"cite\">(Antara, 2023)</span></p></div></div><div class=\"callout\" style=\"margin-top:.8em\">Pada tahap mana masing-masing? Apa pendorong dan hambatannya?</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Diskusi</span><span>Kelompok 4–5 orang · 15 menit</span></div><h2>Bedah contoh transformasi di sekitar kita</h2><div class=\"cols\"><div><p class=\"lead\">Pilih satu organisasi yang Anda kenal (UMKM, instansi, kampus, pesantren/lembaga NU).</p><ol><li>Apa inisiatif digital yang dilakukan?</li><li>Termasuk tahap apa: digitization, digitalization, atau digital transformation? Beri alasan.</li><li>Domain mana (Rogers) yang menjadi pendorongnya?</li><li>Hambatan apa yang terlihat atau mungkin muncul?</li></ol></div><div class=\"tw\"><table class=\"t\"><thead><tr><th>Aspek</th><th>Temuan kelompok</th></tr></thead><tbody><tr><td>Organisasi &amp; inisiatif</td><td>…</td></tr><tr><td>Tahap + alasan</td><td>…</td></tr><tr><td>Pendorong</td><td>…</td></tr><tr><td>Hambatan</td><td>…</td></tr></tbody></table><p class=\"muted\" style=\"font-size:.85em;margin-top:.4em\">Salin tabel ini di kertas atau dokumen kelompok.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>Digitization</b> mengubah data, <b>digitalization</b> mengubah proses, <b>digital transformation</b> mengubah organisasi dan model bisnis.</li><li>Transformasi digital adalah perubahan signifikan yang dipicu <b>kombinasi</b> teknologi, bukan satu aplikasi.</li><li>Pendorongnya lima domain: <b>customers, competition, data, innovation, value</b>.</li><li>Hambatan utama: <b>inersia dan resistensi</b>, ditambah sistem warisan, talenta, visi, sumber daya.</li><li>Indonesia sudah sangat terhubung; tantangannya adalah <b>organisasi</b> yang ikut berubah.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"a\" data-why=\"Hanya bentuk informasinya yang berubah dari analog ke digital; proses dan layanan belum berubah.\"><p class=\"q\">Pesantren memindai rapor kertas santri menjadi PDF. Ini termasuk…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. digitization</button><button type=\"button\" data-o=\"b\">B. digitalization</button><button type=\"button\" data-o=\"c\">C. digital transformation</button><button type=\"button\" data-o=\"d\">D. disruption</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"Lima domain Rogers: Customers, Competition, Data, Innovation, Value.\"><p class=\"q\">Manakah yang BUKAN domain transformasi digital menurut Rogers (2016)?</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Customers</button><button type=\"button\" data-o=\"b\">B. Competition</button><button type=\"button\" data-o=\"c\">C. Hardware</button><button type=\"button\" data-o=\"d\">D. Value</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Vial (2019) menyoroti inersia organisasi dan resistensi dari pegawai.\"><p class=\"q\">Dua penghambat utama transformasi digital menurut Vial (2019) adalah…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. biaya dan waktu</button><button type=\"button\" data-o=\"b\">B. inersia dan resistensi</button><button type=\"button\" data-o=\"c\">C. regulasi dan pajak</button><button type=\"button\" data-o=\"d\">D. internet dan listrik</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit</span></div><h2>Tugas mandiri</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bab pengantar Rogers (2016), <i>The Digital Transformation Playbook</i>, tentang lima domain; atau bab pengantar Rogers (2023), <i>The Digital Transformation Roadmap</i>.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Menulis ringkasan kasus</h3><p>Pilih <b>satu kasus transformasi digital di Indonesia</b> (selain Gojek dan SATUSEHAT) dari sumber tepercaya. Tulis ringkasan 300–400 kata dalam bahasa Indonesia: apa yang berubah, termasuk tahap apa, pendorong (lima domain), hambatan, dan pelajaran untuk organisasi lain. Cantumkan sumber (APA 7).</p></div></div><div class=\"callout\" style=\"margin-top:.8em\">Mulai pikirkan calon <b>organisasi mitra</b>. Kelompok dan mitra dibentuk di Pertemuan 2.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Digitization</span></dt><dd>Mengubah informasi analog (kertas, suara, gambar fisik) menjadi format digital tanpa mengubah cara kerja. <i>(digitisasi)</i></dd></div><div><dt><span class=\"en\">Digitalization</span></dt><dd>Memakai teknologi digital untuk mengubah atau mengotomasi proses bisnis yang sudah ada. <i>(digitalisasi)</i></dd></div><div><dt><span class=\"en\">Digital transformation</span></dt><dd>Perubahan menyeluruh pada organisasi, termasuk model bisnis, proses, dan budaya, yang dipicu kombinasi teknologi digital untuk menciptakan nilai baru. <i>(transformasi digital)</i></dd></div><div><dt><span class=\"en\">Digital technology</span></dt><dd>Kombinasi teknologi informasi, komputasi, komunikasi, dan konektivitas, misalnya cloud, data, AI, IoT, dan mobile. <i>(teknologi digital)</i></dd></div><div><dt><span class=\"en\">Business model</span></dt><dd>Cara organisasi menciptakan, menyampaikan, dan menangkap nilai. <i>(model bisnis)</i></dd></div><div><dt><span class=\"en\">Value proposition</span></dt><dd>Manfaat yang ditawarkan organisasi kepada pelanggan atau pengguna layanannya. <i>(proposisi nilai)</i></dd></div><div><dt><span class=\"en\">Customer network</span></dt><dd>Pelanggan sebagai jaringan yang aktif saling terhubung, memberi ulasan, dan memengaruhi satu sama lain. <i>(jaringan pelanggan)</i></dd></div><div><dt><span class=\"en\">Disruption</span></dt><dd>Perubahan pasar ketika pendatang baru dengan model bisnis berbeda menggeser pemain lama. <i>(disrupsi)</i></dd></div><div><dt><span class=\"en\">Legacy system</span></dt><dd>Sistem lama yang masih dipakai tetapi sulit diubah atau diintegrasikan dengan teknologi baru. <i>(sistem warisan)</i></dd></div><div><dt><span class=\"en\">Inertia</span></dt><dd>Kecenderungan organisasi mempertahankan cara kerja, struktur, dan sumber daya yang sudah ada. <i>(inersia / kelembaman organisasi)</i></dd></div><div><dt><span class=\"en\">Digital economy</span></dt><dd>Kegiatan ekonomi yang berlangsung melalui atau bergantung pada teknologi digital, misalnya e-commerce dan pembayaran digital. <i>(ekonomi digital)</i></dd></div><div><dt><span class=\"en\">Gross merchandise value (GMV)</span></dt><dd>Total nilai transaksi barang/jasa yang terjadi melalui platform digital dalam periode tertentu. <i>(nilai transaksi bruto)</i></dd></div><div><dt><span class=\"en\">Super app</span></dt><dd>Satu aplikasi yang menggabungkan banyak layanan, misalnya transportasi, pesan-antar makanan, dan pembayaran. <i>(aplikasi super)</i></dd></div><div><dt><span class=\"en\">Stakeholder</span></dt><dd>Orang, kelompok, atau organisasi yang memengaruhi atau dipengaruhi oleh sebuah inisiatif. <i>(pemangku kepentingan)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\" style=\"font-size:.74em;gap:.3em\"><li>Asosiasi Penyelenggara Jasa Internet Indonesia. (2024, 7 Februari). <i>APJII: Jumlah pengguna internet Indonesia tembus 221 juta orang</i>. https://apjii.or.id/berita/d/apjii-jumlah-pengguna-internet-indonesia-tembus-221-juta-orang</li><li>Antara. (2023, 28 Februari). <i>Kemenkes: PeduliLindungi bertransformasi jadi SatuSehat mulai besok</i>. https://www.antaranews.com/berita/3417786/</li><li>Google, Temasek, &amp; Bain &amp; Company. (2024). <i>e-Conomy SEA 2024</i>. https://economysea.withgoogle.com/</li><li>Liputan6.com. (2022, 15 Desember). <i>Profil PT Gojek Indonesia, sejarah, alamat kantor, dan produk layanannya</i>. https://www.liputan6.com/hot/read/5154461/</li><li>Peraturan Presiden Republik Indonesia Nomor 82 Tahun 2023 tentang Percepatan Transformasi Digital dan Keterpaduan Layanan Digital Nasional.</li><li>Rogers, D. L. (2016). <i>The digital transformation playbook: Rethink your business for the digital age</i>. Columbia Business School Publishing.</li><li>Rogers, D. L. (2023). <i>The digital transformation roadmap: Rebuild your organization for continuous change</i>. Columbia Business School Publishing.</li><li>Verhoef, P. C., Broekhuizen, T., Bart, Y., Bhattacharya, A., Dong, J. Q., Fabian, N., &amp; Haenlein, M. (2021). Digital transformation: A multidisciplinary reflection and research agenda. <i>Journal of Business Research, 122</i>, 889–901. https://doi.org/10.1016/j.jbusres.2019.09.022</li><li>Vial, G. (2019). Understanding digital transformation: A review and a research agenda. <i>The Journal of Strategic Information Systems, 28</i>(2), 118–144. https://doi.org/10.1016/j.jsis.2019.01.003</li><li>Westerman, G., Bonnet, D., &amp; McAfee, A. (2014). <i>Leading digital: Turning technology into business transformation</i>. Harvard Business Review Press.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 2.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":2,"title":"Teknologi Pendorong (1)","subtitle":"Cloud computing, big data dan analitik, AI dan generative AI","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 2</span><span>Transformasi Digital · SI24W15</span></div><h1>Teknologi Pendorong (1)</h1><p class=\"lead\">Cloud computing, big data dan analitik, AI dan generative AI</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 2–3 · Sub-CPMK-2</div><div><b>Hari ini</b>Konsep + bentuk kelompok &amp; pilih mitra</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-2 · Pertemuan 2–3</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menjelaskan peran teknologi pendorong (cloud, data, AI, IoT, mobile) dalam transformasi digital (C2).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1 dan 2 untuk cloud, data, dan AI; indikator 3 dimulai)</span></h3><ol><li>Ketepatan menjelaskan karakteristik setiap teknologi pendorong.</li><li>Ketepatan mengaitkan teknologi dengan nilai bisnis yang dihasilkan.</li><li>Ketepatan mengidentifikasi teknologi yang dipakai organisasi mitra. <span class=\"muted\">(dimulai hari ini, dilanjutkan Pertemuan 3)</span></li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menjelaskan konsep transformasi digital, teknologi pendorongnya, dan model bisnis digital.</dd><dt>CPL-3</dt><dd class=\"id\">Menguasai konsep teoritis Sistem Informasi, Ilmu Komputer, dan Bisnis Digital secara umum serta konsep khusus secara mendalam untuk memformulasikan solusi prosedural.</dd><dt>Waktu</dt><dd>Tatap muka 2×50 menit · Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Produk (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 2–3</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 1 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Apa beda digitization, digitalization, dan digital transformation?</li><li>Sebutkan lima domain transformasi digital menurut Rogers.</li><li>Mengapa membeli aplikasi mahal belum tentu berarti transformasi digital?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Kerangka</span><span>Indikator 2</span></div><h2>Teknologi menciptakan nilai di tiga area</h2><figure class=\"fig\"><svg viewBox=\"0 0 860 250\" role=\"img\" aria-label=\"Teknologi digital seperti cloud, data dan analitik, AI, IoT, mobile, dan API di kiri, dihubungkan panah ke tiga area penciptaan nilai di kanan: customer experience, operational processes, dan business models.\"><defs><marker id=\"dv\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><text x=\"20\" y=\"22\" class=\"s-hd\">TEKNOLOGI DIGITAL</text><rect x=\"20\" y=\"32\" width=\"220\" height=\"29\" rx=\"8\" class=\"s-acc\"/><text x=\"130\" y=\"51\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Cloud</text><rect x=\"20\" y=\"67\" width=\"220\" height=\"29\" rx=\"8\" class=\"s-acc\"/><text x=\"130\" y=\"86\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Data &amp; analitik</text><rect x=\"20\" y=\"102\" width=\"220\" height=\"29\" rx=\"8\" class=\"s-acc\"/><text x=\"130\" y=\"121\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">AI / GenAI</text><rect x=\"20\" y=\"137\" width=\"220\" height=\"29\" rx=\"8\" class=\"s-box\"/><text x=\"130\" y=\"156\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">IoT</text><rect x=\"20\" y=\"172\" width=\"220\" height=\"29\" rx=\"8\" class=\"s-box\"/><text x=\"130\" y=\"191\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Mobile &amp; sosial</text><rect x=\"20\" y=\"207\" width=\"220\" height=\"29\" rx=\"8\" class=\"s-box\"/><text x=\"130\" y=\"226\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">API &amp; platform</text><line x1=\"250\" y1=\"130\" x2=\"440\" y2=\"130\" class=\"s-line\" marker-end=\"url(#dv)\"/><text x=\"345\" y=\"120\" text-anchor=\"middle\" class=\"s-s\">dipakai untuk mengubah…</text><text x=\"460\" y=\"22\" class=\"s-hd\">AREA PENCIPTAAN NILAI</text><rect x=\"460\" y=\"34\" width=\"380\" height=\"58\" rx=\"12\" class=\"s-soft\"/><text x=\"650\" y=\"58\" text-anchor=\"middle\" class=\"s-t\">Customer experience</text><text x=\"650\" y=\"78\" text-anchor=\"middle\" class=\"s-s\">cara melayani &amp; memahami pelanggan</text><rect x=\"460\" y=\"104\" width=\"380\" height=\"58\" rx=\"12\" class=\"s-soft\"/><text x=\"650\" y=\"128\" text-anchor=\"middle\" class=\"s-t\">Operational processes</text><text x=\"650\" y=\"148\" text-anchor=\"middle\" class=\"s-s\">cara bekerja di dalam organisasi</text><rect x=\"460\" y=\"174\" width=\"380\" height=\"58\" rx=\"12\" class=\"s-soft\"/><text x=\"650\" y=\"198\" text-anchor=\"middle\" class=\"s-t\">Business models</text><text x=\"650\" y=\"218\" text-anchor=\"middle\" class=\"s-s\">cara menciptakan &amp; menangkap nilai</text></svg><figcaption>Tiga area tempat teknologi digital menciptakan nilai, diadaptasi dari Westerman et al. (2014). Kotak kuning: dibahas hari ini; lainnya di Pertemuan 3.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknologi 1</span><span>Cloud computing · indikator 1</span></div><h2>Apa itu <button type=\"button\" class=\"term\" data-term=\"cloud-computing\">cloud computing</button>?</h2><div class=\"callout\"><span class=\"quote\" style=\"font-size:.95em\">Model yang memungkinkan akses jaringan yang mudah dan sesuai kebutuhan ke kumpulan sumber daya komputasi bersama yang dapat disediakan dan dilepas dengan cepat, dengan upaya pengelolaan minimal.</span><div class=\"muted\" style=\"margin-top:.3em;font-size:.85em\"><span class=\"cite\">(Mell &amp; Grance, 2011, terjemahan bebas)</span></div></div><figure class=\"fig\"><svg viewBox=\"0 0 880 250\" style=\"max-height:12.5em\" role=\"img\" aria-label=\"Definisi cloud computing NIST: lima karakteristik esensial (on-demand self-service, broad network access, resource pooling, rapid elasticity, measured service), tiga model layanan (SaaS, PaaS, IaaS), dan empat model penerapan (private, community, public, hybrid).\"><text x=\"10\" y=\"20\" class=\"s-hd\">5 ESSENTIAL CHARACTERISTICS</text><rect x=\"10\" y=\"30\" width=\"166\" height=\"44\" rx=\"8\" class=\"s-acc\"/><text x=\"93\" y=\"57\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">On-demand self-service</text><rect x=\"184\" y=\"30\" width=\"166\" height=\"44\" rx=\"8\" class=\"s-acc\"/><text x=\"267\" y=\"57\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Broad network access</text><rect x=\"358\" y=\"30\" width=\"166\" height=\"44\" rx=\"8\" class=\"s-acc\"/><text x=\"441\" y=\"57\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Resource pooling</text><rect x=\"532\" y=\"30\" width=\"166\" height=\"44\" rx=\"8\" class=\"s-acc\"/><text x=\"615\" y=\"57\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Rapid elasticity</text><rect x=\"706\" y=\"30\" width=\"166\" height=\"44\" rx=\"8\" class=\"s-acc\"/><text x=\"789\" y=\"57\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Measured service</text><text x=\"10\" y=\"108\" class=\"s-hd\">3 SERVICE MODELS</text><rect x=\"10\" y=\"118\" width=\"280\" height=\"50\" rx=\"8\" class=\"s-soft\"/><text x=\"150\" y=\"140\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">SaaS</text><text x=\"150\" y=\"159\" text-anchor=\"middle\" class=\"s-s\">aplikasi siap pakai</text><rect x=\"302\" y=\"118\" width=\"280\" height=\"50\" rx=\"8\" class=\"s-soft\"/><text x=\"442\" y=\"140\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">PaaS</text><text x=\"442\" y=\"159\" text-anchor=\"middle\" class=\"s-s\">platform untuk membangun aplikasi</text><rect x=\"594\" y=\"118\" width=\"280\" height=\"50\" rx=\"8\" class=\"s-soft\"/><text x=\"734\" y=\"140\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">IaaS</text><text x=\"734\" y=\"159\" text-anchor=\"middle\" class=\"s-s\">server, penyimpanan, jaringan</text><text x=\"10\" y=\"200\" class=\"s-hd\">4 DEPLOYMENT MODELS</text><rect x=\"10\" y=\"208\" width=\"210\" height=\"36\" rx=\"18\" class=\"s-box\"/><text x=\"115\" y=\"231\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Private cloud</text><rect x=\"228\" y=\"208\" width=\"210\" height=\"36\" rx=\"18\" class=\"s-box\"/><text x=\"333\" y=\"231\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Community cloud</text><rect x=\"446\" y=\"208\" width=\"210\" height=\"36\" rx=\"18\" class=\"s-box\"/><text x=\"551\" y=\"231\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Public cloud</text><rect x=\"664\" y=\"208\" width=\"210\" height=\"36\" rx=\"18\" class=\"s-box\"/><text x=\"769\" y=\"231\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Hybrid cloud</text></svg><figcaption>Struktur definisi cloud computing menurut NIST SP 800-145 (Mell &amp; Grance, 2011). Nama karakteristik dan model ditulis sesuai sumber; keterangan singkat oleh dosen.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknologi 1</span><span>Cloud computing · indikator 1–2</span></div><h2>Siapa mengelola apa?</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\"><thead><tr><th>Model</th><th>Yang dikelola pengguna</th><th>Contoh di sekitar kita</th></tr></thead><tbody><tr><td><b><button type=\"button\" class=\"term\" data-term=\"saas\">SaaS</button></b></td><td>data dan pengaturan akun</td><td>email dan dokumen kampus di Google Workspace atau Microsoft 365; aplikasi kasir langganan untuk UMKM</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"paas\">PaaS</button></b></td><td>aplikasi dan data</td><td>tim kampus menjalankan aplikasi web di layanan hosting aplikasi tanpa mengurus server</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"iaas\">IaaS</button></b></td><td>sistem operasi, aplikasi, data</td><td>instansi menyewa server virtual untuk memindahkan aplikasi dari ruang server sendiri</td></tr></tbody></table></div><div><div class=\"card ok\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Nilai</h3><p>Mulai cepat tanpa beli server, biaya sesuai pemakaian, kapasitas mengikuti beban (<button type=\"button\" class=\"term\" data-term=\"elasticity\">elasticity</button>).</p></div><div class=\"card warn\" style=\"margin-top:.6em\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Risiko</h3><p>Ketergantungan internet, <button type=\"button\" class=\"term\" data-term=\"vendor-lock-in\">vendor lock-in</button>, lokasi dan keamanan data, biaya membengkak bila tak dipantau.</p></div></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Pembagian tanggung jawab dirangkum dari definisi model layanan NIST (Mell &amp; Grance, 2011). Contoh adalah ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknologi 2</span><span>Big data · indikator 1</span></div><h2><button type=\"button\" class=\"term\" data-term=\"big-data\">Big data</button>: tiga V</h2><div class=\"grid3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Volume</h3><p>Jumlah data sangat besar.</p><p class=\"muted\" style=\"font-size:.9em\">Seluruh transaksi harian sebuah marketplace.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Velocity</h3><p>Data datang sangat cepat, sering terus-menerus.</p><p class=\"muted\" style=\"font-size:.9em\">Klik, pembayaran QRIS, dan lokasi pengemudi setiap detik.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20\"/></svg>Variety</h3><p>Jenis data beragam: tabel, teks, gambar, suara, video.</p><p class=\"muted\" style=\"font-size:.9em\">Ulasan pelanggan, foto produk, rekaman layanan.</p></div></div><p style=\"margin-top:.8em\">Tiga dimensi ini dikemukakan Laney <span class=\"cite\">(2001)</span>. Literatur kemudian menambahkan V lain (mis. <i>veracity</i>, <i>value</i>).</p><div class=\"callout\" style=\"margin-top:.6em\">Data bernilai bukan karena banyak, tetapi karena <b>dipakai untuk keputusan</b>.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknologi 2</span><span>Analitik · indikator 1–2</span></div><h2>Dari data ke keputusan: tiga jenis <button type=\"button\" class=\"term\" data-term=\"analytics\">analitik</button></h2><figure class=\"fig\"><svg viewBox=\"0 0 860 200\" role=\"img\" aria-label=\"Alur dari data mentah ke keputusan. Analitik deskriptif menjawab apa yang terjadi, analitik prediktif menjawab apa yang akan terjadi, analitik preskriptif menjawab apa yang sebaiknya dilakukan. Semakin ke kanan nilai untuk keputusan makin tinggi.\"><defs><marker id=\"dd\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"50\" width=\"130\" height=\"80\" rx=\"12\" class=\"s-box\"/><text x=\"75\" y=\"85\" text-anchor=\"middle\" class=\"s-t\">Data</text><text x=\"75\" y=\"106\" text-anchor=\"middle\" class=\"s-s\">transaksi, log, sensor</text><rect x=\"180\" y=\"50\" width=\"180\" height=\"80\" rx=\"12\" class=\"s-soft\"/><text x=\"270\" y=\"84\" text-anchor=\"middle\" class=\"s-t\">Descriptive</text><text x=\"270\" y=\"106\" text-anchor=\"middle\" class=\"s-s\">Apa yang terjadi?</text><rect x=\"380\" y=\"50\" width=\"180\" height=\"80\" rx=\"12\" class=\"s-soft\"/><text x=\"470\" y=\"84\" text-anchor=\"middle\" class=\"s-t\">Predictive</text><text x=\"470\" y=\"106\" text-anchor=\"middle\" class=\"s-s\">Apa yang akan terjadi?</text><rect x=\"580\" y=\"50\" width=\"180\" height=\"80\" rx=\"12\" class=\"s-acc\"/><text x=\"670\" y=\"84\" text-anchor=\"middle\" class=\"s-t\">Prescriptive</text><text x=\"670\" y=\"106\" text-anchor=\"middle\" class=\"s-s\">Apa yang sebaiknya dilakukan?</text><line x1=\"142\" y1=\"90\" x2=\"176\" y2=\"90\" class=\"s-line\" marker-end=\"url(#dd)\"/><line x1=\"362\" y1=\"90\" x2=\"376\" y2=\"90\" class=\"s-line\" marker-end=\"url(#dd)\"/><line x1=\"562\" y1=\"90\" x2=\"576\" y2=\"90\" class=\"s-line\" marker-end=\"url(#dd)\"/><line x1=\"180\" y1=\"160\" x2=\"760\" y2=\"160\" class=\"s-line\" marker-end=\"url(#dd)\"/><text x=\"470\" y=\"185\" text-anchor=\"middle\" class=\"s-s\">makin ke kanan: makin dekat ke keputusan, makin butuh data dan model yang baik</text></svg><figcaption>Tiga jenis analitik, diadaptasi dari Sharda et al. (2020). Nama jenis ditulis sesuai sumber.</figcaption></figure><div class=\"grid3\" style=\"margin-top:.5em\"><div class=\"card\"><p><b>Descriptive</b>: dashboard jumlah santri baru per kabupaten.</p></div><div class=\"card\"><p><b>Predictive</b>: perkiraan jumlah pendaftar tahun depan.</p></div><div class=\"card hl\"><p><b>Prescriptive</b>: rekomendasi wilayah dan waktu promosi terbaik.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknologi 3</span><span>Kecerdasan artifisial · indikator 1</span></div><h2>Apa itu <button type=\"button\" class=\"term\" data-term=\"ai\">AI</button>?</h2><div class=\"cols w\"><div><div class=\"callout\"><span class=\"quote\" style=\"font-size:1.05em\">Sistem AI adalah sistem berbasis mesin yang, untuk tujuan eksplisit atau implisit, menyimpulkan dari masukan yang diterimanya cara menghasilkan keluaran seperti prediksi, konten, rekomendasi, atau keputusan yang dapat memengaruhi lingkungan fisik atau virtual.</span><div class=\"muted\" style=\"margin-top:.3em;font-size:.85em\"><span class=\"cite\">(OECD, 2024, terjemahan bebas)</span></div></div><p style=\"margin-top:.7em\">Sistem AI berbeda-beda tingkat otonomi dan kemampuan adaptasinya setelah diterapkan <span class=\"cite\">(OECD, 2024)</span>.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Empat jenis keluaran</h3><ul><li><b>Prediksi</b>: risiko mahasiswa putus kuliah</li><li><b>Konten</b>: draf balasan layanan pelanggan</li><li><b>Rekomendasi</b>: produk untuk pembeli</li><li><b>Keputusan</b>: persetujuan pinjaman otomatis</li></ul><p class=\"muted\" style=\"font-size:.85em\">Contoh ilustrasi.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknologi 3</span><span>Generative AI · indikator 1–2</span></div><h2><button type=\"button\" class=\"term\" data-term=\"generative-ai\">Generative AI</button>: peluang dan kehati-hatian</h2><div class=\"cols\"><div class=\"card ok\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Peluang nilai</h3><ul><li><b>Customer experience</b>: menjawab pertanyaan pendaftar 24 jam</li><li><b>Operational processes</b>: merangkum notulen, menyusun draf surat, membantu menulis kode</li><li><b>Business models</b>: layanan baru berbasis konten yang dipersonalisasi</li></ul></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Kehati-hatian</h3><ul><li><button type=\"button\" class=\"term\" data-term=\"hallucination\">Halusinasi</button>: jawaban meyakinkan tetapi salah</li><li>Data pribadi atau rahasia ikut terunggah ke layanan pihak ketiga</li><li>Hak cipta dan kejujuran akademik</li><li>Tetap butuh manusia yang memeriksa</li></ul></div></div><p class=\"muted\" style=\"margin-top:.6em;font-size:.85em\">Definisi kerja mata kuliah ini; pengelompokan peluang mengikuti tiga area Westerman et al. (2014).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Dari teknologi ke kapabilitas</span><span>Indikator 2</span></div><h2>Dua fondasi organisasi digital <span class=\"cite\">(Ross et al., 2019)</span></h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg><button type=\"button\" class=\"term\" data-term=\"operational-backbone\">Operational backbone</button></h3><p>Sistem inti, data, dan proses terintegrasi yang membuat operasi harian <b>andal dan efisien</b>.</p><p class=\"muted\" style=\"font-size:.9em\">Contoh: SIAKAD, keuangan, dan data mahasiswa kampus yang sudah terintegrasi dan bersih.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg><button type=\"button\" class=\"term\" data-term=\"digital-platform\">Digital platform</button></h3><p>Komponen bisnis, data, dan infrastruktur yang <b>dapat dipakai ulang</b> untuk cepat membangun layanan digital baru.</p><p class=\"muted\" style=\"font-size:.9em\">Contoh: layanan login tunggal dan data mahasiswa yang bisa dipakai aplikasi presensi, e-learning, dan layanan surat.</p></div></div><div class=\"callout\" style=\"margin-top:.8em\">Cloud, data, dan AI baru memberi nilai berkelanjutan bila tersusun menjadi fondasi ini, bukan aplikasi yang berdiri sendiri-sendiri.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Latihan</span><span>Kelompok kecil · 12 menit · kasus ilustrasi</span></div><h2>Teknologi apa, untuk nilai apa?</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Kasus</th><th>Teknologi (cloud / data / AI)</th><th>Area nilai</th><th>Nilai yang dihasilkan</th></tr></thead><tbody><tr><td><b>A.</b> UMKM batik tulis di Sidoarjo ingin tahu motif mana yang paling laku per musim.</td><td>…</td><td>…</td><td>…</td></tr><tr><td><b>B.</b> Dinas perizinan kabupaten kewalahan menjawab pertanyaan berulang soal syarat izin usaha.</td><td>…</td><td>…</td><td>…</td></tr><tr><td><b>C.</b> Pesantren dengan tiga cabang ingin data santri dan keuangan terpusat tanpa membeli server.</td><td>…</td><td>…</td><td>…</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Kasus ilustrasi. Satu kasus boleh memakai lebih dari satu teknologi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Pembentukan kelompok · 15 menit</span></div><h2>Bentuk kelompok, pilih organisasi mitra</h2><div class=\"cols\"><div><p><b>Kelompok</b>: 4–5 orang. Tetapkan peran awal:</p><ul><li>Koordinator kelompok</li><li>Penghubung mitra</li><li>Analis teknologi dan proses</li><li>Penanggung jawab dokumen dan sumber</li></ul><p class=\"muted\">Peran boleh dirotasi, tetapi harus tercatat.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Kriteria mitra yang baik</h3><ul><li>Organisasi nyata: UMKM, instansi pemerintah, perguruan tinggi, atau pesantren/lembaga NU.</li><li>Sudah atau sedang memakai teknologi digital, sekecil apa pun.</li><li>Bersedia diwawancarai 3–4 kali selama semester.</li><li>Ada narahubung yang bisa memberi informasi proses dan data.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Tugas 1</span><span>30% · Pertemuan 2–7</span></div><h2>Analisis kondisi digital organisasi mitra</h2><div class=\"grid3\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>P2–3 · 10%</h3><p>Pemetaan teknologi digital yang dipakai mitra dan nilai yang dihasilkannya.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>P4–5 · 10%</h3><p>Business Model Canvas mitra dan proposisi nilai digitalnya.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>P6–7 · 10%</h3><p>Analisis proses (as-is dan to-be) dan customer journey, dipresentasikan di Pertemuan 7.</p></div></div><div class=\"callout\" style=\"margin-top:1em\">Lembar tugas dan rubrik lengkap dibagikan terpisah di grup kelas. Tugas 2 memakai organisasi yang <b>sama</b>.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Teknologi bernilai bila mengubah <b>customer experience, operational processes, atau business models</b>.</li><li><b>Cloud</b> (NIST): 5 karakteristik, 3 model layanan (SaaS, PaaS, IaaS), 4 model penerapan.</li><li><b>Big data</b>: volume, velocity, variety; <b>analitik</b>: deskriptif, prediktif, preskriptif.</li><li><b>AI</b> menyimpulkan dari data untuk menghasilkan prediksi, konten, rekomendasi, atau keputusan; AI generatif butuh pemeriksaan manusia.</li><li>Teknologi perlu disusun menjadi <b>operational backbone</b> dan <b>digital platform</b>.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"c\" data-why=\"Prodi memakai aplikasi siap pakai milik penyedia; yang dikelola hanya akun dan data.\"><p class=\"q\">Prodi memakai Google Workspace untuk email dan dokumen. Model layanannya…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. IaaS</button><button type=\"button\" data-o=\"b\">B. PaaS</button><button type=\"button\" data-o=\"c\">C. SaaS</button><button type=\"button\" data-o=\"d\">D. Private cloud</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Analitik prediktif menjawab apa yang kemungkinan akan terjadi.\"><p class=\"q\">\"Berapa perkiraan pendaftar santri tahun depan?\" dijawab dengan analitik…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. deskriptif</button><button type=\"button\" data-o=\"b\">B. prediktif</button><button type=\"button\" data-o=\"c\">C. preskriptif</button><button type=\"button\" data-o=\"d\">D. manual</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"a\" data-why=\"Rapid elasticity: kapasitas bertambah atau berkurang cepat mengikuti beban.\"><p class=\"q\">Saat KRS, kapasitas SIAKAD di cloud naik otomatis lalu turun lagi. Karakteristik NIST-nya…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Rapid elasticity</button><button type=\"button\" data-o=\"b\">B. Resource pooling</button><button type=\"button\" data-o=\"c\">C. Broad network access</button><button type=\"button\" data-o=\"d\">D. Measured service</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit</span></div><h2>Tugas mandiri dan kelompok</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bagian tentang operational backbone dan digital platform dalam Ross et al. (2019), <i>Designed for Digital</i>, dan ringkasan definisi NIST SP 800-145 (3 halaman, terbuka).</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok (Tugas 1)</h3><ul><li>Pastikan organisasi mitra dan minta izin.</li><li>Wawancarai narahubung: teknologi apa saja yang dipakai, untuk apa, sejak kapan, siapa pemakainya.</li><li>Susun draf tabel pemetaan: <b>teknologi – fungsi – area nilai – nilai/manfaat – masalah</b>.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Bawa draf ke Pertemuan 3; kita lengkapi dengan IoT, mobile, dan API/platform.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Cloud computing</span></dt><dd>Model akses sumber daya komputasi bersama (server, penyimpanan, aplikasi) melalui jaringan, sesuai kebutuhan, dan cepat disediakan. <i>(komputasi awan)</i></dd></div><div><dt><span class=\"en\">Software as a Service (SaaS)</span></dt><dd>Aplikasi siap pakai yang dijalankan penyedia; pengguna cukup memakai lewat browser atau aplikasi. <i>(perangkat lunak sebagai layanan)</i></dd></div><div><dt><span class=\"en\">Platform as a Service (PaaS)</span></dt><dd>Platform untuk membangun dan menjalankan aplikasi sendiri tanpa mengelola server dan sistem operasi. <i>(platform sebagai layanan)</i></dd></div><div><dt><span class=\"en\">Infrastructure as a Service (IaaS)</span></dt><dd>Sewa server virtual, penyimpanan, dan jaringan; pengguna mengelola sistem operasi dan aplikasinya. <i>(infrastruktur sebagai layanan)</i></dd></div><div><dt><span class=\"en\">Rapid elasticity</span></dt><dd>Kemampuan kapasitas cloud bertambah atau berkurang cepat mengikuti beban. <i>(elastisitas cepat)</i></dd></div><div><dt><span class=\"en\">Vendor lock-in</span></dt><dd>Ketergantungan pada satu penyedia sehingga pindah ke penyedia lain menjadi mahal atau sulit. <i>(ketergantungan pada vendor)</i></dd></div><div><dt><span class=\"en\">Big data</span></dt><dd>Data yang volumenya besar, datangnya cepat, dan jenisnya beragam sehingga butuh cara pengolahan baru. <i>(mahadata)</i></dd></div><div><dt><span class=\"en\">Analytics</span></dt><dd>Pemakaian data, statistik, dan model untuk memahami keadaan dan mendukung keputusan. <i>(analitik)</i></dd></div><div><dt><span class=\"en\">Artificial intelligence (AI)</span></dt><dd>Sistem berbasis mesin yang, dari masukan yang diterima, menyimpulkan cara menghasilkan keluaran seperti prediksi, konten, rekomendasi, atau keputusan. <i>(kecerdasan artifisial)</i></dd></div><div><dt><span class=\"en\">Generative AI</span></dt><dd>Jenis AI yang menghasilkan konten baru (teks, gambar, kode, suara) berdasarkan pola dari data latihnya. <i>(AI generatif)</i></dd></div><div><dt><span class=\"en\">Hallucination</span></dt><dd>Keluaran AI generatif yang terdengar meyakinkan tetapi salah atau tidak berdasar. <i>(halusinasi AI)</i></dd></div><div><dt><span class=\"en\">Customer experience</span></dt><dd>Keseluruhan pengalaman pelanggan saat berinteraksi dengan organisasi di semua titik kontak. <i>(pengalaman pelanggan)</i></dd></div><div><dt><span class=\"en\">Operational backbone</span></dt><dd>Sistem inti, data, dan proses terintegrasi yang menjamin operasi harian berjalan andal. <i>(tulang punggung operasional)</i></dd></div><div><dt><span class=\"en\">Digital platform</span></dt><dd>Kumpulan komponen bisnis, data, dan infrastruktur yang dapat dipakai ulang untuk cepat membangun layanan digital baru. <i>(platform digital)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Laney, D. (2001). <i>3D data management: Controlling data volume, velocity, and variety</i> (Application Delivery Strategies, File 949). META Group.</li><li>Mell, P., &amp; Grance, T. (2011). <i>The NIST definition of cloud computing</i> (NIST Special Publication 800-145). National Institute of Standards and Technology. https://doi.org/10.6028/NIST.SP.800-145</li><li>OECD. (2024). <i>Recommendation of the Council on Artificial Intelligence</i> (OECD/LEGAL/0449; diamendemen 3 Mei 2024). OECD.</li><li>Ross, J. W., Beath, C. M., &amp; Mocker, M. (2019). <i>Designed for digital: How to architect your business for sustained success</i>. MIT Press.</li><li>Sharda, R., Delen, D., &amp; Turban, E. (2020). <i>Analytics, data science, &amp; artificial intelligence: Systems for decision support</i> (11th ed.). Pearson.</li><li>Westerman, G., Bonnet, D., &amp; McAfee, A. (2014). <i>Leading digital: Turning technology into business transformation</i>. Harvard Business Review Press.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 3.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":3,"title":"Teknologi Pendorong (2)","subtitle":"Internet of Things, mobile dan media sosial, API dan platform digital","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 3</span><span>Sub-CPMK-2 (Pertemuan 2–3) · CPMK-1 · CPL-3</span></div><h1>Teknologi Pendorong (2)</h1><p class=\"lead\">Internet of Things, mobile dan media sosial, API dan platform digital</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu menjelaskan peran teknologi pendorong (cloud, data, AI, IoT, mobile) dalam transformasi digital (C2).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":4,"title":"Model Bisnis Digital (1)","subtitle":"Model bisnis, proposisi nilai, dan Business Model Canvas","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 4</span><span>Sub-CPMK-3 (Pertemuan 4–5) · CPMK-1 · CPL-3</span></div><h1>Model Bisnis Digital (1)</h1><p class=\"lead\">Model bisnis, proposisi nilai, dan Business Model Canvas</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu memetakan model bisnis dan platform digital suatu organisasi dengan Business Model Canvas (C3).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":5,"title":"Model Bisnis Digital (2)","subtitle":"Model bisnis platform dan ekosistem, efek jaringan, contoh platform digital Indonesia","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 5</span><span>Sub-CPMK-3 (Pertemuan 4–5) · CPMK-1 · CPL-3</span></div><h1>Model Bisnis Digital (2)</h1><p class=\"lead\">Model bisnis platform dan ekosistem, efek jaringan, contoh platform digital Indonesia</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu memetakan model bisnis dan platform digital suatu organisasi dengan Business Model Canvas (C3).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":6,"title":"Transformasi Proses Bisnis","subtitle":"Pemodelan proses as-is dan to-be, otomasi proses","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 6</span><span>Sub-CPMK-4 (Pertemuan 6–7) · CPMK-2 · CPL-4</span></div><h1>Transformasi Proses Bisnis</h1><p class=\"lead\">Pemodelan proses as-is dan to-be, otomasi proses</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu menganalisis peluang digitalisasi proses bisnis dan pengalaman pelanggan (C4).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":7,"title":"Pengalaman Pelanggan Digital","subtitle":"Customer journey map, pengalaman omnichannel · presentasi Tugas 1","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 7</span><span>Sub-CPMK-4 (Pertemuan 6–7) · CPMK-2 · CPL-4</span></div><h1>Pengalaman Pelanggan Digital</h1><p class=\"lead\">Customer journey map, pengalaman omnichannel · presentasi Tugas 1</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu menganalisis peluang digitalisasi proses bisnis dan pengalaman pelanggan (C4).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":8,"title":"Ujian Tengah Semester (UTS)","subtitle":"Materi Pertemuan 1–7 · Sub-CPMK-1 s.d. Sub-CPMK-4","status":"exam","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag exam pill\">Exam</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 8</span></div><h1>Ujian Tengah Semester (UTS)</h1><p class=\"lead\">Materi Pertemuan 1–7 · Sub-CPMK-1 s.d. Sub-CPMK-4</p><p class=\"muted\" style=\"margin-top:1em\">Ujian tertulis (Tes Tulis), 2×50 menit. Kisi-kisi ujian diumumkan di kelas.</p></div>"}]},{"no":9,"title":"Kematangan Digital (1)","subtitle":"Konsep kematangan digital, digital capability dan leadership capability, model kematangan","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 9</span><span>
