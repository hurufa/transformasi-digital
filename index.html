kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-4 · Pertemuan 6–7</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menganalisis peluang digitalisasi proses bisnis dan pengalaman pelanggan (C4).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1, 2, dan 3; indikator 4 (presentasi) di Pertemuan 7)</span></h3><ol><li><b>Ketepatan memodelkan proses as-is dan to-be.</b></li><li><b>Ketepatan mengidentifikasi titik masalah pada customer journey.</b></li><li><b>Kelogisan usulan digitalisasi proses berikut manfaatnya.</b></li><li>Kualitas presentasi hasil analisis. <span class=\"muted\">(Pertemuan 7)</span></li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-2</dt><dd>Mahasiswa mampu menganalisis proses, kematangan digital, dan kebutuhan perubahan organisasi untuk merumuskan strategi dan roadmap transformasi digital.</dd><dt>CPL-4</dt><dd class=\"id\">Memiliki kompetensi menganalisis persoalan Sistem Informasi yang kompleks untuk mengidentifikasi solusi pengelolaan proyek teknologi dan transformasi digital dengan wawasan transdisiplin.</dd><dt>Waktu</dt><dd>Tatap muka 2×50 menit · Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Proyek (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 6–7</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 4–5 dan tugas persiapan</span></div><h2>Masih ingat?</h2>\n   <div class=\"cols w\"><ol class=\"lead\"><li>Sebutkan tiga area penciptaan nilai digital menurut Westerman dkk.</li><li>Pada BMC, blok mana yang paling dekat dengan \"proses\"?</li><li>Ceritakan satu proses utama mitra Anda dalam satu kalimat: siapa, melakukan apa, hasilnya apa.</li></ol>\n   <div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Cek cepat kelompok</h3><p>Angkat tangan bila kelompok Anda:</p><ul><li>sudah mengunggah Tugas 1A (tenggat malam ini),</li><li>sudah memilih <b>satu</b> proses utama mitra,</li><li>tahu siapa saja pelaku dalam proses itu.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemanasan</span><span>3 menit · berpasangan</span></div><h2>Formulir sudah daring, apakah prosesnya berubah?</h2>\n   <div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Sebelum</h3><p>Warga mengisi formulir surat keterangan di balai desa, petugas mengetik ulang ke komputer, lalu surat dicetak dan menunggu tanda tangan kepala desa.</p></div>\n   <div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20\"/></svg>Sesudah \"digitalisasi\"</h3><p>Formulir diganti berkas PDF di situs desa. Warga mengunduh, mencetak, mengisi tangan, lalu tetap datang ke balai desa. Petugas tetap mengetik ulang dan tanda tangan tetap menunggu.</p></div></div>\n   <ol style=\"margin-top:.9em\"><li>Apa yang berubah bagi warga? Bagi petugas?</li><li>Apa yang <b>tidak</b> berubah?</li><li>Menurut Anda, ini digitisasi, digitalisasi, atau transformasi? (Pertemuan 1)</li></ol><p class=\"muted\" style=\"font-size:.85em\">Kasus ilustrasi buatan dosen.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Westerman dkk. (2014) · indikator 1</span></div><h2>Apa itu proses bisnis?</h2>\n   <div class=\"cols w\"><div><p><button type=\"button\" class=\"term\" data-term=\"business-process\">Proses bisnis</button>: rangkaian aktivitas yang saling berkaitan, dikerjakan satu atau beberapa pihak, untuk menghasilkan hasil bagi pelanggan. <span class=\"muted\" style=\"font-size:.85em\">Definisi kerja mata kuliah.</span></p>\n   <ul><li><b>Pemicu</b>: kejadian yang memulai (wali mengajukan pendaftaran).</li><li><b>Pelaku</b>: orang atau sistem yang mengerjakan.</li><li><b>Langkah</b>: aktivitas berurutan atau bercabang.</li><li><b>Hasil</b>: sesuatu yang bernilai bagi pelanggan (surat penerimaan).</li></ul></div>\n   <div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Mengapa penting di transformasi digital?</h3><p>Westerman dkk. <span class=\"cite\">(2014)</span> menempatkan <b>proses operasional</b> sebagai salah satu area tempat teknologi digital menciptakan nilai, di samping pengalaman pelanggan dan model bisnis.</p><p class=\"muted\" style=\"font-size:.88em\">Digitalisasi proses yang belum dipahami hanya memindahkan kekacauan ke layar.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemodelan</span><span>Kasus ilustrasi · indikator 1</span></div><h2>Proses <button type=\"button\" class=\"term\" data-term=\"as-is\">as-is</button>: pendaftaran santri baru</h2><figure class=\"fig\"><svg viewBox=\"0 0 860 278\" style=\"max-height:19em\" role=\"img\" aria-label=\"Diagram swimlane proses as-is pendaftaran santri baru, kasus ilustrasi, dengan empat lajur: wali santri, petugas TU, bendahara, pengasuh. Tujuh langkah: wali datang mengambil formulir kertas, wali mengisi dan memfotokopi berkas, petugas TU memeriksa dan mencatat di buku induk, bendahara menerima uang tunai dan menulis kuitansi, petugas TU menyalin data ke Excel, pengasuh menandatangani surat penerimaan, wali datang lagi mengambil surat. Langkah 2, 5, dan 7 ditandai sebagai titik masalah.\"><defs><marker id=\"da6\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"0\" y=\"8\" width=\"860\" height=\"60\" class=\"s-hl\" style=\"opacity:0.14\"/><line x1=\"0\" y1=\"8\" x2=\"860\" y2=\"8\" class=\"s-dash\"/><text x=\"8\" y=\"42\" class=\"s-hd\" style=\"font-size:10px\">Wali santri</text><rect x=\"0\" y=\"68\" width=\"860\" height=\"60\" class=\"s-hl\" style=\"opacity:0\"/><line x1=\"0\" y1=\"68\" x2=\"860\" y2=\"68\" class=\"s-dash\"/><text x=\"8\" y=\"102\" class=\"s-hd\" style=\"font-size:10px\">Petugas TU</text><rect x=\"0\" y=\"128\" width=\"860\" height=\"60\" class=\"s-hl\" style=\"opacity:0.14\"/><line x1=\"0\" y1=\"128\" x2=\"860\" y2=\"128\" class=\"s-dash\"/><text x=\"8\" y=\"162\" class=\"s-hd\" style=\"font-size:10px\">Bendahara</text><rect x=\"0\" y=\"188\" width=\"860\" height=\"60\" class=\"s-hl\" style=\"opacity:0\"/><line x1=\"0\" y1=\"188\" x2=\"860\" y2=\"188\" class=\"s-dash\"/><text x=\"8\" y=\"222\" class=\"s-hd\" style=\"font-size:10px\">Pengasuh</text><line x1=\"0\" y1=\"248\" x2=\"860\" y2=\"248\" class=\"s-dash\"/><path d=\"M184 38 H193 V38 H201\" fill=\"none\" class=\"s-line\" marker-end=\"url(#da6)\"/><path d=\"M296 38 H305 V98 H313\" fill=\"none\" class=\"s-line\" marker-end=\"url(#da6)\"/><path d=\"M408 98 H417 V158 H425\" fill=\"none\" class=\"s-line\" marker-end=\"url(#da6)\"/><path d=\"M520 158 H529 V98 H537\" fill=\"none\" class=\"s-line\" marker-end=\"url(#da6)\"/><path d=\"M632 98 H641 V218 H649\" fill=\"none\" class=\"s-line\" marker-end=\"url(#da6)\"/><path d=\"M744 218 H753 V38 H761\" fill=\"none\" class=\"s-line\" marker-end=\"url(#da6)\"/><rect x=\"90\" y=\"18\" width=\"94\" height=\"40\" rx=\"6\" class=\"s-box\"/><text x=\"90\" y=\"16\" class=\"s-hd\" style=\"font-size:10px\">1</text><text x=\"137\" y=\"35\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:10px\">Ambil formulir</text><text x=\"137\" y=\"49\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">datang ke kantor</text><rect x=\"202\" y=\"18\" width=\"94\" height=\"40\" rx=\"6\" class=\"s-warn\"/><text x=\"202\" y=\"16\" class=\"s-hd\" style=\"font-size:10px\">2</text><text x=\"249\" y=\"35\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:10px\">Isi + fotokopi</text><text x=\"249\" y=\"49\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">formulir kertas</text><rect x=\"314\" y=\"78\" width=\"94\" height=\"40\" rx=\"6\" class=\"s-box\"/><text x=\"314\" y=\"76\" class=\"s-hd\" style=\"font-size:10px\">3</text><text x=\"361\" y=\"95\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:10px\">Periksa berkas</text><text x=\"361\" y=\"109\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">catat buku induk</text><rect x=\"426\" y=\"138\" width=\"94\" height=\"40\" rx=\"6\" class=\"s-box\"/><text x=\"426\" y=\"136\" class=\"s-hd\" style=\"font-size:10px\">4</text><text x=\"473\" y=\"155\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:10px\">Terima tunai</text><text x=\"473\" y=\"169\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">tulis kuitansi</text><rect x=\"538\" y=\"78\" width=\"94\" height=\"40\" rx=\"6\" class=\"s-warn\"/><text x=\"538\" y=\"76\" class=\"s-hd\" style=\"font-size:10px\">5</text><text x=\"585\" y=\"95\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:10px\">Salin ke Excel</text><text x=\"585\" y=\"109\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">ketik ulang data</text><rect x=\"650\" y=\"198\" width=\"94\" height=\"40\" rx=\"6\" class=\"s-box\"/><text x=\"650\" y=\"196\" class=\"s-hd\" style=\"font-size:10px\">6</text><text x=\"697\" y=\"215\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:10px\">Tanda tangan</text><text x=\"697\" y=\"229\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">surat diterima</text><rect x=\"762\" y=\"18\" width=\"94\" height=\"40\" rx=\"6\" class=\"s-warn\"/><text x=\"762\" y=\"16\" class=\"s-hd\" style=\"font-size:10px\">7</text><text x=\"809\" y=\"35\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:10px\">Ambil surat</text><text x=\"809\" y=\"49\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">datang lagi</text><text x=\"8\" y=\"270\" class=\"s-s\" style=\"font-size:12px\">Kotak merah muda = titik masalah (pain point). Kasus ilustrasi pendaftaran santri baru; bukan data lembaga tertentu.</text></svg></figure>\n   <p style=\"margin-top:.3em;font-size:.95em\"><b>Membaca <button type=\"button\" class=\"term\" data-term=\"swimlane\">swimlane</button></b>: satu lajur satu pelaku; panah yang menyeberang lajur = <button type=\"button\" class=\"term\" data-term=\"handoff\">handoff</button>. <b>Hitung</b>: 7 langkah, 4 pelaku, <b>5 serah-terima</b>, wali datang 2×, data dimasukkan 2×.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemodelan</span><span>Kasus ilustrasi · indikator 1 dan 3</span></div><h2>Proses <button type=\"button\" class=\"term\" data-term=\"to-be\">to-be</button>: setelah digitalisasi</h2><figure class=\"fig\"><svg viewBox=\"0 0 860 278\" style=\"max-height:19em\" role=\"img\" aria-label=\"Diagram swimlane proses to-be pendaftaran santri baru, kasus ilustrasi, dengan empat lajur: wali santri, sistem, petugas TU, pengasuh. Tujuh langkah: wali mengisi formulir daring dan mengunggah berkas, sistem memeriksa kelengkapan otomatis, wali membayar lewat QRIS atau virtual account, sistem mencatat pembayaran dan memperbarui data, petugas TU memverifikasi berkas di dasbor, pengasuh menyetujui lewat ponsel, sistem mengirim surat penerimaan PDF lewat WhatsApp.\"><defs><marker id=\"dt6\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"0\" y=\"8\" width=\"860\" height=\"60\" class=\"s-hl\" style=\"opacity:0.14\"/><line x1=\"0\" y1=\"8\" x2=\"860\" y2=\"8\" class=\"s-dash\"/><text x=\"8\" y=\"42\" class=\"s-hd\" style=\"font-size:10px\">Wali santri</text><rect x=\"0\" y=\"68\" width=\"860\" height=\"60\" class=\"s-hl\" style=\"opacity:0\"/><line x1=\"0\" y1=\"68\" x2=\"860\" y2=\"68\" class=\"s-dash\"/><text x=\"8\" y=\"102\" class=\"s-hd\" style=\"font-size:10px\">Sistem</text><rect x=\"0\" y=\"128\" width=\"860\" height=\"60\" class=\"s-hl\" style=\"opacity:0.14\"/><line x1=\"0\" y1=\"128\" x2=\"860\" y2=\"128\" class=\"s-dash\"/><text x=\"8\" y=\"162\" class=\"s-hd\" style=\"font-size:10px\">Petugas TU</text><rect x=\"0\" y=\"188\" width=\"860\" height=\"60\" class=\"s-hl\" style=\"opacity:0\"/><line x1=\"0\" y1=\"188\" x2=\"860\" y2=\"188\" class=\"s-dash\"/><text x=\"8\" y=\"222\" class=\"s-hd\" style=\"font-size:10px\">Pengasuh</text><line x1=\"0\" y1=\"248\" x2=\"860\" y2=\"248\" class=\"s-dash\"/><path d=\"M184 38 H193 V98 H201\" fill=\"none\" class=\"s-line\" marker-end=\"url(#dt6)\"/><path d=\"M296 98 H305 V38 H313\" fill=\"none\" class=\"s-line\" marker-end=\"url(#dt6)\"/><path d=\"M408 38 H417 V98 H425\" fill=\"none\" class=\"s-line\" marker-end=\"url(#dt6)\"/><path d=\"M520 98 H529 V158 H537\" fill=\"none\" class=\"s-line\" marker-end=\"url(#dt6)\"/><path d=\"M632 158 H641 V218 H649\" fill=\"none\" class=\"s-line\" marker-end=\"url(#dt6)\"/><path d=\"M744 218 H753 V98 H761\" fill=\"none\" class=\"s-line\" marker-end=\"url(#dt6)\"/><rect x=\"90\" y=\"18\" width=\"94\" height=\"40\" rx=\"6\" class=\"s-box\"/><text x=\"90\" y=\"16\" class=\"s-hd\" style=\"font-size:10px\">1</text><text x=\"137\" y=\"35\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:10px\">Isi daring</text><text x=\"137\" y=\"49\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">unggah berkas</text><rect x=\"202\" y=\"78\" width=\"94\" height=\"40\" rx=\"6\" class=\"s-acc\"/><text x=\"202\" y=\"76\" class=\"s-hd\" style=\"font-size:10px\">2</text><text x=\"249\" y=\"95\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:10px\">Cek isian</text><text x=\"249\" y=\"109\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">otomatis</text><rect x=\"314\" y=\"18\" width=\"94\" height=\"40\" rx=\"6\" class=\"s-box\"/><text x=\"314\" y=\"16\" class=\"s-hd\" style=\"font-size:10px\">3</text><text x=\"361\" y=\"35\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:10px\">Bayar QRIS</text><text x=\"361\" y=\"49\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">atau VA</text><rect x=\"426\" y=\"78\" width=\"94\" height=\"40\" rx=\"6\" class=\"s-acc\"/><text x=\"426\" y=\"76\" class=\"s-hd\" style=\"font-size:10px\">4</text><text x=\"473\" y=\"95\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:10px\">Catat bayar</text><text x=\"473\" y=\"109\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">sekali masuk</text><rect x=\"538\" y=\"138\" width=\"94\" height=\"40\" rx=\"6\" class=\"s-box\"/><text x=\"538\" y=\"136\" class=\"s-hd\" style=\"font-size:10px\">5</text><text x=\"585\" y=\"155\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:10px\">Verifikasi</text><text x=\"585\" y=\"169\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">di dasbor</text><rect x=\"650\" y=\"198\" width=\"94\" height=\"40\" rx=\"6\" class=\"s-box\"/><text x=\"650\" y=\"196\" class=\"s-hd\" style=\"font-size:10px\">6</text><text x=\"697\" y=\"215\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:10px\">Setujui</text><text x=\"697\" y=\"229\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">lewat ponsel</text><rect x=\"762\" y=\"78\" width=\"94\" height=\"40\" rx=\"6\" class=\"s-acc\"/><text x=\"762\" y=\"76\" class=\"s-hd\" style=\"font-size:10px\">7</text><text x=\"809\" y=\"95\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:10px\">Kirim surat</text><text x=\"809\" y=\"109\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">notifikasi WA</text><text x=\"8\" y=\"270\" class=\"s-s\" style=\"font-size:12px\">Kotak kuning = langkah otomatis oleh sistem. Kasus ilustrasi; angka dan alat hanya contoh rancangan.</text></svg></figure>\n   <p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Kotak kuning = langkah yang dikerjakan sistem. Rancangan ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Perbandingan</span><span>Kasus ilustrasi · indikator 1 dan 3</span></div><h2>As-is dan to-be, diukur</h2>\n   <div class=\"tw\"><table class=\"t\"><thead><tr><th>Aspek</th><th>As-is</th><th>To-be</th></tr></thead><tbody>\n   <tr><td><b>Kedatangan wali</b></td><td>2 kali</td><td>0 kali (opsional)</td></tr>\n   <tr><td><b>Entri data</b></td><td>2 kali (buku induk, Excel)</td><td>1 kali (wali sendiri)</td></tr>\n   <tr><td><b>Serah-terima antarpelaku</b></td><td>5 kali</td><td>6 kali (5 di antaranya melibatkan sistem)</td></tr>\n   <tr><td><b>Langkah manual</b></td><td>7 dari 7</td><td>4 dari 7; 3 otomatis</td></tr></tbody></table></div>\n   <div class=\"callout warn\" style=\"margin-top:.8em\"><b>Hati-hati:</b> angka di atas dihitung dari dua diagram ilustrasi, bukan hasil pengukuran. Pada Tugas 1B, manfaat harus dibangun dari data atau observasi mitra Anda (jumlah langkah, kedatangan, waktu tunggu), dan risikonya ikut dicatat.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Proses</span><span>Tekan Play atau klik tiap tahap</span></div><h2>Lima langkah menganalisis proses</h2><div class=\"sim sim-stepper\" data-sim=\"stepper\" data-cfg=\"{&quot;id&quot;:&quot;td6-langkah&quot;,&quot;ms&quot;:3200,&quot;steps&quot;:[{&quot;t&quot;:&quot;Pilih satu proses&quot;,&quot;en&quot;:&quot;scope&quot;,&quot;d&quot;:&quot;Pilih proses yang menyentuh pelanggan dan punya masalah nyata. Batasi dari pemicu sampai hasil agar bisa digambar dalam satu halaman.&quot;,&quot;ex&quot;:&quot;Pendaftaran santri baru, bukan \\&quot;seluruh administrasi pondok\\&quot;.&quot;},{&quot;t&quot;:&quot;Gambar as-is&quot;,&quot;en&quot;:&quot;map the current state&quot;,&quot;d&quot;:&quot;Tanyakan pada orang yang mengerjakan, amati langsung, lalu gambar apa adanya dalam swimlane: pelaku, langkah, dan serah-terima.&quot;,&quot;ex&quot;:&quot;Wawancara petugas TU dan bendahara, lalu cocokkan dengan pengalaman wali.&quot;},{&quot;t&quot;:&quot;Temukan titik masalah&quot;,&quot;en&quot;:&quot;find pain points&quot;,&quot;d&quot;:&quot;Tandai tempat orang menunggu, mengulang, salah, atau memindahkan berkas. Catat bukti: kejadian, waktu, atau keluhan.&quot;,&quot;ex&quot;:&quot;Data diketik 2×; wali datang 2× hanya untuk menyerahkan dan mengambil.&quot;},{&quot;t&quot;:&quot;Rancang to-be&quot;,&quot;en&quot;:&quot;redesign&quot;,&quot;d&quot;:&quot;Urutkan perbaikan: hapus langkah yang tak perlu, sederhanakan, baru digitalkan dan otomasi. Gambar to-be dengan swimlane yang sama.&quot;,&quot;ex&quot;:&quot;Formulir daring, pembayaran QRIS, surat PDF otomatis.&quot;},{&quot;t&quot;:&quot;Ukur manfaat dan risiko&quot;,&quot;en&quot;:&quot;benefit and risk&quot;,&quot;d&quot;:&quot;Bandingkan as-is dan to-be dengan ukuran yang bisa dicek: jumlah langkah, kedatangan, waktu tunggu. Catat risiko dan siapa yang perlu dibantu.&quot;,&quot;ex&quot;:&quot;Wali tanpa ponsel pintar tetap dilayani di loket bantu.&quot;}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.5em\">Rangkuman dosen tentang urutan analisis proses; contoh: kasus ilustrasi pendaftaran santri.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Otomasi proses</span><span>Indikator 3</span></div><h2>Hapus, sederhanakan, baru <button type=\"button\" class=\"term\" data-term=\"process-automation\">otomasikan</button></h2>\n   <div class=\"grid4\"><div class=\"card\"><h3>1 · Hapus</h3><p>Langkah yang tidak memberi nilai bagi pelanggan.</p><p class=\"muted\" style=\"font-size:.88em\">Salin ulang ke Excel.</p></div>\n   <div class=\"card\"><h3>2 · Sederhanakan</h3><p>Kurangi isian, pelaku, dan serah-terima.</p><p class=\"muted\" style=\"font-size:.88em\">Formulir satu halaman.</p></div>\n   <div class=\"card hl\"><h3>3 · Digitalkan</h3><p>Pindahkan langkah yang tersisa ke medium digital.</p><p class=\"muted\" style=\"font-size:.88em\">Formulir daring, bayar QRIS.</p></div>\n   <div class=\"card hl\"><h3>4 · Otomasikan</h3><p>Serahkan aturan yang pasti ke sistem.</p><p class=\"muted\" style=\"font-size:.88em\">Validasi, notifikasi, pencatatan.</p></div></div>\n   <div class=\"callout warn\" style=\"margin-top:.7em\"><b>Awas:</b> mendigitalkan proses yang buruk hanya membuatnya buruk lebih cepat. Pahami dulu (as-is), perbaiki alurnya, baru pilih teknologinya.</div>\n   <p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Urutan hapus–sederhanakan–digitalkan–otomasikan adalah rangkuman dosen.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Simulasi</span><span>Geser titik atau slider</span></div><h2>Mana titik masalah yang dikerjakan lebih dulu?</h2><div class=\"sim sim-grid2\" data-sim=\"grid2\" data-cfg=\"{&quot;id&quot;:&quot;td6-prioritas&quot;,&quot;aria&quot;:&quot;Simulasi prioritas perbaikan. Sumbu mendatar kemudahan digitalisasi, sumbu tegak dampak bagi pelanggan. Empat zona: quick win, proyek besar, pelengkap, dan pertimbangkan ulang.&quot;,&quot;x&quot;:{&quot;label&quot;:&quot;Kemudahan digitalisasi&quot;,&quot;lo&quot;:&quot;sulit&quot;,&quot;hi&quot;:&quot;mudah&quot;},&quot;y&quot;:{&quot;label&quot;:&quot;Dampak bagi pelanggan&quot;,&quot;lo&quot;:&quot;kecil&quot;,&quot;hi&quot;:&quot;besar&quot;},&quot;init&quot;:[2,3],&quot;zones&quot;:[{&quot;k&quot;:&quot;qw&quot;,&quot;en&quot;:&quot;Quick win&quot;,&quot;name&quot;:&quot;Kerjakan lebih dulu&quot;,&quot;tag&quot;:&quot;dampak besar · mudah&quot;,&quot;r&quot;:[5,10,5,10],&quot;cls&quot;:&quot;s-soft&quot;,&quot;d&quot;:&quot;Perbaikan yang mudah dan terasa bagi pelanggan. Hasil cepat membangun dukungan untuk perubahan berikutnya.&quot;,&quot;ex&quot;:&quot;Formulir daring menggantikan formulir kertas.&quot;},{&quot;k&quot;:&quot;mp&quot;,&quot;en&quot;:&quot;Major project&quot;,&quot;name&quot;:&quot;Rencanakan sebagai proyek&quot;,&quot;tag&quot;:&quot;dampak besar · sulit&quot;,&quot;r&quot;:[0,5,5,10],&quot;cls&quot;:&quot;s-acc&quot;,&quot;d&quot;:&quot;Dampaknya besar tetapi butuh waktu, biaya, atau kerja sama pihak lain. Pecah menjadi tahap dan tetapkan penanggung jawab.&quot;,&quot;ex&quot;:&quot;Menghubungkan data pendaftaran dengan sistem akademik lembaga.&quot;},{&quot;k&quot;:&quot;fi&quot;,&quot;en&quot;:&quot;Fill-in&quot;,&quot;name&quot;:&quot;Kerjakan bila sempat&quot;,&quot;tag&quot;:&quot;dampak kecil · mudah&quot;,&quot;r&quot;:[5,10,0,5],&quot;cls&quot;:&quot;s-box&quot;,&quot;d&quot;:&quot;Mudah, tetapi tidak banyak mengubah pengalaman pelanggan. Jangan sampai memakan sumber daya untuk perbaikan yang lebih penting.&quot;,&quot;ex&quot;:&quot;Mengubah warna dan logo formulir daring.&quot;},{&quot;k&quot;:&quot;rr&quot;,&quot;en&quot;:&quot;Reconsider&quot;,&quot;name&quot;:&quot;Pertimbangkan ulang&quot;,&quot;tag&quot;:&quot;dampak kecil · sulit&quot;,&quot;r&quot;:[0,5,0,5],&quot;cls&quot;:&quot;s-box&quot;,&quot;d&quot;:&quot;Sulit dan dampaknya kecil. Tunda atau hapus dari daftar usulan.&quot;,&quot;ex&quot;:&quot;Membangun aplikasi seluler sendiri untuk pengumuman yang bisa lewat WhatsApp.&quot;}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.5em\">Batas zona dan contoh adalah penyederhanaan untuk simulasi (data ilustrasi).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Rogers (2016) · indikator 2</span></div><h2><button type=\"button\" class=\"term\" data-term=\"customer-journey\">Customer journey map</button></h2><figure class=\"fig\"><svg viewBox=\"0 0 860 316\" style=\"max-height:19em\" role=\"img\" aria-label=\"Customer journey map kasus ilustrasi seorang wali santri dengan lima tahap: mencari info, mendaftar, membayar, menunggu, diterima. Setiap tahap menampilkan tindakan, titik sentuh, kurva perasaan, dan titik masalah. Perasaan paling rendah pada tahap menunggu dan mendaftar.\"><text x=\"6\" y=\"78\" class=\"s-hd\" style=\"font-size:11px\">Tindakan</text><text x=\"6\" y=\"134\" class=\"s-hd\" style=\"font-size:11px\">Titik sentuh</text><text x=\"6\" y=\"194\" class=\"s-hd\" style=\"font-size:11px\">Perasaan</text><text x=\"6\" y=\"276\" class=\"s-hd\" style=\"font-size:11px\">Titik masalah</text><text x=\"6\" y=\"14\" class=\"s-s\" style=\"font-size:11px\">Persona: Bu Aminah, wali calon santri</text><rect x=\"112\" y=\"34\" width=\"142.8\" height=\"24\" class=\"s-hl\"/><text x=\"183.4\" y=\"51\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">1. Mencari info</text><text x=\"116\" y=\"80\" class=\"s-t\" style=\"font-size:10px\">Tanya kerabat dan</text><text x=\"116\" y=\"94\" class=\"s-t\" style=\"font-size:10px\">alumni, lihat brosur</text><text x=\"116\" y=\"136\" class=\"s-s\" style=\"font-size:10px\">Mulut ke mulut,</text><text x=\"116\" y=\"150\" class=\"s-s\" style=\"font-size:10px\">brosur</text><rect x=\"112\" y=\"258\" width=\"142.8\" height=\"42\" rx=\"5\" class=\"s-warn\"/><text x=\"117\" y=\"276\" class=\"s-t\" style=\"font-size:10px\">Biaya berbeda antara</text><text x=\"117\" y=\"290\" class=\"s-t\" style=\"font-size:10px\">brosur dan alumni</text><rect x=\"260.8\" y=\"34\" width=\"142.8\" height=\"24\" class=\"s-hl\"/><text x=\"332.20000000000005\" y=\"51\" text-anchor=\"middle\" class=\"s-t\" style=\"font-s
