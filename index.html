g diciptakan, untuk siapa?</li><li><b>Delivers</b>: lewat apa nilai itu sampai ke pelanggan?</li><li><b>Captures</b>: bagaimana organisasi memperoleh imbalan dan menutup biayanya?</li></ul><p class=\"muted\" style=\"font-size:.85em\">Penekanan oleh dosen.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Alat</span><span>Indikator 1</span></div><h2><button type=\"button\" class=\"term\" data-term=\"bmc\">Business Model Canvas</button>: sembilan blok</h2><figure class=\"fig\"><svg viewBox=\"-4 -4 1008 368\" style=\"max-height:17em\" role=\"img\" aria-label=\"Business Model Canvas dengan sembilan blok: di kiri Key Partnerships, Key Activities, Key Resources; di tengah Value Propositions; di kanan Customer Relationships, Channels, Customer Segments; di bawah Cost Structure dan Revenue Streams.\"><rect x=\"0\" y=\"0\" width=\"200\" height=\"260\" class=\"s-box\"/><text x=\"10\" y=\"21\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">8 </tspan>Key Partnerships</text><rect x=\"200\" y=\"0\" width=\"200\" height=\"130\" class=\"s-box\"/><text x=\"210\" y=\"21\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">7 </tspan>Key Activities</text><rect x=\"200\" y=\"130\" width=\"200\" height=\"130\" class=\"s-box\"/><text x=\"210\" y=\"151\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">6 </tspan>Key Resources</text><rect x=\"400\" y=\"0\" width=\"200\" height=\"260\" class=\"s-acc\"/><text x=\"410\" y=\"21\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">2 </tspan>Value Propositions</text><rect x=\"600\" y=\"0\" width=\"200\" height=\"130\" class=\"s-soft\"/><text x=\"610\" y=\"21\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">4 </tspan>Customer Relationships</text><rect x=\"600\" y=\"130\" width=\"200\" height=\"130\" class=\"s-soft\"/><text x=\"610\" y=\"151\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">3 </tspan>Channels</text><rect x=\"800\" y=\"0\" width=\"200\" height=\"260\" class=\"s-soft\"/><text x=\"810\" y=\"21\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">1 </tspan>Customer Segments</text><rect x=\"0\" y=\"260\" width=\"500\" height=\"100\" class=\"s-box\"/><text x=\"10\" y=\"281\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">9 </tspan>Cost Structure</text><rect x=\"500\" y=\"260\" width=\"500\" height=\"100\" class=\"s-soft\"/><text x=\"510\" y=\"281\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">5 </tspan>Revenue Streams</text></svg><figcaption>Business Model Canvas, digambar ulang dan diadaptasi dari Osterwalder &amp; Pigneur (2010). Angka di depan nama blok = urutan penyajian blok dalam buku; nama blok ditulis sesuai sumber.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Blok 1–5</span><span>Sisi pelanggan · indikator 1</span></div><h2>Mengisi sisi pelanggan</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Blok</th><th>Pertanyaan kunci</th><th>Contoh (kasus ilustrasi UMKM batik tulis Sidoarjo)</th></tr></thead><tbody><tr><td><b>1 <button type=\"button\" class=\"term\" data-term=\"customer-segment\">Customer Segments</button></b></td><td>Untuk siapa kita menciptakan nilai?</td><td>pembeli eceran, butik di kota besar, instansi pemesan seragam</td></tr><tr><td><b>2 <button type=\"button\" class=\"term\" data-term=\"value-proposition\">Value Propositions</button></b></td><td>Masalah atau kebutuhan apa yang kita selesaikan?</td><td>batik tulis asli dengan motif khas, bisa pesan motif sendiri</td></tr><tr><td><b>3 <button type=\"button\" class=\"term\" data-term=\"channel\">Channels</button></b></td><td>Lewat apa kita menjangkau dan menyampaikan nilai?</td><td>galeri di rumah produksi, marketplace, live streaming</td></tr><tr><td><b>4 <button type=\"button\" class=\"term\" data-term=\"customer-relationship\">Customer Relationships</button></b></td><td>Hubungan seperti apa yang dibangun?</td><td>konsultasi motif lewat WhatsApp, layanan pelanggan tetap</td></tr><tr><td><b>5 <button type=\"button\" class=\"term\" data-term=\"revenue-stream\">Revenue Streams</button></b></td><td>Dari setiap segmen, uang apa yang diterima?</td><td>penjualan kain, pesanan motif khusus, pesanan seragam</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Pertanyaan kunci diringkas dari uraian Osterwalder &amp; Pigneur (2010). Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Blok 6–9</span><span>Sisi organisasi · indikator 1</span></div><h2>Mengisi sisi organisasi</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Blok</th><th>Pertanyaan kunci</th><th>Contoh (kasus ilustrasi UMKM batik tulis Sidoarjo)</th></tr></thead><tbody><tr><td><b>6 <button type=\"button\" class=\"term\" data-term=\"key-resource\">Key Resources</button></b></td><td>Aset terpenting apa yang dibutuhkan?</td><td>perajin terampil, koleksi motif, akun marketplace dan pengikutnya</td></tr><tr><td><b>7 <button type=\"button\" class=\"term\" data-term=\"key-activity\">Key Activities</button></b></td><td>Kegiatan terpenting apa yang harus dikerjakan?</td><td>membatik, merancang motif, membuat konten dan siaran langsung</td></tr><tr><td><b>8 <button type=\"button\" class=\"term\" data-term=\"key-partnership\">Key Partnerships</button></b></td><td>Siapa pemasok dan mitra kuncinya?</td><td>pemasok kain dan malam, jasa ekspedisi, marketplace</td></tr><tr><td><b>9 <button type=\"button\" class=\"term\" data-term=\"cost-structure\">Cost Structure</button></b></td><td>Biaya terpenting apa yang timbul?</td><td>bahan baku, upah perajin, potongan komisi marketplace, ongkos kirim</td></tr></tbody></table></div><div class=\"callout\" style=\"margin-top:.7em\">Teknologi dari tabel pemetaan Pertemuan 2–3 biasanya muncul di <b>Key Resources</b>, <b>Key Activities</b>, <b>Channels</b>, atau <b>Key Partnerships</b>.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 3</span></div><h2>Proposisi nilai: alasan pelanggan memilih Anda</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"The Value Propositions Building Block describes the bundle of products and services that create value for a specific Customer Segment.\"</p><p class=\"tr\">\"Blok Proposisi Nilai menggambarkan sekumpulan produk dan layanan yang menciptakan nilai bagi suatu Segmen Pelanggan tertentu.\"</p><div class=\"src\">Osterwalder &amp; Pigneur (2010); terjemahan harfiah penyusun</div></blockquote></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Tiga hal yang perlu dicatat</h3><ul><li><b>Bundle</b>: bukan satu produk, tetapi gabungan produk dan layanan.</li><li><b>Create value</b>: menyelesaikan masalah atau memenuhi kebutuhan.</li><li><b>Specific segment</b>: segmen berbeda bisa butuh proposisi nilai berbeda.</li></ul><p class=\"muted\" style=\"font-size:.85em\">Penekanan oleh dosen.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 3</span></div><h2>Dari mana nilai bagi pelanggan datang?</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.86em\"><thead><tr><th>Unsur</th><th>Contoh digital (ilustrasi)</th><th>Unsur</th><th>Contoh digital (ilustrasi)</th></tr></thead><tbody><tr><td><b>Newness</b></td><td>layanan yang sebelumnya tidak ada</td><td><b>Price</b></td><td>harga lebih murah tanpa toko fisik</td></tr><tr><td><b>Performance</b></td><td>pengiriman lebih cepat</td><td><b>Cost reduction</b></td><td>pelanggan menghemat ongkos dan waktu</td></tr><tr><td><b>Customization</b></td><td>pesan motif sesuai keinginan</td><td><b>Risk reduction</b></td><td>garansi, ulasan pembeli</td></tr><tr><td><b>\"Getting the job done\"</b></td><td>urus surat tanpa antre</td><td><b>Accessibility</b></td><td>menjangkau yang dulu tak terlayani</td></tr><tr><td><b>Design</b></td><td>tampilan aplikasi yang mudah dipakai</td><td><b>Convenience/Usability</b></td><td>bayar dan pesan dari ponsel</td></tr><tr><td><b>Brand/Status</b></td><td>bangga memakai produk lokal</td><td></td><td></td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Sebelas unsur penciptaan nilai menurut Osterwalder &amp; Pigneur (2010), yang menyebut daftar ini tidak lengkap (non-exhaustive). Nama unsur sesuai sumber; contoh oleh dosen.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Analisis</span><span>Indikator 3</span></div><h2>Proposisi nilai digital</h2><p>Proposisi nilai disebut <b>digital</b> bila nilainya muncul karena teknologi digital (Pertemuan 2–3), bukan sekadar dijual lewat internet. <span class=\"muted\">Definisi kerja mata kuliah ini.</span></p><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><path d=\"M12 18h.01\"/></svg>Gojek</h3><p>Dari pemesanan ojek lewat call center (2010) menjadi aplikasi (2015), lalu banyak layanan dalam satu aplikasi <span class=\"cite\">(Liputan6.com, 2022)</span>.</p><p class=\"muted\" style=\"font-size:.9em\">Unsur nilai yang menonjol: Convenience/Usability, Accessibility, \"Getting the job done\".</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg>SATUSEHAT Mobile</h3><p>Dari aplikasi penanganan pandemi menjadi catatan kesehatan pribadi yang direncanakan terhubung dengan rekam medis elektronik <span class=\"cite\">(Antara, 2023)</span>.</p><p class=\"muted\" style=\"font-size:.9em\">Unsur nilai yang menonjol: Convenience/Usability, Newness.</p></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.5em\">Penentuan unsur nilai adalah analisis dosen untuk latihan, memakai daftar Osterwalder &amp; Pigneur (2010).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh lengkap</span><span>Kasus ilustrasi · indikator 1 dan 3</span></div><h2>BMC Koperasi Pondok Pesantren</h2><figure class=\"fig\"><svg viewBox=\"-4 -4 1008 368\" style=\"max-height:18.5em\" role=\"img\" aria-label=\"Business Model Canvas dengan sembilan blok: di kiri Key Partnerships, Key Activities, Key Resources; di tengah Value Propositions; di kanan Customer Relationships, Channels, Customer Segments; di bawah Cost Structure dan Revenue Streams. Berisi contoh kasus ilustrasi.\"><rect x=\"0\" y=\"0\" width=\"200\" height=\"260\" class=\"s-box\"/><text x=\"10\" y=\"21\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">8 </tspan>Key Partnerships</text><text x=\"10\" y=\"43\" class=\"s-s\" style=\"font-size:12px\">grosir lokal</text><text x=\"10\" y=\"61\" class=\"s-s\" style=\"font-size:12px\">UMKM alumni</text><text x=\"10\" y=\"79\" class=\"s-s\" style=\"font-size:12px\">penyedia aplikasi kasir</text><rect x=\"200\" y=\"0\" width=\"200\" height=\"130\" class=\"s-box\"/><text x=\"210\" y=\"21\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">7 </tspan>Key Activities</text><text x=\"210\" y=\"43\" class=\"s-s\" style=\"font-size:12px\">belanja dan kelola stok</text><text x=\"210\" y=\"61\" class=\"s-s\" style=\"font-size:12px\">kelola saldo santri</text><rect x=\"200\" y=\"130\" width=\"200\" height=\"130\" class=\"s-box\"/><text x=\"210\" y=\"151\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">6 </tspan>Key Resources</text><text x=\"210\" y=\"173\" class=\"s-s\" style=\"font-size:12px\">toko dan gudang</text><text x=\"210\" y=\"191\" class=\"s-s\" style=\"font-size:12px\">data saldo santri</text><text x=\"210\" y=\"209\" class=\"s-s\" style=\"font-size:12px\">pengurus koperasi</text><rect x=\"400\" y=\"0\" width=\"200\" height=\"260\" class=\"s-acc\"/><text x=\"410\" y=\"21\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">2 </tspan>Value Propositions</text><text x=\"410\" y=\"43\" class=\"s-s\" style=\"font-size:12px\">kebutuhan harian di pondok</text><text x=\"410\" y=\"61\" class=\"s-s\" style=\"font-size:12px\">bayar pakai saldo santri</text><text x=\"410\" y=\"79\" class=\"s-s\" style=\"font-size:12px\">wali bisa titip belanja</text><rect x=\"600\" y=\"0\" width=\"200\" height=\"130\" class=\"s-soft\"/><text x=\"610\" y=\"21\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">4 </tspan>Customer Relationships</text><text x=\"610\" y=\"43\" class=\"s-s\" style=\"font-size:12px\">layanan langsung di toko</text><text x=\"610\" y=\"61\" class=\"s-s\" style=\"font-size:12px\">info stok lewat grup</text><rect x=\"600\" y=\"130\" width=\"200\" height=\"130\" class=\"s-soft\"/><text x=\"610\" y=\"151\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">3 </tspan>Channels</text><text x=\"610\" y=\"173\" class=\"s-s\" style=\"font-size:12px\">toko fisik di pondok</text><text x=\"610\" y=\"191\" class=\"s-s\" style=\"font-size:12px\">grup WhatsApp wali</text><text x=\"610\" y=\"209\" class=\"s-s\" style=\"font-size:12px\">aplikasi saldo santri</text><rect x=\"800\" y=\"0\" width=\"200\" height=\"260\" class=\"s-soft\"/><text x=\"810\" y=\"21\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">1 </tspan>Customer Segments</text><text x=\"810\" y=\"43\" class=\"s-s\" style=\"font-size:12px\">santri mukim</text><text x=\"810\" y=\"61\" class=\"s-s\" style=\"font-size:12px\">wali santri</text><text x=\"810\" y=\"79\" class=\"s-s\" style=\"font-size:12px\">warga sekitar pondok</text><rect x=\"0\" y=\"260\" width=\"500\" height=\"100\" class=\"s-box\"/><text x=\"10\" y=\"281\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">9 </tspan>Cost Structure</text><text x=\"10\" y=\"303\" class=\"s-s\" style=\"font-size:12px\">pembelian barang dagangan</text><text x=\"10\" y=\"321\" class=\"s-s\" style=\"font-size:12px\">honor pengurus</text><text x=\"10\" y=\"339\" class=\"s-s\" style=\"font-size:12px\">langganan aplikasi</text><rect x=\"500\" y=\"260\" width=\"500\" height=\"100\" class=\"s-soft\"/><text x=\"510\" y=\"281\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">5 </tspan>Revenue Streams</text><text x=\"510\" y=\"303\" class=\"s-s\" style=\"font-size:12px\">margin penjualan barang</text><text x=\"510\" y=\"321\" class=\"s-s\" style=\"font-size:12px\">biaya layanan titip belanja</text></svg><figcaption>Business Model Canvas kasus ilustrasi koperasi pondok pesantren (kopontren), memakai kanvas Osterwalder &amp; Pigneur (2010).</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\" style=\"background:var(--warn-soft);color:var(--warn)\">Perhatian</span><span>Indikator 1</span></div><h2>Kesalahan umum saat mengisi BMC</h2><div class=\"grid3\"><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Segmen terlalu umum</h3><p>\"Masyarakat umum\" tidak membantu. Sebut kelompok yang berbeda kebutuhannya.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Fitur, bukan nilai</h3><p>\"Ada aplikasi\" bukan proposisi nilai. Tulis manfaatnya bagi segmen.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Saluran = hubungan</h3><p>Channels menjawab \"lewat apa\"; Customer Relationships menjawab \"hubungan seperti apa\".</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Blok tidak nyambung</h3><p>Ada segmen tanpa saluran, atau biaya tanpa aktivitas yang menimbulkannya.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Rencana, bukan kenyataan</h3><p>Tugas ini memetakan kondisi <b>saat ini</b>; ide perbaikan dicatat terpisah.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Tanpa bukti</h3><p>Setiap isi blok sebaiknya bersumber dari wawancara, observasi, atau dokumen mitra.</p></div></div><p class=\"muted\" style=\"margin-top:.6em;font-size:.85em\">Rangkuman dosen.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Workshop BMC</span><span>Kelompok proyek · 30 menit</span></div><h2>Gambar kanvas organisasi mitra Anda</h2><div class=\"cols w\"><div><ol><li>Gambar kanvas sembilan blok di kertas plano atau A3 (atau papan digital).</li><li>Isi blok sesuai urutan 1–9; satu gagasan per sticky note.</li><li>Pakai bahan dari tabel pemetaan teknologi dan wawancara mitra.</li><li>Lingkari isi yang <b>berbasis teknologi digital</b>.</li><li>Rumuskan satu kalimat <b>proposisi nilai digital</b> mitra.</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Periksa sebelum selesai</h3><ul><li>Kesembilan blok terisi.</li><li>Setiap segmen punya saluran dan nilai.</li><li>Isi yang belum pasti diberi tanda tanya untuk ditanyakan ke mitra.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Workshop BMC</span><span>Galeri berputar · 15 menit</span></div><h2>Periksa kanvas kelompok lain</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Cara kerja</h3><ol><li>Tempel kanvas di dinding.</li><li>Setiap kelompok berpindah ke kanvas kelompok di sebelahnya.</li><li>Tulis masukan di sticky note berwarna lain.</li><li>Kembali ke kanvas sendiri, baca semua masukan.</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>Tiga pertanyaan masukan</h3><ul><li>Blok mana yang masih kosong atau terlalu umum?</li><li>Adakah blok yang tidak nyambung dengan blok lain?</li><li>Apakah proposisi nilai digitalnya menyebut manfaat, bukan fitur?</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Model bisnis menjelaskan bagaimana organisasi <b>menciptakan, menyampaikan, dan menangkap nilai</b>.</li><li>BMC punya <b>sembilan blok</b>: sisi pelanggan, sisi organisasi, serta biaya dan pendapatan.</li><li>Proposisi nilai adalah <b>sekumpulan produk dan layanan</b> yang menciptakan nilai bagi segmen tertentu.</li><li>Nilai bisa datang dari banyak unsur: kemudahan, harga, pengurangan risiko, aksesibilitas, dan lain-lain.</li><li>Proposisi nilai <b>digital</b>: nilainya muncul karena teknologi digital.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"Kalimat itu menyatakan manfaat bagi segmen wali santri, jadi termasuk proposisi nilai.\"><p class=\"q\">\"Wali santri bisa memantau saldo anaknya dari rumah.\" Kalimat ini paling tepat ditulis di blok…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Channels</button><button type=\"button\" data-o=\"b\">B. Value Propositions</button><button type=\"button\" data-o=\"c\">C. Key Resources</button><button type=\"button\" data-o=\"d\">D. Revenue Streams</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"a\" data-why=\"Komisi adalah biaya yang timbul untuk menjalankan model bisnis.\"><p class=\"q\">Biaya komisi marketplace yang dibayar UMKM masuk ke blok…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Cost Structure</button><button type=\"button\" data-o=\"b\">B. Revenue Streams</button><button type=\"button\" data-o=\"c\">C. Key Partnerships</button><button type=\"button\" data-o=\"d\">D. Customer Relationships</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"Cost reduction: organisasi membantu pelanggan mengurangi biaya mereka sendiri.\"><p class=\"q\">Pelanggan menghemat ongkos dan waktu karena tidak perlu datang ke kantor. Unsur nilai menurut Osterwalder &amp; Pigneur ini adalah…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Price</button><button type=\"button\" data-o=\"b\">B. Newness</button><button type=\"button\" data-o=\"c\">C. Cost reduction</button><button type=\"button\" data-o=\"d\">D. Brand/Status</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit</span></div><h2>Tugas 1 bagian kedua: BMC mitra</h2><div class=\"cols w\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Business Model Canvas organisasi mitra (10%)</h3><ul><li>Rapikan draf kanvas hari ini menjadi BMC digital (satu halaman) dengan sembilan blok.</li><li>Konfirmasi isi bertanda tanya kepada narahubung mitra.</li><li>Tandai isi yang berbasis teknologi digital dan tulis satu paragraf <b>proposisi nilai digital</b> mitra.</li><li>Di Pertemuan 5 ditambah analisis: mitra lebih dekat ke model <b>pipeline</b> atau <b>platform</b>.</li></ul><p class=\"muted\" style=\"font-size:.85em\">Tenggat: <b>[PERLU DIISI]</b> (tidak tercantum di RPS).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bagian sembilan blok dan pola model bisnis platform (multi-sided platforms) dalam Osterwalder &amp; Pigneur (2010), serta bab tentang platform dalam Rogers (2016), sebagai persiapan Pertemuan 5.</p></div></div><p class=\"muted\" style=\"margin-top:.7em\">Lembar tugas dan rubrik dibagikan terpisah. Ditulis dalam bahasa Indonesia; pemakaian AI disebutkan.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Business model</span></dt><dd>Cara organisasi menciptakan, menyampaikan, dan menangkap nilai. <i>(model bisnis)</i></dd></div><div><dt><span class=\"en\">Business Model Canvas (BMC)</span></dt><dd>Kanvas satu halaman berisi sembilan blok untuk menggambarkan, menganalisis, dan merancang model bisnis. <i>(kanvas model bisnis)</i></dd></div><div><dt><span class=\"en\">Customer Segments</span></dt><dd>Kelompok orang atau organisasi yang ingin dijangkau dan dilayani organisasi. <i>(segmen pelanggan)</i></dd></div><div><dt><span class=\"en\">Value proposition</span></dt><dd>Manfaat yang ditawarkan organisasi kepada pelanggan atau pengguna layanannya. <i>(proposisi nilai)</i></dd></div><div><dt><span class=\"en\">Channels</span></dt><dd>Cara organisasi berkomunikasi dengan dan menjangkau segmen pelanggan untuk menyampaikan proposisi nilai. <i>(saluran)</i></dd></div><div><dt><span class=\"en\">Customer Relationships</span></dt><dd>Jenis hubungan yang dibangun organisasi dengan segmen pelanggan tertentu. <i>(hubungan pelanggan)</i></dd></div><div><dt><span class=\"en\">Revenue Streams</span></dt><dd>Uang yang diperoleh organisasi dari setiap segmen pelanggan. <i>(arus pendapatan)</i></dd></div><div><dt><span class=\"en\">Key Resources</span></dt><dd>Aset terpenting yang dibutuhkan agar model bisnis berjalan. <i>(sumber daya utama)</i></dd></div><div><dt><span class=\"en\">Key Activities</span></dt><dd>Hal terpenting yang harus dikerjakan organisasi agar model bisnisnya berjalan. <i>(aktivitas utama)</i></dd></div><div><dt><span class=\"en\">Key Partnerships</span></dt><dd>Jaringan pemasok dan mitra yang membuat model bisnis berjalan. <i>(kemitraan utama)</i></dd></div><div><dt><span class=\"en\">Cost Structure</span></dt><dd>Seluruh biaya yang timbul untuk menjalankan model bisnis. <i>(struktur biaya)</i></dd></div><div><dt><span class=\"en\">Getting the job done</span></dt><dd>Nilai yang tercipta karena produk atau layanan membantu pelanggan menyelesaikan suatu pekerjaan. <i>(membantu menyelesaikan pekerjaan)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Liputan6.com. (2022, 15 Desember). <i>Profil PT Gojek Indonesia, sejarah, alamat kantor, dan produk layanannya</i>. https://www.liputan6.com/hot/read/5154461/</li><li>Antara. (2023, 28 Februari). <i>Kemenkes: PeduliLindungi bertransformasi jadi SatuSehat mulai besok</i>. https://www.antaranews.com/berita/3417786/</li><li>Osterwalder, A., &amp; Pigneur, Y. (2010). <i>Business model generation: A handbook for visionaries, game changers, and challengers</i>. John Wiley &amp; Sons.</li><li>Rogers, D. L. (2016). <i>The digital transformation playbook: Rethink your business for the digital age</i>. Columbia Business School Publishing.</li><li>Westerman, G., Bonnet, D., &amp; McAfee, A. (2014). <i>Leading digital: Turning technology into business transformation</i>. Harvard Business Review Press.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 5.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":5,"title":"Model Bisnis Digital (2)","subtitle":"Model bisnis platform dan ekosistem, efek jaringan, contoh platform digital Indonesia","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 5</span><span>Transformasi Digital · SI24W15</span></div><h1>Model Bisnis Digital (2)</h1><p class=\"lead\">Model bisnis platform dan ekosistem, efek jaringan, contoh platform digital Indonesia</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 4–5 · Sub-CPMK-3</div><div><b>Hari ini</b>Platform + simulasi + workshop BMC</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-3 · Pertemuan 4–5</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu memetakan model bisnis dan platform digital suatu organisasi dengan Business Model Canvas (C3).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 2; indikator 1 dan 3 dilanjutkan di workshop)</span></h3><ol><li>Kelengkapan sembilan blok Business Model Canvas. <span class=\"muted\">(Pertemuan 4; dilengkapi di workshop hari ini)</span></li><li><b>Ketepatan membedakan model bisnis pipeline dan platform.</b></li><li>Ketepatan mengidentifikasi proposisi nilai digital organisasi. <span class=\"muted\">(Pertemuan 4; dilengkapi di workshop hari ini)</span></li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menjelaskan konsep transformasi digital, teknologi pendorongnya, dan model bisnis digital.</dd><dt>CPL-3</dt><dd class=\"id\">Menguasai konsep teoritis Sistem Informasi, Ilmu Komputer, dan Bisnis Digital secara umum serta konsep khusus secara mendalam untuk memformulasikan solusi prosedural.</dd><dt>Waktu</dt><dd>Tatap muka 2×50 menit · Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Produk (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 4–5</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 4 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><div class=\"cols w\"><ol class=\"lead\"><li>Sebutkan sembilan blok Business Model Canvas.</li><li>Apa beda <i>Channels</i> dan <i>Customer Relationships</i>?</li><li>Ubah fitur ini menjadi proposisi nilai: \"Aplikasi kami punya fitur pelacakan pesanan.\"</li></ol><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Cek cepat kelompok</h3><p>Angkat tangan bila draf BMC kelompok Anda:</p><ul><li>sudah terisi kesembilan bloknya,</li><li>isi bertanda tanya sudah ditanyakan ke mitra,</li><li>sudah punya satu kalimat proposisi nilai digital.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemanasan</span><span>3 menit · berpasangan</span></div><h2>Siapa yang sebenarnya menjual?</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>A · Galeri batik</h3><p>UMKM batik tulis di Sidoarjo membatik sendiri, lalu menjual kainnya di galeri dan akun Instagram miliknya.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20\"/></svg>B · Marketplace</h3><p>Sebuah marketplace tidak membuat satu kain pun, tetapi setiap hari ribuan kain batik terjual di dalamnya.</p></div></div><ol style=\"margin-top:.9em\"><li>Dari mana nilai tercipta pada A? Pada B?</li><li>Siapa saja \"pelanggan\" B?</li><li>Apa yang terjadi pada B bila semua penjual pergi? Bila semua pembeli pergi?</li></ol><p class=\"muted\" style=\"font-size:.85em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 2</span></div><h2>Pipeline dan platform</h2><figure class=\"fig\"><svg viewBox=\"0 0 880 245\" style=\"max-height:12.5em\" role=\"img\" aria-label=\"Dua panel. Kiri, pipeline: pemasok ke organisasi ke pelanggan, nilai mengalir satu arah. Kanan, platform: penjual dan pembeli sama-sama terhubung ke platform di tengah dan berinteraksi langsung satu sama lain; nilai tercipta dari interaksi kedua sisi.\"><defs><marker id=\"dp\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><text x=\"10\" y=\"20\" class=\"s-hd\">PIPELINE · LINEAR</text><rect x=\"10\" y=\"72\" width=\"110\" height=\"60\" rx=\"8\" class=\"s-box\"/><text x=\"65\" y=\"98\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Pemasok</text><text x=\"65\" y=\"118\" text-anchor=\"middle\" class=\"s-s\">bahan, barang</text><rect x=\"155\" y=\"62\" width=\"135\" height=\"80\" rx=\"8\" class=\"s-acc\"/><text x=\"222\" y=\"96\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Organisasi</text><text x=\"222\" y=\"118\" text-anchor=\"middle\" class=\"s-s\">membuat &amp; menjual</text><rect x=\"325\" y=\"72\" width=\"100\" height=\"60\" rx=\"8\" class=\"s-soft\"/><text x=\"375\" y=\"98\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Pelanggan</text><text x=\"375\" y=\"118\" text-anchor=\"middle\" class=\"s-s\">membeli</text><line x1=\"122\" y1=\"102\" x2=\"151\" y2=\"102\" class=\"s-line\" marker-end=\"url(#dp)\"/><line x1=\"292\" y1=\"102\" x2=\"321\" y2=\"102\" class=\"s-line\" marker-end=\"url(#dp)\"/><line x1=\"10\" y1=\"172\" x2=\"425\" y2=\"172\" class=\"s-line\" marker-end=\"url(#dp)\"/><text x=\"217\" y=\"196\" text-anchor=\"middle\" class=\"s-hd\">NILAI MENGALIR SATU ARAH</text><text x=\"217\" y=\"222\" text-anchor=\"middle\" class=\"s-s\">contoh: UMKM batik tulis (Pertemuan 4), toko roti</text><line x1=\"446\" y1=\"12\" x2=\"446\" y2=\"232\" class=\"s-dash\"/><text x=\"468\" y=\"20\" class=\"s-hd\">PLATFORM · MULTISISI</text><path d=\"M520 108 C520 44 820 44 820 108\" class=\"s-dash\"/><text x=\"670\" y=\"52\" text-anchor=\"middle\" class=\"s-s\" style=\"font-weight:700\">interaksi langsung</text><rect x=\"468\" y=\"110\" width=\"104\" height=\"60\" rx=\"8\" class=\"s-soft\"/><text x=\"520\" y=\"136\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Sisi A</text><text x=\"520\" y=\"156\" text-anchor=\"middle\" class=\"s-s\">penjual</text><rect x=\"615\" y=\"102\" width=\"110\" height=\"76\" rx=\"8\" class=\"s-hl\"/><text x=\"670\" y=\"134\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:15px\">Platform</text><text x=\"670\" y=\"156\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11px\">aturan, data, bayar</text><rect x=\"768\" y=\"110\" width=\"104\" height=\"60\" rx=\"8\" class=\"s-soft\"/><text x=\"820\" y=\"136\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Sisi B</text><text x=\"820\" y=\"156\" text-anchor=\"middle\" class=\"s-s\">pembeli</text><line x1=\"575\" y1=\"140\" x2=\"611\" y2=\"140\" class=\"s-line\" marker-start=\"url(#dp)\" marker-end=\"url(#dp)\"/><line x1=\"728\" y1=\"140\" x2=\"764\" y2=\"140\" class=\"s-line\" marker-start=\"url(#dp)\" marker-end=\"url(#dp)\"/><text x=\"670\" y=\"208\" text-anchor=\"middle\" class=\"s-hd\">NILAI TERCIPTA DARI INTERAKSI KEDUA SISI</text><text x=\"670\" y=\"230\" text-anchor=\"middle\" class=\"s-s\">contoh: marketplace, aplikasi transportasi daring</text></svg><figcaption>Pipeline: definisi kerja mata kuliah ini. Platform: diadaptasi dari pola multi-sided platforms dalam Osterwalder &amp; Pigneur (2010). Gambar ilustrasi dosen.</figcaption></figure><div class=\"cols\" style=\"margin-top:.5em\"><div class=\"card\"><p><b><button type=\"button\" class=\"term\" data-term=\"pipeline\">Pipeline</button></b>: organisasi membuat atau menyediakan produk lalu menjualnya; nilai mengalir satu arah. <span class=\"muted\" style=\"font-size:.85em\">Definisi kerja mata kuliah ini.</span></p></div><div class=\"card hl\"><p><b><button type=\"button\" class=\"term\" data-term=\"platform-business\">Platform</button></b>: organisasi mempertemukan dua atau lebih kelompok pengguna; nilai tercipta dari interaksi mereka.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Definisi</span><span>Indikator 2</span></div><h2>Pola <button type=\"button\" class=\"term\" data-term=\"multi-sided-platform\">multi-sided platform</button></h2><div class=\"cols w\"><div style=\"font-size:.92em\"><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"Multi-sided platforms bring together two or more distinct but interdependent groups of customers. … The platform creates value by facilitating interactions between the different groups.\"</p><p class=\"tr\">\"Platform-platform multisisi mempertemukan dua atau lebih kelompok pelanggan yang berbeda tetapi saling bergantung. … Platform tersebut menciptakan nilai dengan memfasilitasi interaksi-interaksi antara kelompok-kelompok yang berbeda itu.\"</p><div class=\"src\">Osterwalder &amp; Pigneur (2010), potongan; terjemahan harfiah penyusun</div></blockquote><ul style=\"margin-top:.7em\"><li><b>Berbeda</b>: kebutuhan tiap kelompok tidak sama (penjual ingin laku, pembeli ingin pilihan).</li><li><b>Saling bergantung</b>: satu kelompok bernilai bagi yang lain hanya bila keduanya hadir.</li><li><b>Memfasilitasi</b>: platform menyediakan tempat, aturan, dan alat bertransaksi.</li></ul></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Di BMC terlihat dari…</h3><ul><li><b>Customer Segments</b>: dua kelompok atau lebih</li><li><b>Value Propositions</b>: satu untuk tiap kelompok</li><li><b>Revenue Streams</b>: sering hanya dari satu sisi, sisi lain gratis</li><li><b>Key Resources</b>: platform dan komunitas penggunanya</li></ul><p class=\"muted\" style=\"font-size:.85em\">Rangkuman dosen.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Perbandingan</span><span>Indikator 2</span></div><h2>Pipeline vs platform: apa bedanya?</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Aspek</th><th>Pipeline</th><th>Platform</th></tr></thead><tbody><tr><td><b>Sumber nilai</b></td><td>produk atau layanan yang dibuat organisasi</td><td>interaksi antar kelompok pengguna</td></tr><tr><td><b>Pelanggan</b></td><td>satu arah: pembeli</td><td>dua sisi atau lebih yang saling butuh</td></tr><tr><td><b>Aset utama</b></td><td>bahan, mesin, stok, karyawan</td><td>komunitas pengguna, data, aturan main</td></tr><tr><td><b>Cara tumbuh</b></td><td>menambah kapasitas produksi</td><td>menambah pengguna di setiap sisi (<button type=\"button\" class=\"term\" data-term=\"network-effect\">efek jaringan</button>)</td></tr><tr><td><b>Pendapatan</b></td><td>harga jual dikurangi biaya</td><td><button type=\"button\" class=\"term\" data-term=\"commission\">komisi</button>, iklan, langganan; sering satu sisi gratis</td></tr><tr><td><b>Tantangan awal</b></td><td>modal dan pemasaran produk</td><td><button type=\"button\" class=\"term\" data-term=\"cold-start\">cold start</button>: kedua sisi belum ada</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Rangkuman dosen dari konsep platform Osterwalder &amp; Pigneur (2010) dan Rogers (2016).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh BMC</span><span>Kasus ilustrasi · indikator 2</span></div><h2>BMC platform: Pasar Santri</h2><figure class=\"fig\"><svg viewBox=\"-4 -4 1008 368\" style=\"max-height:18.5em\" role=\"img\" aria-label=\"Business Model Canvas dengan sembilan blok: di kiri Key Partnerships, Key Activities, Key Resources; di tengah Value Propositions; di kanan Customer Relationships, Channels, Customer Segments; di bawah Cost Structure dan Revenue Streams. Berisi contoh kasus ilustrasi.\"><rect x=\"0\" y=\"0\" width=\"200\" height=\"260\" class=\"s-box\"/><text x=\"10\" y=\"21\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">8 </tspan>Key Partnerships</text><text x=\"10\" y=\"43\" class=\"s-s\" style=\"font-size:12px\">penyedia gerbang bayar</text><text x=\"10\" y=\"61\" class=\"s-s\" style=\"font-size:12px\">jasa kirim lokal</text><text x=\"10\" y=\"79\" class=\"s-s\" style=\"font-size:12px\">pengurus pondok</text><rect x=\"200\" y=\"0\" width=\"200\" height=\"130\" class=\"s-box\"/><text x=\"210\" y=\"21\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">7 </tspan>Key Activities</text><text x=\"210\" y=\"43\" class=\"s-s\" style=\"font-size:12px\">kurasi penjual</text><text x=\"210\" y=\"61\" class=\"s-s\" style=\"font-size:12px\">kelola aplikasi dan bayar</text><text x=\"210\" y=\"79\" class=\"s-s\" style=\"font-size:12px\">promosi ke kedua sisi</text><rect x=\"200\" y=\"130\" width=\"200\" height=\"130\" class=\"s-box\"/><text x=\"210\" y=\"151\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">6 </tspan>Key Resources</text><text x=\"210\" y=\"173\" class=\"s-s\" style=\"font-size:12px\">aplikasi dan data transaksi</text><text x=\"210\" y=\"191\" class=\"s-s\" style=\"font-size:12px\">jaringan alumni dan wali</text><text x=\"210\" y=\"209\" class=\"s-s\" style=\"font-size:12px\">kepercayaan pada pondok</text><rect x=\"400\" y=\"0\" width=\"200\" height=\"260\" class=\"s-acc\"/><text x=\"410\" y=\"21\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">2 </tspan>Value Propositions</text><text x=\"410\" y=\"43\" class=\"s-s\" style=\"font-size:12px\">A: pasar ribuan wali santri</text><text x=\"410\" y=\"61\" class=\"s-s\" style=\"font-size:12px\">B: produk alumni tepercaya</text><text x=\"410\" y=\"79\" class=\"s-s\" style=\"font-size:12px\">B: kirim langsung ke pondok</text><rect x=\"600\" y=\"0\" width=\"200\" height=\"130\" class=\"s-soft\"/><text x=\"610\" y=\"21\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">4 </tspan>Customer Relationships</text><text x=\"610\" y=\"43\" class=\"s-s\" style=\"font-size:12px\">pendampingan UMKM (A)</text><text x=\"610\" y=\"61\" class=\"s-s\" style=\"font-size:12px\">layanan pelanggan (B)</text><text x=\"610\" y=\"79\" class=\"s-s\" style=\"font-size:12px\">ulasan dan rating</text><rect x=\"600\" y=\"130\" width=\"200\" height=\"130\" class=\"s-soft\"/><text x=\"610\" y=\"151\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">3 </tspan>Channels</text><text x=\"610\" y=\"173\" class=\"s-s\" style=\"font-size:12px\">aplikasi web Pasar Santri</text><text x=\"610\" y=\"191\" class=\"s-s\" style=\"font-size:12px\">grup WhatsApp wali</text><text x=\"610\" y=\"209\" class=\"s-s\" style=\"font-size:12px\">pengumuman di pondok</text><rect x=\"800\" y=\"0\" width=\"200\" height=\"260\" class=\"s-soft\"/><text x=\"810\" y=\"21\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">1 </tspan>Customer Segments</text><text x=\"810\" y=\"43\" class=\"s-s\" style=\"font-size:12px\">Sisi A: UMKM alumni (penjual)</text><text x=\"810\" y=\"61\" class=\"s-s\" style=\"font-size:12px\">Sisi B: wali santri (pembeli)</text><text x=\"810\" y=\"79\" class=\"s-s\" style=\"font-size:12px\">dua sisi saling membutuhkan</text><rect x=\"0\" y=\"260\" width=\"500\" height=\"100\" class=\"s-box\"/><text x=\"10\" y=\"281\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">9 </tspan>Cost Structure</text><text x=\"10\" y=\"303\" class=\"s-s\" style=\"font-size:12px\">pengembangan aplikasi dan server</text><text x=\"10\" y=\"321\" class=\"s-s\" style=\"font-size:12px\">biaya pembayaran digital</text><text x=\"10\" y=\"339\" class=\"s-s\" style=\"font-size:12px\">promosi awal (subsidi)</text><rect x=\"500\" y=\"260\" width=\"500\" height=\"100\" class=\"s-soft\"/><text x=\"510\" y=\"281\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">5 </tspan>Revenue Streams</text><text x=\"510\" y=\"303\" class=\"s-s\" style=\"font-size:12px\">komisi 5% per transaksi (dari A)</text><text x=\"510\" y=\"321\" class=\"s-s\" style=\"font-size:12px\">gratis untuk pembeli (B)</text></svg><figcaption>Business Model Canvas kasus ilustrasi \"Pasar Santri\": koperasi pondok pesantren mempertemukan UMKM alumni dengan wali santri. Kanvas Osterwalder &amp; Pigneur (2010); angka komisi adalah data ilustrasi.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Rogers (2016) · indikator 2</span></div><h2>Efek jaringan</h2><p><button type=\"button\" class=\"term\" data-term=\"network-effect\">Efek jaringan</button>: nilai layanan bagi setiap pengguna bertambah ketika jumlah penggunanya bertambah. <span class=\"muted\" style=\"font-size:.85em\">Diadaptasi dari Rogers (2016).</span></p><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg><button type=\"button\" class=\"term\" data-term=\"direct-network-effect\">Langsung</button></h3><p>Di dalam kelompok yang sama.</p><p class=\"muted\" style=\"font-size:.9em\">Aplikasi pesan makin berguna bila makin banyak kenalan Anda memakainya.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg><button type=\"button\" class=\"term\" data-term=\"indirect-network-effect\">Tidak langsung</button></h3><p>Antarkelompok yang berbeda.</p><p class=\"muted\" style=\"font-size:.9em\">Makin banyak pengemudi, makin cepat penumpang mendapat kendaraan; makin banyak penumpang, makin ramai order pengemudi.</p></div></div><div class=\"callout\" style=\"margin-top:.7em;font-size:.92em\"><b>Contoh hitung (ilustrasi):</b> grup berisi <i>n</i> orang punya <i>n</i>(<i>n</i>−1)/2 pasangan yang bisa saling berkirim pesan: 5 orang → 5×4/2 = <b>10</b>; 10 orang → 10×9/2 = <b>45</b>. Pada platform dua sisi, 10 penjual × 100 pembeli = <b>1.000</b> pasangan transaksi yang mungkin.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Proses</span><span>Tekan Play atau klik tiap tahap</span></div><h2>Roda efek jaringan tidak langsung</h2><div class=\"sim sim-stepper\" data-sim=\"stepper\" data-cfg=\"{&quot;id&quot;:&quot;td5-roda&quot;,&quot;ms&quot;:3000,&quot;steps&quot;:[{&quot;t&quot;:&quot;Penjual bergabung&quot;,&quot;en&quot;:&quot;supply side&quot;,&quot;d&quot;:&quot;Platform mengajak kelompok pertama, biasanya penyedia barang atau jasa, agar etalase tidak kosong.&quot;,&quot;ex&quot;:&quot;Koperasi mengajak 15 UMKM alumni berjualan di Pasar Santri.&quot;},{&quot;t&quot;:&quot;Pilihan bertambah&quot;,&quot;en&quot;:&quot;more value for buyers&quot;,&quot;d&quot;:&quot;Makin banyak penjual, makin banyak pilihan dan makin besar peluang pembeli menemukan yang dicari.&quot;,&quot;ex&quot;:&quot;Wali santri bisa memilih kue, sarung, dan kitab dari banyak alumni.&quot;},{&quot;t&quot;:&quot;Pembeli datang&quot;,&quot;en&quot;:&quot;demand side&quot;,&quot;d&quot;:&quot;Pembeli tertarik karena pilihan banyak dan prosesnya mudah; kabar menyebar dari mulut ke mulut.&quot;,&quot;ex&quot;:&quot;Wali santri saling berbagi tautan di grup WhatsApp angkatan.&quot;},{&quot;t&quot;:&quot;Transaksi dan data bertambah&quot;,&quot;en&quot;:&quot;more interactions&quot;,&quot;d&quot;:&quot;Setiap transaksi meninggalkan data dan ulasan; platform makin tahu apa yang dicari dan siapa penjual yang tepercaya.&quot;,&quot;ex&quot;:&quot;Ulasan pembeli membantu wali santri lain memilih; koperasi tahu produk yang laris menjelang liburan.&quot;},{&quot;t&quot;:&quot;Penjual baru tertarik&quot;,&quot;en&quot;:&quot;the wheel turns again&quot;,&quot;d&quot;:&quot;Pembeli yang ramai menarik penjual baru, dan roda berputar lagi. Roda yang sama bisa berputar mundur bila salah satu sisi pergi.&quot;,&quot;ex&quot;:&quot;UMKM alumni angkatan lain minta ikut berjualan.&quot;}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.5em\">Rangkuman dosen tentang efek jaringan tidak langsung (Rogers, 2016). Contoh: kasus ilustrasi Pasar Santri.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Simulasi</span><span>Geser titik atau slider</span></div><h2>Dua sisi, satu platform</h2><div class=\"sim sim-grid2\" data-sim=\"grid2\" data-cfg=\"{&quot;id&quot;:&quot;td5-sisi&quot;,&quot;aria&quot;:&quot;Simulasi platform dua sisi. Sumbu mendatar jumlah penjual aktif, sumbu tegak jumlah pembeli aktif. Lima zona: cold start, kurang pembeli, kurang penjual, tumbuh seimbang, efek jaringan menguat.&quot;,&quot;x&quot;:{&quot;label&quot;:&quot;Jumlah penjual aktif&quot;},&quot;y&quot;:{&quot;label&quot;:&quot;Jumlah pembeli aktif&quot;},&quot;init&quot;:[1,1],&quot;zones&quot;:[{&quot;k&quot;:&quot;gr&quot;,&quot;en&quot;:&quot;Tumbuh&quot;,&quot;name&quot;:&quot;Tumbuh seimbang&quot;,&quot;tag&quot;:&quot;roda mulai berputar&quot;,&quot;r&quot;:[4,6,4,6],&quot;v&quot;:[3.5,6.5,3.5,6.5],&quot;cls&quot;:&quot;s-box&quot;,&quot;d&quot;:&quot;Kedua sisi mulai cukup. Transaksi terjadi rutin, tetapi platform masih rapuh; satu sisi yang pergi bisa menghentikan roda.&quot;,&quot;ex&quot;:&quot;Pasar Santri punya 30 penjual dan 300 wali aktif; pesanan datang setiap hari.&quot;},{&quot;k&quot;:&quot;ne&quot;,&quot;en&quot;:&quot;Network effects&quot;,&quot;name&quot;:&quot;Efek jaringan menguat&quot;,&quot;tag&quot;:&quot;pengguna menarik pengguna&quot;,&quot;r&quot;:[5,10,5,10],&quot;cls&quot;:&quot;s-soft&quot;,&quot;d&quot;:&quot;Banyak penjual dan banyak pembeli saling menarik. Platform tumbuh dengan biaya promosi yang makin kecil per pengguna.&quot;,&quot;ex&quot;:&quot;Penjual dan wali dari pondok cabang lain ikut bergabung tanpa banyak diajak.&quot;},{&quot;k&quot;:&quot;kb&quot;,&quot;en&quot;:&quot;Kurang pembeli&quot;,&quot;name&quot;:&quot;Penjual sepi pembeli&quot;,&quot;tag&quot;:&quot;sisi permintaan lemah&quot;,&quot;r&quot;:[5,10,0,5],&quot;cls&quot;:&quot;s-acc&quot;,&quot;d&quot;:&quot;Banyak penjual, sedikit pembeli. Penjual kecewa karena tidak laku dan mulai pergi. Fokus ke sisi pembeli: promosi, gratis ongkir pertama.&quot;,&quot;ex&quot;:&quot;50 UMKM alumni terdaftar, tetapi wali santri belum tahu Pasar Santri ada.&quot;},{&quot;k&quot;:&quot;kp&quot;,&quot;en&quot;:&quot;Kurang penjual&quot;,&quot;name&quot;:&quot;Pembeli kurang pilihan&quot;,&quot;tag&quot;:&quot;sisi penawaran lemah&quot;,&quot;r&quot;:[0,5,5,10],&quot;cls&quot;:&quot;s-acc&quot;,&quot;d&quot;:&quot;Banyak pembeli, sedikit penjual. Pembeli tidak menemukan yang dicari lalu kembali ke marketplace lain. Fokus ke sisi penjual: ajak dan dampingi UMKM.&quot;,&quot;ex&quot;:&quot;Ratusan wali membuka aplikasi, tetapi isinya hanya lima jenis kue.&quot;},{&quot;k&quot;:&quot;cs&quot;,&quot;en&quot;:&quot;Cold start&quot;,&quot;name&quot;:&quot;Masalah ayam dan telur&quot;,&quot;tag&quot;:&quot;kedua sisi menunggu&quot;,&quot;r&quot;:[0,5,0,5],&quot;cls&quot;:&quot;s-soft&quot;,&quot;d&quot;:&quot;Penjual menunggu pembeli, pembeli menunggu penjual. Platform perlu memulai dari satu sisi: mengisi etalase sendiri, menyubsidi, atau mengajak komunitas yang sudah ada.&quot;,&quot;ex&quot;:&quot;Hari pertama Pasar Santri dibuka: dua penjual, tiga pembeli.&quot;}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.5em\">Batas zona dan contoh angka adalah penyederhanaan untuk simulasi (data ilustrasi).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Ekosistem · indikator 2</span></div><h2>Dari platform ke <button type=\"button\" class=\"term\" data-term=\"ecosystem\">ekosistem</button></h2><div class=\"cols\"><div><p>Rogers <span class=\"cite\">(2016)</span> mencatat pergeseran domain <b>Competition</b> (Pertemuan 1):</p><ul><li>dari produk dengan keunggulan sendiri → ke <b>platform dengan mitra</b> yang saling bertukar nilai;</li><li>dari aset kunci di dalam organisasi → ke aset di <b>jaringan luar</b>;</li><li>efek jaringan dapat membuat satu pemain menguasai pasar (<button type=\"button\" class=\"term\" data-term=\"winner-takes-all\">winner-takes-all</button>).</li></ul><p style=\"margin-top:.6em\">Pintu masuk mitra adalah <b>API</b> (Pertemuan 3), contohnya SNAP untuk pembayaran.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Awas istilah yang mirip</h3><p><b><button type=\"button\" class=\"term\" data-term=\"digital-platform\">Digital platform</button></b> (Ross et al., 2019; Pertemuan 2): komponen internal yang dapat dipakai ulang untuk membangun layanan baru.</p><p><b>Model bisnis platform</b> (hari ini): mempertemukan kelompok pengguna.</p><p class=\"muted\" style=\"font-size:.9em\">Keduanya bertemu pada <button type=\"button\" class=\"term\" data-term=\"external-developer-platform\">external developer platform</button>, yaitu komponen yang dibuka untuk mitra luar.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh Indonesia</span><span>Indikator 2</span></div><h2>Platform digital di sekitar kita</h2><div class=\"tw\"><table class=\"t\" style=\"font-size:.88em\"><thead><tr><th>Platform</th><th>Sisi yang dipertemukan</th><th>Nilai yang ditawarkan</th><th>Sumber fakta</th></tr></thead><tbody><tr><td><b>Gojek</b></td><td>penumpang dan pembeli, pengemudi, mitra usaha</td><td>transportasi, pesan-antar, pembayaran dalam satu aplikasi</td><td>Liputan6.com (2022)</td></tr><tr><td><b>Marketplace</b></td><td>pembeli, penjual (termasuk UMKM), jasa kirim</td><td>pilihan luas, transaksi terlindungi, ulasan</td><td>Google et al. (2024)</td></tr><tr><td><b>SNAP</b></td><td>bank, penyedia jasa pembayaran, aplikasi</td><td>sambungan pembayaran dengan standar API yang sama</td><td>Suara Surabaya (2021)</td></tr><tr><td><b>SATUSEHAT</b></td><td>fasilitas kesehatan, pasien, pengembang aplikasi</td><td>rekam medis yang dapat dipertukarkan (HL7 FHIR)</td><td>Ditjen Yankes (2023)</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Fakta dari sumber yang tertera; pemetaan sisi dan nilai adalah analisis dosen.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Skenario interaktif</span><span>Anda pengelola Pasar Santri</span></div><h2>Membangun platform dari nol</h2><div class=\"sim sim-scenario\" data-sim=\"scenario\" data-cfg=\"{&quot;id&quot;:&quot;td5-skenario&quot;,&quot;start&quot;:&quot;s1&quot;,&quot;ask&quot;:&quot;Apa keputusan Anda?&quot;,&quot;nodes&quot;:{&quot;s1&quot;:{&quot;text&quot;:&quot;Koperasi pondok pesantren sudah membuat aplikasi web Pasar Santri untuk mempertemukan UMKM alumni dengan wali santri. Belum ada penjual maupun pembeli.&quot;,&quot;say&quot;:[[&quot;Ketua koperasi&quot;,&quot;Aplikasinya sudah jadi. Bagaimana kita memulainya?&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Umumkan ke semua orang dan tunggu penjual serta pembeli datang sendiri.&quot;,&quot;tag&quot;:&quot;Menunggu&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;to&quot;:&quot;e_sepi&quot;,&quot;fb&quot;:&quot;Ini masalah cold start: penjual menunggu pembeli, pembeli menunggu penjual. Tanpa langkah awal, kedua sisi tidak bergerak.&quot;},{&quot;t&quot;:&quot;Ajak 15 UMKM alumni yang produknya sudah dikenal, kurasi produknya, dan koperasi ikut berjualan agar etalase tidak kosong.&quot;,&quot;tag&quot;:&quot;Mulai dari satu sisi&quot;,&quot;k&quot;:&quot;good&quot;,&quot;to&quot;:&quot;s2&quot;,&quot;fb&quot;:&quot;Tepat. Mengisi satu sisi lebih dulu (sisi penjual) memberi alasan bagi pembeli untuk datang.&quot;},{&quot;t&quot;:&quot;Tarik komisi 20% dari penjual dan biaya layanan dari pembeli sejak hari pertama agar cepat balik modal.&quot;,&quot;tag&quot;:&quot;Tarik untung dulu&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;to&quot;:&quot;e_mahal&quot;,&quot;fb&quot;:&quot;Biaya tinggi di awal membuat kedua sisi enggan mencoba. Banyak platform justru menggratiskan atau menyubsidi salah satu sisi di awal.&quot;}]},&quot;s2&quot;:{&quot;text&quot;:&quot;Dua minggu berjalan. Etalase terisi, tetapi pembeli masih sedikit.&quot;,&quot;say&quot;:[[&quot;UMKM alumni&quot;,&quot;Produk saya sudah tayang, tapi baru laku dua.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Beri gratis ongkir untuk pembelian pertama wali santri dan perkenalkan Pasar Santri di pertemuan wali.&quot;,&quot;tag&quot;:&quot;Subsidi sisi pembeli&quot;,&quot;k&quot;:&quot;good&quot;,&quot;to&quot;:&quot;s3&quot;,&quot;fb&quot;:&quot;Tepat. Sisi yang lemah diperkuat: subsidi kecil dan komunitas yang sudah ada (pertemuan wali) menarik pembeli pertama.&quot;},{&quot;t&quot;:&quot;Tambah sebanyak mungkin penjual tanpa kurasi supaya pilihan makin banyak.&quot;,&quot;tag&quot;:&quot;Tambah penjual saja&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;to&quot;:&quot;e_kualitas&quot;,&quot;fb&quot;:&quot;Masalahnya ada di sisi pembeli, bukan penjual. Penjual tanpa kurasi juga berisiko menurunkan kepercayaan.&quot;}]},&quot;s3&quot;:{&quot;text&quot;:&quot;Transaksi mulai rutin. Platform kini menyimpan data ratusan wali santri dan riwayat belanjanya.&quot;,&quot;say&quot;:[[&quot;Pihak luar&quot;,&quot;Kami siap membayar daftar nomor WhatsApp wali santri untuk promosi produk kami.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Tolak. Bangun ulasan dan rating, aturan penjual yang jelas, dan lindungi data pembeli.&quot;,&quot;tag&quot;:&quot;Jaga kepercayaan&quot;,&quot;k&quot;:&quot;good&quot;,&quot;to&quot;:&quot;e_baik&quot;,&quot;fb&quot;:&quot;Tepat. Kepercayaan adalah aset utama platform; data pengguna bukan barang dagangan.&quot;},{&quot;t&quot;:&quot;Terima. Lumayan untuk menutup biaya server.&quot;,&quot;tag&quot;:&quot;Jual data&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;to&quot;:&quot;e_data&quot;,&quot;fb&quot;:&quot;Ini melanggar kepercayaan pengguna dan berisiko melanggar aturan pelindungan data pribadi (dibahas di Pertemuan 14).&quot;}]},&quot;e_sepi&quot;:{&quot;end&quot;:&quot;Sebulan kemudian aplikasi hanya berisi dua produk dan tidak ada transaksi. Pengurus menganggap platform \\&quot;tidak cocok untuk pondok\\&quot;, padahal masalahnya cara memulai.&quot;,&quot;title&quot;:&quot;Akhir: terjebak cold start&quot;,&quot;k&quot;:&quot;bad&quot;},&quot;e_mahal&quot;:{&quot;end&quot;:&quot;Beberapa UMKM mencoba lalu berhenti karena potongan terlalu besar; wali santri memilih marketplace yang gratis ongkir. Roda efek jaringan tidak pernah berputar.&quot;,&quot;title&quot;:&quot;Akhir: kedua sisi menjauh&quot;,&quot;k&quot;:&quot;bad&quot;},&quot;e_kualitas&quot;:{&quot;end&quot;:&quot;Etalase penuh, tetapi pembeli tetap sedikit. Beberapa produk tidak sesuai foto dan ulasan pertama bernada kecewa. Penjual yang baik ikut pergi.&quot;,&quot;title&quot;:&quot;Akhir: ramai penjual, sepi kepercayaan&quot;,&quot;k&quot;:&quot;mid&quot;},&quot;e_data&quot;:{&quot;end&quot;:&quot;Wali santri dibanjiri pesan promosi dan bertanya dari mana nomor mereka bocor. Kepercayaan pada koperasi dan pondok turun; banyak yang berhenti memakai Pasar Santri.&quot;,&quot;title&quot;:&quot;Akhir: roda berputar mundur&quot;,&quot;k&quot;:&quot;bad&quot;},&quot;e_baik&quot;:{&quot;end&quot;:&quot;Ulasan membantu pembeli memilih, penjual menjaga mutu, dan wali santri merekomendasikan Pasar Santri ke wali lain. UMKM alumni angkatan baru ikut bergabung: efek jaringan mulai bekerja.&quot;,&quot;title&quot;:&quot;Akhir: platform tumbuh sehat&quot;,&quot;k&quot;:&quot;good&quot;}}}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Latihan</span><span>Berpasangan · 7 menit · kasus ilustrasi</span></div><h2>Pipeline, platform, atau campuran?</h2><div class=\"grid3\"><div class=\"card\"><h3>1</h3><p>Toko roti rumahan menjual roti buatannya lewat Instagram.</p></div><div class=\"card\"><h3>2</h3><p>Aplikasi kursus mengaji mempertemukan ustaz privat dengan orang tua murid.</p></div><div class=\"card\"><h3>3</h3><p>Kantor desa membuka layanan surat daring; desa sendiri yang memproses surat.</p></div><div class=\"card\"><h3>4</h3><p>Pasar daring milik desa tempat warga menjual hasil kebun kepada pembeli dari kota.</p></div><div class=\"card\"><h3>5</h3><p>Marketplace yang juga menjual barang dengan merek dan gudangnya sendiri.</p></div><div class=\"card\"><h3>6</h3><p>Kampus membuka portal lowongan magang: perusahaan memasang lowongan, mahasiswa melamar.</p></div></div><p class=\"lead\" style=\"margin-top:.7em;font-size:1em\">Untuk setiap kasus: jenisnya apa, dan apa buktinya? (berapa kelompok pelanggan, dari mana nilai tercipta)</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Workshop BMC</span><span>Kelompok proyek · 25 menit</span></div><h2>Lengkapi BMC mitra Anda</h2><div class=\"cols w\"><div><ol><li>Buka draf BMC dari Pertemuan 4; lengkapi blok yang masih kosong atau bertanda tanya.</li><li>Periksa <b>Customer Segments</b>: adakah dua kelompok atau lebih yang <b>saling membutuhkan</b>?</li><li>Tentukan: mitra lebih dekat ke <b>pipeline</b>, <b>platform</b>, atau <b>campuran</b>? Tulis buktinya dari blok CS, VP, dan RS.</li><li>Bila pipeline: platform pihak lain apa yang dipakai mitra (marketplace, aplikasi pesan-antar)? Tulis di Channels atau Key Partnerships beserta risikonya.</li><li>Perbarui kalimat <b>proposisi nilai digital</b> mitra.</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Pertanyaan pemandu</h3><ul><li>Apakah mitra membuat sendiri atau mempertemukan?</li><li>Bila satu kelompok pelanggan hilang, apakah kelompok lain ikut pergi?</li><li>Adakah peluang mitra menjadi platform kecil, mis. bagi UMKM di sekitarnya?</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Penilaian sejawat</span><span>Formatif · tidak masuk nilai</span></div><h2>Periksa BMC kelompok lain</h2><div class=\"sim sim-peer\" data-sim=\"peer\" data-cfg=\"{&quot;id&quot;:&quot;td5-sejawat&quot;,&quot;title&quot;:&quot;Penilaian sejawat · BMC organisasi mitra (Transformasi Digital P5)&quot;,&quot;levels&quot;:[&quot;Belum tampak&quot;,&quot;Mulai tampak&quot;,&quot;Tampak&quot;,&quot;Menonjol&quot;],&quot;pick&quot;:&quot;Pilih level 1–4.&quot;,&quot;whoLabel&quot;:&quot;Kelompok yang dinilai (nama/mitra)&quot;,&quot;whoPh&quot;:&quot;mis. Kelompok 2 · UMKM keripik&quot;,&quot;goodLabel&quot;:&quot;Yang sudah baik&quot;,&quot;goodPh&quot;:&quot;Satu hal spesifik di kanvas mereka&quot;,&quot;tipLabel&quot;:&quot;Saran perbaikan&quot;,&quot;tipPh&quot;:&quot;Sebut blok yang perlu diperbaiki dan caranya&quot;,&quot;bands&quot;:[{&quot;min&quot;:0,&quot;t&quot;:&quot;Perlu banyak perbaikan&quot;},{&quot;min&quot;:8,&quot;t&quot;:&quot;Berkembang&quot;},{&quot;min&quot;:11,&quot;t&quot;:&quot;Baik&quot;},{&quot;min&quot;:14,&quot;t&quot;:&quot;Sangat baik&quot;}],&quot;criteria&quot;:[{&quot;t&quot;:&quot;Kelengkapan sembilan blok&quot;,&quot;ind&quot;:&quot;Indikator 1&quot;,&quot;d&quot;:[&quot;Beberapa blok kosong.&quot;,&quot;Semua blok terisi, tetapi banyak isi terlalu umum.&quot;,&quot;Semua blok terisi spesifik.&quot;,&quot;Semua blok spesifik dan bersumber dari data mitra.&quot;]},{&quot;t&quot;:&quot;Konsistensi antarblok&quot;,&quot;ind&quot;:&quot;Indikator 1&quot;,&quot;d&quot;:[&quot;Banyak blok tidak nyambung.&quot;,&quot;Ada segmen tanpa saluran atau biaya tanpa aktivitas.&quot;,&quot;Sebagian besar blok saling terhubung.&quot;,&quot;Setiap segmen dapat ditelusuri ke saluran, nilai, dan pendapatannya.&quot;]},{&quot;t&quot;:&quot;Analisis pipeline atau platform&quot;,&quot;ind&quot;:&quot;Indikator 2&quot;,&quot;d&quot;:[&quot;Belum menentukan jenisnya.&quot;,&quot;Menentukan jenis tanpa bukti.&quot;,&quot;Menentukan jenis dengan bukti dari blok BMC.&quot;,&quot;Bukti kuat, termasuk ketergantungan pada platform pihak lain atau sisi yang saling membutuhkan.&quot;]},{&quot;t&quot;:&quot;Proposisi nilai digital&quot;,&quot;ind&quot;:&quot;Indikator 3&quot;,&quot;d&quot;:[&quot;Berupa daftar fitur.&quot;,&quot;Menyebut manfaat, tetapi tidak jelas untuk segmen mana.&quot;,&quot;Manfaat jelas untuk segmen tertentu.&quot;,&quot;Manfaat jelas, per segmen, dan bergantung pada teknologi digital.&quot;]}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.78em;margin-top:.5em\">Isian hanya tersimpan di perangkat Anda. Tekan Copy summary, lalu kirim ke kelompok yang dinilai.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>Pipeline</b> membuat lalu menjual; <b>platform</b> mempertemukan dua atau lebih kelompok yang saling bergantung.</li><li>Di BMC, platform terlihat dari dua segmen atau lebih, proposisi nilai per sisi, dan pendapatan yang sering hanya dari satu sisi.</li><li><b>Efek jaringan</b>: langsung (sesama pengguna) dan tidak langsung (antarkelompok); rodanya bisa berputar maju atau mundur.</li><li>Platform harus mengatasi <b>cold start</b> dan menjaga kepercayaan kedua sisi.</li><li>Platform menjadi pusat <b>ekosistem</b>; logikanya dipakai swasta maupun pemerintah (SNAP, SATUSEHAT).</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>5 soal · satu per satu</span></div><h2>Kuis singkat</h2><div class=\"sim sim-quizset\" data-sim=\"quizset\" data-cfg=\"{&quot;id&quot;:&quot;td5-kuis&quot;,&quot;items&quot;:[{&quot;q&quot;:&quot;Toko roti rumahan membuat roti sendiri dan menjualnya lewat Instagram. Model bisnisnya lebih dekat ke…&quot;,&quot;o&quot;:[&quot;platform&quot;,&quot;pipeline&quot;,&quot;ekosistem&quot;,&quot;multi-sided platform&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Toko membuat produknya sendiri lalu menjualnya; Instagram hanya saluran (Channels).&quot;},{&quot;q&quot;:&quot;Ciri utama multi-sided platform menurut Osterwalder &amp;amp; Pigneur (2010) adalah…&quot;,&quot;o&quot;:[&quot;memiliki pabrik dan gudang sendiri&quot;,&quot;mempertemukan kelompok pelanggan yang berbeda tetapi saling bergantung&quot;,&quot;menjual produk dengan harga paling murah&quot;,&quot;hanya melayani satu segmen pelanggan&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Platform menciptakan nilai dengan memfasilitasi interaksi antarkelompok yang saling bergantung.&quot;},{&quot;q&quot;:&quot;Makin banyak pengemudi bergabung, penumpang makin cepat mendapat kendaraan. Ini contoh…&quot;,&quot;o&quot;:[&quot;efek jaringan langsung&quot;,&quot;efek jaringan tidak langsung&quot;,&quot;cold start&quot;,&quot;winner-takes-all&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Bertambahnya satu kelompok (pengemudi) menambah nilai bagi kelompok lain (penumpang).&quot;},{&quot;q&quot;:&quot;Pasar daring desa baru dibuka: penjual menunggu pembeli, pembeli menunggu penjual. Langkah awal yang paling masuk akal…&quot;,&quot;o&quot;:[&quot;menunggu sampai kedua sisi datang sendiri&quot;,&quot;menarik komisi tinggi agar cepat balik modal&quot;,&quot;mengisi satu sisi lebih dulu, mis. mengajak petani yang sudah dikenal&quot;,&quot;menutup platform karena tidak ada peminat&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;Masalah cold start diatasi dengan memulai dari satu sisi, sering dengan bantuan komunitas yang sudah ada.&quot;},{&quot;q&quot;:&quot;Menurut Ross et al. (2019), \\&quot;digital platform\\&quot; berarti…&quot;,&quot;o&quot;:[&quot;aplikasi yang mempertemukan penjual dan pembeli&quot;,&quot;komponen bisnis, data, dan infrastruktur yang dapat dipakai ulang untuk membangun layanan baru&quot;,&quot;media sosial milik organisasi&quot;,&quot;marketplace milik pemerintah&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Istilahnya mirip, tetapi digital platform menurut Ross adalah komponen internal yang dipakai ulang, berbeda dari model bisnis platform.&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit</span></div><h2>Tugas 1 bagian kedua: BMC mitra</h2><div class=\"cols w\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Business Model Canvas organisasi mitra (10%)</h3><ul><li>Rapikan BMC satu halaman (sembilan blok) berdasarkan workshop dan masukan sejawat.</li><li>Tandai isi yang berbasis teknologi digital; tulis satu paragraf <b>proposisi nilai digital</b>.</li><li>Tulis satu paragraf <b>analisis pipeline atau platform</b> dengan bukti dari blok BMC, termasuk platform pihak lain yang dipakai mitra.</li></ul><p class=\"muted\" style=\"font-size:.85em\">Tenggat: <b>[PERLU DIISI]</b> (tidak tercantum di RPS).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Persiapan Pertemuan 6</h3><p>Baca bagian tentang transformasi proses operasional dalam Westerman et al. (2014). Catat satu proses utama mitra Anda (mis. pemesanan, pendaftaran, layanan surat): siapa terlibat, langkahnya, dan di mana sering terjadi masalah.</p></div></div><p class=\"muted\" style=\"margin-top:.7em\">Lembar tugas dan rubrik dibagikan terpisah. Ditulis dalam bahasa Indonesia; pemakaian AI disebutkan.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Pipeline business</span></dt><dd>Model bisnis linear: organisasi membuat atau menyediakan produk lalu menjualnya; nilai mengalir satu arah. <i>(bisnis linear / pipa)</i></dd></div><div><dt><span class=\"en\">Platform business model</span></dt><dd>Model bisnis yang menciptakan nilai dengan memfasilitasi interaksi antara dua atau lebih kelompok pengguna. <i>(model bisnis platform)</i></dd></div><div><dt><span class=\"en\">Multi-sided platform</span></dt><dd>Platform yang mempertemukan dua atau lebih kelompok pelanggan yang berbeda tetapi saling bergantung. <i>(platform multisisi)</i></dd></div><div><dt><span class=\"en\">Network effect</span></dt><dd>Keadaan ketika nilai sebuah layanan bagi penggunanya bertambah seiring bertambahnya jumlah pengguna. <i>(efek jaringan)</i></dd></div><div><dt><span class=\"en\">Direct network effect</span></dt><dd>Efek jaringan di dalam kelompok pengguna yang sama, mis. pengguna aplikasi pesan. <i>(efek jaringan langsung)</i></dd></div><div><dt><span class=\"en\">Indirect network effect</span></dt><dd>Efek jaringan antarkelompok, mis. makin banyak pengemudi menambah nilai bagi penumpang. <i>(efek jaringan tidak langsung)</i></dd></div><div><dt><span class=\"en\">Cold start (chicken-and-egg problem)</span></dt><dd>Kesulitan awal platform: penjual menunggu pembeli, pembeli menunggu penjual. <i>(masalah ayam dan telur)</i></dd></div><div><dt><span class=\"en\">Winner-takes-all</span></dt><dd>Kecenderungan pasar platform dikuasai satu atau sedikit pemain karena efek jaringan yang kuat. <i>(pemenang menguasai pasar)</i></dd></div><div><dt><span class=\"en\">Digital ecosystem</span></dt><dd>Jaringan organisasi, mitra, dan pengguna yang terhubung lewat platform dan bersama-sama menciptakan nilai. <i>(ekosistem digital)</i></dd></div><div><dt><span class=\"en\">Commission</span></dt><dd>Potongan yang diambil platform dari setiap transaksi antarpengguna. <i>(komisi / potongan transaksi)</i></dd></div><div><dt><span class=\"en\">Digital platform</span></dt><dd>Kumpulan komponen bisnis, data, dan infrastruktur yang dapat dipakai ulang untuk cepat membangun layanan digital baru. <i>(platform digital)</i></dd></div><div><dt><span class=\"en\">External developer platform</span></dt><dd>Kumpulan komponen digital organisasi yang dibuka untuk dipakai pihak luar (mitra, pengembang) membangun layanan. <i>(platform pengembang eksternal)</i></dd></div><div><dt><span class=\"en\">Customer Segments</span></dt><dd>Kelompok orang atau organisasi yang ingin dijangkau dan dilayani organisasi. <i>(segmen pelanggan)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\" style=\"font-size:.74em;gap:.3em\"><li>Direktorat Jenderal Pelayanan Kesehatan. (2023, 4 Mei). <i>Surat Edaran Nomor HK.02.02/D/7093/2023 tentang Penyelenggaraan Rekam Medis Elektronik yang Terinteroperabilitas dengan Platform SATUSEHAT</i>. Kementerian Kesehatan Republik Indonesia.</li><li>Google, Temasek, &amp; Bain &amp; Company. (2024). <i>e-Conomy SEA 2024</i>. https://economysea.withgoogle.com/</li><li>Liputan6.com. (2022, 15 Desember). <i>Profil PT Gojek Indonesia, sejarah, alamat kantor, dan produk layanannya</i>. https://www.liputan6.com/hot/read/5154461/</li><li>Osterwalder, A., &amp; Pigneur, Y. (2010). <i>Business model generation: A handbook for visionaries, game changers, and challengers</i>. John Wiley &amp; Sons.</li
