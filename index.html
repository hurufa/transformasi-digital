ass=\"t\"><thead><tr><th>Aspek</th><th>Temuan kelompok</th></tr></thead><tbody><tr><td>Organisasi &amp; inisiatif</td><td>…</td></tr><tr><td>Tahap + alasan</td><td>…</td></tr><tr><td>Pendorong</td><td>…</td></tr><tr><td>Hambatan</td><td>…</td></tr></tbody></table><p class=\"muted\" style=\"font-size:.85em;margin-top:.4em\">Salin tabel ini di kertas atau dokumen kelompok.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>Digitization</b> mengubah data, <b>digitalization</b> mengubah proses, <b>digital transformation</b> mengubah organisasi dan model bisnis.</li><li>Transformasi digital adalah perubahan signifikan yang dipicu <b>kombinasi</b> teknologi, bukan satu aplikasi.</li><li>Pendorongnya lima domain: <b>customers, competition, data, innovation, value</b>.</li><li>Hambatan utama: <b>inersia dan resistensi</b>, ditambah sistem warisan, talenta, visi, sumber daya.</li><li>Indonesia sudah sangat terhubung; tantangannya adalah <b>organisasi</b> yang ikut berubah.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"a\" data-why=\"Hanya bentuk informasinya yang berubah dari analog ke digital; proses dan layanan belum berubah.\"><p class=\"q\">Pesantren memindai rapor kertas santri menjadi PDF. Ini termasuk…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. digitization</button><button type=\"button\" data-o=\"b\">B. digitalization</button><button type=\"button\" data-o=\"c\">C. digital transformation</button><button type=\"button\" data-o=\"d\">D. disruption</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"Lima domain Rogers: Customers, Competition, Data, Innovation, Value.\"><p class=\"q\">Manakah yang BUKAN domain transformasi digital menurut Rogers (2016)?</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Customers</button><button type=\"button\" data-o=\"b\">B. Competition</button><button type=\"button\" data-o=\"c\">C. Hardware</button><button type=\"button\" data-o=\"d\">D. Value</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Vial (2019) menyoroti inersia organisasi dan resistensi dari pegawai.\"><p class=\"q\">Dua penghambat utama transformasi digital menurut Vial (2019) adalah…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. biaya dan waktu</button><button type=\"button\" data-o=\"b\">B. inersia dan resistensi</button><button type=\"button\" data-o=\"c\">C. regulasi dan pajak</button><button type=\"button\" data-o=\"d\">D. internet dan listrik</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit</span></div><h2>Tugas mandiri</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bab pengantar Rogers (2016), <i>The Digital Transformation Playbook</i>, tentang lima domain; atau bab pengantar Rogers (2023), <i>The Digital Transformation Roadmap</i>.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Menulis ringkasan kasus</h3><p>Pilih <b>satu kasus transformasi digital di Indonesia</b> (selain Gojek dan SATUSEHAT) dari sumber tepercaya. Tulis ringkasan 300–400 kata dalam bahasa Indonesia: apa yang berubah, termasuk tahap apa, pendorong (lima domain), hambatan, dan pelajaran untuk organisasi lain. Cantumkan sumber (APA 7).</p></div></div><div class=\"callout\" style=\"margin-top:.8em\">Mulai pikirkan calon <b>organisasi mitra</b>. Kelompok dan mitra dibentuk di Pertemuan 2.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Digitization</span></dt><dd>Mengubah informasi analog (kertas, suara, gambar fisik) menjadi format digital tanpa mengubah cara kerja. <i>(digitisasi)</i></dd></div><div><dt><span class=\"en\">Digitalization</span></dt><dd>Memakai teknologi digital untuk mengubah atau mengotomasi proses bisnis yang sudah ada. <i>(digitalisasi)</i></dd></div><div><dt><span class=\"en\">Digital transformation</span></dt><dd>Perubahan menyeluruh pada organisasi, termasuk model bisnis, proses, dan budaya, yang dipicu kombinasi teknologi digital untuk menciptakan nilai baru. <i>(transformasi digital)</i></dd></div><div><dt><span class=\"en\">Digital technology</span></dt><dd>Kombinasi teknologi informasi, komputasi, komunikasi, dan konektivitas, misalnya cloud, data, AI, IoT, dan mobile. <i>(teknologi digital)</i></dd></div><div><dt><span class=\"en\">Business model</span></dt><dd>Cara organisasi menciptakan, menyampaikan, dan menangkap nilai. <i>(model bisnis)</i></dd></div><div><dt><span class=\"en\">Value proposition</span></dt><dd>Manfaat yang ditawarkan organisasi kepada pelanggan atau pengguna layanannya. <i>(proposisi nilai)</i></dd></div><div><dt><span class=\"en\">Customer network</span></dt><dd>Pelanggan sebagai jaringan yang aktif saling terhubung, memberi ulasan, dan memengaruhi satu sama lain. <i>(jaringan pelanggan)</i></dd></div><div><dt><span class=\"en\">Disruption</span></dt><dd>Perubahan pasar ketika pendatang baru dengan model bisnis berbeda menggeser pemain lama. <i>(disrupsi)</i></dd></div><div><dt><span class=\"en\">Legacy system</span></dt><dd>Sistem lama yang masih dipakai tetapi sulit diubah atau diintegrasikan dengan teknologi baru. <i>(sistem warisan)</i></dd></div><div><dt><span class=\"en\">Inertia</span></dt><dd>Kecenderungan organisasi mempertahankan cara kerja, struktur, dan sumber daya yang sudah ada. <i>(inersia / kelembaman organisasi)</i></dd></div><div><dt><span class=\"en\">Digital economy</span></dt><dd>Kegiatan ekonomi yang berlangsung melalui atau bergantung pada teknologi digital, misalnya e-commerce dan pembayaran digital. <i>(ekonomi digital)</i></dd></div><div><dt><span class=\"en\">Gross merchandise value (GMV)</span></dt><dd>Total nilai transaksi barang/jasa yang terjadi melalui platform digital dalam periode tertentu. <i>(nilai transaksi bruto)</i></dd></div><div><dt><span class=\"en\">Super app</span></dt><dd>Satu aplikasi yang menggabungkan banyak layanan, misalnya transportasi, pesan-antar makanan, dan pembayaran. <i>(aplikasi super)</i></dd></div><div><dt><span class=\"en\">Stakeholder</span></dt><dd>Orang, kelompok, atau organisasi yang memengaruhi atau dipengaruhi oleh sebuah inisiatif. <i>(pemangku kepentingan)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\" style=\"font-size:.74em;gap:.3em\"><li>Asosiasi Penyelenggara Jasa Internet Indonesia. (2024, 7 Februari). <i>APJII: Jumlah pengguna internet Indonesia tembus 221 juta orang</i>. https://apjii.or.id/berita/d/apjii-jumlah-pengguna-internet-indonesia-tembus-221-juta-orang</li><li>Antara. (2023, 28 Februari). <i>Kemenkes: PeduliLindungi bertransformasi jadi SatuSehat mulai besok</i>. https://www.antaranews.com/berita/3417786/</li><li>Google, Temasek, &amp; Bain &amp; Company. (2024). <i>e-Conomy SEA 2024</i>. https://economysea.withgoogle.com/</li><li>Liputan6.com. (2022, 15 Desember). <i>Profil PT Gojek Indonesia, sejarah, alamat kantor, dan produk layanannya</i>. https://www.liputan6.com/hot/read/5154461/</li><li>Peraturan Presiden Republik Indonesia Nomor 82 Tahun 2023 tentang Percepatan Transformasi Digital dan Keterpaduan Layanan Digital Nasional.</li><li>Rogers, D. L. (2016). <i>The digital transformation playbook: Rethink your business for the digital age</i>. Columbia Business School Publishing.</li><li>Rogers, D. L. (2023). <i>The digital transformation roadmap: Rebuild your organization for continuous change</i>. Columbia Business School Publishing.</li><li>Verhoef, P. C., Broekhuizen, T., Bart, Y., Bhattacharya, A., Dong, J. Q., Fabian, N., &amp; Haenlein, M. (2021). Digital transformation: A multidisciplinary reflection and research agenda. <i>Journal of Business Research, 122</i>, 889–901. https://doi.org/10.1016/j.jbusres.2019.09.022</li><li>Vial, G. (2019). Understanding digital transformation: A review and a research agenda. <i>The Journal of Strategic Information Systems, 28</i>(2), 118–144. https://doi.org/10.1016/j.jsis.2019.01.003</li><li>Westerman, G., Bonnet, D., &amp; McAfee, A. (2014). <i>Leading digital: Turning technology into business transformation</i>. Harvard Business Review Press.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 2.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":2,"title":"Teknologi Pendorong (1)","subtitle":"Cloud computing, big data dan analitik, AI dan generative AI","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 2</span><span>Transformasi Digital · SI24W15</span></div><h1>Teknologi Pendorong (1)</h1><p class=\"lead\">Cloud computing, big data dan analitik, AI dan generative AI</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 2–3 · Sub-CPMK-2</div><div><b>Hari ini</b>Konsep + bentuk kelompok &amp; pilih mitra</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-2 · Pertemuan 2–3</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menjelaskan peran teknologi pendorong (cloud, data, AI, IoT, mobile) dalam transformasi digital (C2).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1 dan 2 untuk cloud, data, dan AI; indikator 3 dimulai)</span></h3><ol><li>Ketepatan menjelaskan karakteristik setiap teknologi pendorong.</li><li>Ketepatan mengaitkan teknologi dengan nilai bisnis yang dihasilkan.</li><li>Ketepatan mengidentifikasi teknologi yang dipakai organisasi mitra. <span class=\"muted\">(dimulai hari ini, dilanjutkan Pertemuan 3)</span></li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menjelaskan konsep transformasi digital, teknologi pendorongnya, dan model bisnis digital.</dd><dt>CPL-3</dt><dd class=\"id\">Menguasai konsep teoritis Sistem Informasi, Ilmu Komputer, dan Bisnis Digital secara umum serta konsep khusus secara mendalam untuk memformulasikan solusi prosedural.</dd><dt>Waktu</dt><dd>Tatap muka 2×50 menit · Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Produk (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 2–3</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 1 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Apa beda digitization, digitalization, dan digital transformation?</li><li>Sebutkan lima domain transformasi digital menurut Rogers.</li><li>Mengapa membeli aplikasi mahal belum tentu berarti transformasi digital?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Kerangka</span><span>Indikator 2</span></div><h2>Teknologi menciptakan nilai di tiga area</h2><figure class=\"fig\"><svg viewBox=\"0 0 860 250\" role=\"img\" aria-label=\"Teknologi digital seperti cloud, data dan analitik, AI, IoT, mobile, dan API di kiri, dihubungkan panah ke tiga area penciptaan nilai di kanan: customer experience, operational processes, dan business models.\"><defs><marker id=\"dv\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><text x=\"20\" y=\"22\" class=\"s-hd\">TEKNOLOGI DIGITAL</text><rect x=\"20\" y=\"32\" width=\"220\" height=\"29\" rx=\"8\" class=\"s-acc\"/><text x=\"130\" y=\"51\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Cloud</text><rect x=\"20\" y=\"67\" width=\"220\" height=\"29\" rx=\"8\" class=\"s-acc\"/><text x=\"130\" y=\"86\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Data &amp; analitik</text><rect x=\"20\" y=\"102\" width=\"220\" height=\"29\" rx=\"8\" class=\"s-acc\"/><text x=\"130\" y=\"121\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">AI / GenAI</text><rect x=\"20\" y=\"137\" width=\"220\" height=\"29\" rx=\"8\" class=\"s-box\"/><text x=\"130\" y=\"156\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">IoT</text><rect x=\"20\" y=\"172\" width=\"220\" height=\"29\" rx=\"8\" class=\"s-box\"/><text x=\"130\" y=\"191\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Mobile &amp; sosial</text><rect x=\"20\" y=\"207\" width=\"220\" height=\"29\" rx=\"8\" class=\"s-box\"/><text x=\"130\" y=\"226\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">API &amp; platform</text><line x1=\"250\" y1=\"130\" x2=\"440\" y2=\"130\" class=\"s-line\" marker-end=\"url(#dv)\"/><text x=\"345\" y=\"120\" text-anchor=\"middle\" class=\"s-s\">dipakai untuk mengubah…</text><text x=\"460\" y=\"22\" class=\"s-hd\">AREA PENCIPTAAN NILAI</text><rect x=\"460\" y=\"34\" width=\"380\" height=\"58\" rx=\"12\" class=\"s-soft\"/><text x=\"650\" y=\"58\" text-anchor=\"middle\" class=\"s-t\">Customer experience</text><text x=\"650\" y=\"78\" text-anchor=\"middle\" class=\"s-s\">cara melayani &amp; memahami pelanggan</text><rect x=\"460\" y=\"104\" width=\"380\" height=\"58\" rx=\"12\" class=\"s-soft\"/><text x=\"650\" y=\"128\" text-anchor=\"middle\" class=\"s-t\">Operational processes</text><text x=\"650\" y=\"148\" text-anchor=\"middle\" class=\"s-s\">cara bekerja di dalam organisasi</text><rect x=\"460\" y=\"174\" width=\"380\" height=\"58\" rx=\"12\" class=\"s-soft\"/><text x=\"650\" y=\"198\" text-anchor=\"middle\" class=\"s-t\">Business models</text><text x=\"650\" y=\"218\" text-anchor=\"middle\" class=\"s-s\">cara menciptakan &amp; menangkap nilai</text></svg><figcaption>Tiga area tempat teknologi digital menciptakan nilai, diadaptasi dari Westerman et al. (2014). Kotak kuning: dibahas hari ini; lainnya di Pertemuan 3.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknologi 1</span><span>Cloud computing · indikator 1</span></div><h2>Apa itu <button type=\"button\" class=\"term\" data-term=\"cloud-computing\">cloud computing</button>?</h2><div style=\"font-size:.88em\"><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"Cloud computing is a model for enabling ubiquitous, convenient, on-demand network access to a shared pool of configurable computing resources (e.g., networks, servers, storage, applications, and services) that can be rapidly provisioned and released with minimal management effort or service provider interaction.\"</p><p class=\"tr\">\"Komputasi awan adalah sebuah model untuk memungkinkan akses jaringan yang ada di mana-mana, nyaman, dan sesuai permintaan ke sebuah kumpulan bersama sumber daya komputasi yang dapat dikonfigurasi (mis., jaringan, server, penyimpanan, aplikasi, dan layanan) yang dapat disediakan dan dilepaskan dengan cepat dengan upaya pengelolaan atau interaksi penyedia layanan yang minimal.\"</p><div class=\"src\">Mell &amp; Grance (2011); terjemahan harfiah penyusun</div></blockquote></div><figure class=\"fig\"><svg viewBox=\"0 0 880 250\" style=\"max-height:10.5em\" role=\"img\" aria-label=\"Definisi cloud computing NIST: lima karakteristik esensial (on-demand self-service, broad network access, resource pooling, rapid elasticity, measured service), tiga model layanan (SaaS, PaaS, IaaS), dan empat model penerapan (private, community, public, hybrid).\"><text x=\"10\" y=\"20\" class=\"s-hd\">5 ESSENTIAL CHARACTERISTICS</text><rect x=\"10\" y=\"30\" width=\"166\" height=\"44\" rx=\"8\" class=\"s-acc\"/><text x=\"93\" y=\"57\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">On-demand self-service</text><rect x=\"184\" y=\"30\" width=\"166\" height=\"44\" rx=\"8\" class=\"s-acc\"/><text x=\"267\" y=\"57\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Broad network access</text><rect x=\"358\" y=\"30\" width=\"166\" height=\"44\" rx=\"8\" class=\"s-acc\"/><text x=\"441\" y=\"57\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Resource pooling</text><rect x=\"532\" y=\"30\" width=\"166\" height=\"44\" rx=\"8\" class=\"s-acc\"/><text x=\"615\" y=\"57\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Rapid elasticity</text><rect x=\"706\" y=\"30\" width=\"166\" height=\"44\" rx=\"8\" class=\"s-acc\"/><text x=\"789\" y=\"57\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Measured service</text><text x=\"10\" y=\"108\" class=\"s-hd\">3 SERVICE MODELS</text><rect x=\"10\" y=\"118\" width=\"280\" height=\"50\" rx=\"8\" class=\"s-soft\"/><text x=\"150\" y=\"140\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">SaaS</text><text x=\"150\" y=\"159\" text-anchor=\"middle\" class=\"s-s\">aplikasi siap pakai</text><rect x=\"302\" y=\"118\" width=\"280\" height=\"50\" rx=\"8\" class=\"s-soft\"/><text x=\"442\" y=\"140\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">PaaS</text><text x=\"442\" y=\"159\" text-anchor=\"middle\" class=\"s-s\">platform untuk membangun aplikasi</text><rect x=\"594\" y=\"118\" width=\"280\" height=\"50\" rx=\"8\" class=\"s-soft\"/><text x=\"734\" y=\"140\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">IaaS</text><text x=\"734\" y=\"159\" text-anchor=\"middle\" class=\"s-s\">server, penyimpanan, jaringan</text><text x=\"10\" y=\"200\" class=\"s-hd\">4 DEPLOYMENT MODELS</text><rect x=\"10\" y=\"208\" width=\"210\" height=\"36\" rx=\"18\" class=\"s-box\"/><text x=\"115\" y=\"231\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Private cloud</text><rect x=\"228\" y=\"208\" width=\"210\" height=\"36\" rx=\"18\" class=\"s-box\"/><text x=\"333\" y=\"231\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Community cloud</text><rect x=\"446\" y=\"208\" width=\"210\" height=\"36\" rx=\"18\" class=\"s-box\"/><text x=\"551\" y=\"231\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Public cloud</text><rect x=\"664\" y=\"208\" width=\"210\" height=\"36\" rx=\"18\" class=\"s-box\"/><text x=\"769\" y=\"231\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Hybrid cloud</text></svg><figcaption>Struktur definisi cloud computing menurut NIST SP 800-145 (Mell &amp; Grance, 2011). Nama karakteristik dan model ditulis sesuai sumber; keterangan singkat oleh dosen.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknologi 1</span><span>Cloud computing · indikator 1–2</span></div><h2>Siapa mengelola apa?</h2><div class=\"cols w\"><div class=\"tw\"><table class=\"t\"><thead><tr><th>Model</th><th>Yang dikelola pengguna</th><th>Contoh di sekitar kita</th></tr></thead><tbody><tr><td><b><button type=\"button\" class=\"term\" data-term=\"saas\">SaaS</button></b></td><td>data dan pengaturan akun</td><td>email dan dokumen kampus di Google Workspace atau Microsoft 365; aplikasi kasir langganan untuk UMKM</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"paas\">PaaS</button></b></td><td>aplikasi dan data</td><td>tim kampus menjalankan aplikasi web di layanan hosting aplikasi tanpa mengurus server</td></tr><tr><td><b><button type=\"button\" class=\"term\" data-term=\"iaas\">IaaS</button></b></td><td>sistem operasi, aplikasi, data</td><td>instansi menyewa server virtual untuk memindahkan aplikasi dari ruang server sendiri</td></tr></tbody></table></div><div><div class=\"card ok\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Nilai</h3><p>Mulai cepat tanpa beli server, biaya sesuai pemakaian, kapasitas mengikuti beban (<button type=\"button\" class=\"term\" data-term=\"elasticity\">elasticity</button>).</p></div><div class=\"card warn\" style=\"margin-top:.6em\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Risiko</h3><p>Ketergantungan internet, <button type=\"button\" class=\"term\" data-term=\"vendor-lock-in\">vendor lock-in</button>, lokasi dan keamanan data, biaya membengkak bila tak dipantau.</p></div></div></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Pembagian tanggung jawab dirangkum dari definisi model layanan NIST (Mell &amp; Grance, 2011). Contoh adalah ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknologi 2</span><span>Big data · indikator 1</span></div><h2><button type=\"button\" class=\"term\" data-term=\"big-data\">Big data</button>: tiga V</h2><div class=\"grid3\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Volume</h3><p>Jumlah data sangat besar.</p><p class=\"muted\" style=\"font-size:.9em\">Seluruh transaksi harian sebuah marketplace.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Velocity</h3><p>Data datang sangat cepat, sering terus-menerus.</p><p class=\"muted\" style=\"font-size:.9em\">Klik, pembayaran QRIS, dan lokasi pengemudi setiap detik.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20\"/></svg>Variety</h3><p>Jenis data beragam: tabel, teks, gambar, suara, video.</p><p class=\"muted\" style=\"font-size:.9em\">Ulasan pelanggan, foto produk, rekaman layanan.</p></div></div><p style=\"margin-top:.8em\">Tiga dimensi ini dikemukakan Laney <span class=\"cite\">(2001)</span>. Literatur kemudian menambahkan V lain (mis. <i>veracity</i>, <i>value</i>).</p><div class=\"callout\" style=\"margin-top:.6em\">Data bernilai bukan karena banyak, tetapi karena <b>dipakai untuk keputusan</b>.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknologi 2</span><span>Analitik · indikator 1–2</span></div><h2>Dari data ke keputusan: tiga jenis <button type=\"button\" class=\"term\" data-term=\"analytics\">analitik</button></h2><figure class=\"fig\"><svg viewBox=\"0 0 860 200\" role=\"img\" aria-label=\"Alur dari data mentah ke keputusan. Analitik deskriptif menjawab apa yang terjadi, analitik prediktif menjawab apa yang akan terjadi, analitik preskriptif menjawab apa yang sebaiknya dilakukan. Semakin ke kanan nilai untuk keputusan makin tinggi.\"><defs><marker id=\"dd\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"50\" width=\"130\" height=\"80\" rx=\"12\" class=\"s-box\"/><text x=\"75\" y=\"85\" text-anchor=\"middle\" class=\"s-t\">Data</text><text x=\"75\" y=\"106\" text-anchor=\"middle\" class=\"s-s\">transaksi, log, sensor</text><rect x=\"180\" y=\"50\" width=\"180\" height=\"80\" rx=\"12\" class=\"s-soft\"/><text x=\"270\" y=\"84\" text-anchor=\"middle\" class=\"s-t\">Descriptive</text><text x=\"270\" y=\"106\" text-anchor=\"middle\" class=\"s-s\">Apa yang terjadi?</text><rect x=\"380\" y=\"50\" width=\"180\" height=\"80\" rx=\"12\" class=\"s-soft\"/><text x=\"470\" y=\"84\" text-anchor=\"middle\" class=\"s-t\">Predictive</text><text x=\"470\" y=\"106\" text-anchor=\"middle\" class=\"s-s\">Apa yang akan terjadi?</text><rect x=\"580\" y=\"50\" width=\"180\" height=\"80\" rx=\"12\" class=\"s-acc\"/><text x=\"670\" y=\"84\" text-anchor=\"middle\" class=\"s-t\">Prescriptive</text><text x=\"670\" y=\"106\" text-anchor=\"middle\" class=\"s-s\">Apa yang sebaiknya dilakukan?</text><line x1=\"142\" y1=\"90\" x2=\"176\" y2=\"90\" class=\"s-line\" marker-end=\"url(#dd)\"/><line x1=\"362\" y1=\"90\" x2=\"376\" y2=\"90\" class=\"s-line\" marker-end=\"url(#dd)\"/><line x1=\"562\" y1=\"90\" x2=\"576\" y2=\"90\" class=\"s-line\" marker-end=\"url(#dd)\"/><line x1=\"180\" y1=\"160\" x2=\"760\" y2=\"160\" class=\"s-line\" marker-end=\"url(#dd)\"/><text x=\"470\" y=\"185\" text-anchor=\"middle\" class=\"s-s\">makin ke kanan: makin dekat ke keputusan, makin butuh data dan model yang baik</text></svg><figcaption>Tiga jenis analitik, diadaptasi dari Sharda et al. (2020). Nama jenis ditulis sesuai sumber.</figcaption></figure><div class=\"grid3\" style=\"margin-top:.5em\"><div class=\"card\"><p><b>Descriptive</b>: dashboard jumlah santri baru per kabupaten.</p></div><div class=\"card\"><p><b>Predictive</b>: perkiraan jumlah pendaftar tahun depan.</p></div><div class=\"card hl\"><p><b>Prescriptive</b>: rekomendasi wilayah dan waktu promosi terbaik.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknologi 3</span><span>Kecerdasan artifisial · indikator 1</span></div><h2>Apa itu <button type=\"button\" class=\"term\" data-term=\"ai\">AI</button>?</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"An AI system is a machine-based system that, for explicit or implicit objectives, infers, from the input it receives, how to generate outputs such as predictions, content, recommendations, or decisions that can influence physical or virtual environments. Different AI systems vary in their levels of autonomy and adaptiveness after deployment.\"</p><p class=\"tr\">\"Sebuah sistem AI adalah sebuah sistem berbasis mesin yang, untuk tujuan-tujuan eksplisit atau implisit, menyimpulkan, dari masukan yang diterimanya, bagaimana menghasilkan keluaran-keluaran seperti prediksi, konten, rekomendasi, atau keputusan yang dapat memengaruhi lingkungan fisik atau virtual. Sistem-sistem AI yang berbeda bervariasi dalam tingkat otonomi dan kemampuan adaptasinya setelah diterapkan.\"</p><div class=\"src\">OECD (2024); terjemahan harfiah penyusun</div></blockquote></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Empat jenis keluaran</h3><ul><li><b>Prediksi</b>: risiko mahasiswa putus kuliah</li><li><b>Konten</b>: draf balasan layanan pelanggan</li><li><b>Rekomendasi</b>: produk untuk pembeli</li><li><b>Keputusan</b>: persetujuan pinjaman otomatis</li></ul><p class=\"muted\" style=\"font-size:.85em\">Contoh ilustrasi.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknologi 3</span><span>Generative AI · indikator 1–2</span></div><h2><button type=\"button\" class=\"term\" data-term=\"generative-ai\">Generative AI</button>: peluang dan kehati-hatian</h2><div class=\"cols\"><div class=\"card ok\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Peluang nilai</h3><ul><li><b>Customer experience</b>: menjawab pertanyaan pendaftar 24 jam</li><li><b>Operational processes</b>: merangkum notulen, menyusun draf surat, membantu menulis kode</li><li><b>Business models</b>: layanan baru berbasis konten yang dipersonalisasi</li></ul></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Kehati-hatian</h3><ul><li><button type=\"button\" class=\"term\" data-term=\"hallucination\">Halusinasi</button>: jawaban meyakinkan tetapi salah</li><li>Data pribadi atau rahasia ikut terunggah ke layanan pihak ketiga</li><li>Hak cipta dan kejujuran akademik</li><li>Tetap butuh manusia yang memeriksa</li></ul></div></div><p class=\"muted\" style=\"margin-top:.6em;font-size:.85em\">Definisi kerja mata kuliah ini; pengelompokan peluang mengikuti tiga area Westerman et al. (2014).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Dari teknologi ke kapabilitas</span><span>Indikator 2</span></div><h2>Dua fondasi organisasi digital <span class=\"cite\">(Ross et al., 2019)</span></h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg><button type=\"button\" class=\"term\" data-term=\"operational-backbone\">Operational backbone</button></h3><p>Sistem inti, data, dan proses terintegrasi yang membuat operasi harian <b>andal dan efisien</b>.</p><p class=\"muted\" style=\"font-size:.9em\">Contoh: SIAKAD, keuangan, dan data mahasiswa kampus yang sudah terintegrasi dan bersih.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg><button type=\"button\" class=\"term\" data-term=\"digital-platform\">Digital platform</button></h3><p>Komponen bisnis, data, dan infrastruktur yang <b>dapat dipakai ulang</b> untuk cepat membangun layanan digital baru.</p><p class=\"muted\" style=\"font-size:.9em\">Contoh: layanan login tunggal dan data mahasiswa yang bisa dipakai aplikasi presensi, e-learning, dan layanan surat.</p></div></div><div class=\"callout\" style=\"margin-top:.8em\">Cloud, data, dan AI baru memberi nilai berkelanjutan bila tersusun menjadi fondasi ini, bukan aplikasi yang berdiri sendiri-sendiri.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Latihan</span><span>Kelompok kecil · 12 menit · kasus ilustrasi</span></div><h2>Teknologi apa, untuk nilai apa?</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Kasus</th><th>Teknologi (cloud / data / AI)</th><th>Area nilai</th><th>Nilai yang dihasilkan</th></tr></thead><tbody><tr><td><b>A.</b> UMKM batik tulis di Sidoarjo ingin tahu motif mana yang paling laku per musim.</td><td>…</td><td>…</td><td>…</td></tr><tr><td><b>B.</b> Dinas perizinan kabupaten kewalahan menjawab pertanyaan berulang soal syarat izin usaha.</td><td>…</td><td>…</td><td>…</td></tr><tr><td><b>C.</b> Pesantren dengan tiga cabang ingin data santri dan keuangan terpusat tanpa membeli server.</td><td>…</td><td>…</td><td>…</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Kasus ilustrasi. Satu kasus boleh memakai lebih dari satu teknologi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Pembentukan kelompok · 15 menit</span></div><h2>Bentuk kelompok, pilih organisasi mitra</h2><div class=\"cols\"><div><p><b>Kelompok</b>: 4–5 orang. Tetapkan peran awal:</p><ul><li>Koordinator kelompok</li><li>Penghubung mitra</li><li>Analis teknologi dan proses</li><li>Penanggung jawab dokumen dan sumber</li></ul><p class=\"muted\">Peran boleh dirotasi, tetapi harus tercatat.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Kriteria mitra yang baik</h3><ul><li>Organisasi nyata: UMKM, instansi pemerintah, perguruan tinggi, atau pesantren/lembaga NU.</li><li>Sudah atau sedang memakai teknologi digital, sekecil apa pun.</li><li>Bersedia diwawancarai 3–4 kali selama semester.</li><li>Ada narahubung yang bisa memberi informasi proses dan data.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Tugas 1</span><span>30% · Pertemuan 2–7</span></div><h2>Analisis kondisi digital organisasi mitra</h2><div class=\"grid3\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>P2–3 · 10%</h3><p>Pemetaan teknologi digital yang dipakai mitra dan nilai yang dihasilkannya.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>P4–5 · 10%</h3><p>Business Model Canvas mitra dan proposisi nilai digitalnya.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>P6–7 · 10%</h3><p>Analisis proses (as-is dan to-be) dan customer journey, dipresentasikan di Pertemuan 7.</p></div></div><div class=\"callout\" style=\"margin-top:1em\">Lembar tugas dan rubrik lengkap dibagikan terpisah di grup kelas. Tugas 2 memakai organisasi yang <b>sama</b>.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Teknologi bernilai bila mengubah <b>customer experience, operational processes, atau business models</b>.</li><li><b>Cloud</b> (NIST): 5 karakteristik, 3 model layanan (SaaS, PaaS, IaaS), 4 model penerapan.</li><li><b>Big data</b>: volume, velocity, variety; <b>analitik</b>: deskriptif, prediktif, preskriptif.</li><li><b>AI</b> menyimpulkan dari data untuk menghasilkan prediksi, konten, rekomendasi, atau keputusan; AI generatif butuh pemeriksaan manusia.</li><li>Teknologi perlu disusun menjadi <b>operational backbone</b> dan <b>digital platform</b>.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"c\" data-why=\"Prodi memakai aplikasi siap pakai milik penyedia; yang dikelola hanya akun dan data.\"><p class=\"q\">Prodi memakai Google Workspace untuk email dan dokumen. Model layanannya…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. IaaS</button><button type=\"button\" data-o=\"b\">B. PaaS</button><button type=\"button\" data-o=\"c\">C. SaaS</button><button type=\"button\" data-o=\"d\">D. Private cloud</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Analitik prediktif menjawab apa yang kemungkinan akan terjadi.\"><p class=\"q\">\"Berapa perkiraan pendaftar santri tahun depan?\" dijawab dengan analitik…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. deskriptif</button><button type=\"button\" data-o=\"b\">B. prediktif</button><button type=\"button\" data-o=\"c\">C. preskriptif</button><button type=\"button\" data-o=\"d\">D. manual</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"a\" data-why=\"Rapid elasticity: kapasitas bertambah atau berkurang cepat mengikuti beban.\"><p class=\"q\">Saat KRS, kapasitas SIAKAD di cloud naik otomatis lalu turun lagi. Karakteristik NIST-nya…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Rapid elasticity</button><button type=\"button\" data-o=\"b\">B. Resource pooling</button><button type=\"button\" data-o=\"c\">C. Broad network access</button><button type=\"button\" data-o=\"d\">D. Measured service</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit</span></div><h2>Tugas mandiri dan kelompok</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bagian tentang operational backbone dan digital platform dalam Ross et al. (2019), <i>Designed for Digital</i>, dan ringkasan definisi NIST SP 800-145 (3 halaman, terbuka).</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kelompok (Tugas 1)</h3><ul><li>Pastikan organisasi mitra dan minta izin.</li><li>Wawancarai narahubung: teknologi apa saja yang dipakai, untuk apa, sejak kapan, siapa pemakainya.</li><li>Susun draf tabel pemetaan: <b>teknologi – fungsi – area nilai – nilai/manfaat – masalah</b>.</li></ul></div></div><p class=\"muted\" style=\"margin-top:.8em\">Bawa draf ke Pertemuan 3; kita lengkapi dengan IoT, mobile, dan API/platform.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Cloud computing</span></dt><dd>Model akses sumber daya komputasi bersama (server, penyimpanan, aplikasi) melalui jaringan, sesuai kebutuhan, dan cepat disediakan. <i>(komputasi awan)</i></dd></div><div><dt><span class=\"en\">Software as a Service (SaaS)</span></dt><dd>Aplikasi siap pakai yang dijalankan penyedia; pengguna cukup memakai lewat browser atau aplikasi. <i>(perangkat lunak sebagai layanan)</i></dd></div><div><dt><span class=\"en\">Platform as a Service (PaaS)</span></dt><dd>Platform untuk membangun dan menjalankan aplikasi sendiri tanpa mengelola server dan sistem operasi. <i>(platform sebagai layanan)</i></dd></div><div><dt><span class=\"en\">Infrastructure as a Service (IaaS)</span></dt><dd>Sewa server virtual, penyimpanan, dan jaringan; pengguna mengelola sistem operasi dan aplikasinya. <i>(infrastruktur sebagai layanan)</i></dd></div><div><dt><span class=\"en\">Rapid elasticity</span></dt><dd>Kemampuan kapasitas cloud bertambah atau berkurang cepat mengikuti beban. <i>(elastisitas cepat)</i></dd></div><div><dt><span class=\"en\">Vendor lock-in</span></dt><dd>Ketergantungan pada satu penyedia sehingga pindah ke penyedia lain menjadi mahal atau sulit. <i>(ketergantungan pada vendor)</i></dd></div><div><dt><span class=\"en\">Big data</span></dt><dd>Data yang volumenya besar, datangnya cepat, dan jenisnya beragam sehingga butuh cara pengolahan baru. <i>(mahadata)</i></dd></div><div><dt><span class=\"en\">Analytics</span></dt><dd>Pemakaian data, statistik, dan model untuk memahami keadaan dan mendukung keputusan. <i>(analitik)</i></dd></div><div><dt><span class=\"en\">Artificial intelligence (AI)</span></dt><dd>Sistem berbasis mesin yang, dari masukan yang diterima, menyimpulkan cara menghasilkan keluaran seperti prediksi, konten, rekomendasi, atau keputusan. <i>(kecerdasan artifisial)</i></dd></div><div><dt><span class=\"en\">Generative AI</span></dt><dd>Jenis AI yang menghasilkan konten baru (teks, gambar, kode, suara) berdasarkan pola dari data latihnya. <i>(AI generatif)</i></dd></div><div><dt><span class=\"en\">Hallucination</span></dt><dd>Keluaran AI generatif yang terdengar meyakinkan tetapi salah atau tidak berdasar. <i>(halusinasi AI)</i></dd></div><div><dt><span class=\"en\">Customer experience</span></dt><dd>Keseluruhan pengalaman pelanggan saat berinteraksi dengan organisasi di semua titik kontak. <i>(pengalaman pelanggan)</i></dd></div><div><dt><span class=\"en\">Operational backbone</span></dt><dd>Sistem inti, data, dan proses terintegrasi yang menjamin operasi harian berjalan andal. <i>(tulang punggung operasional)</i></dd></div><div><dt><span class=\"en\">Digital platform</span></dt><dd>Kumpulan komponen bisnis, data, dan infrastruktur yang dapat dipakai ulang untuk cepat membangun layanan digital baru. <i>(platform digital)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Laney, D. (2001). <i>3D data management: Controlling data volume, velocity, and variety</i> (Application Delivery Strategies, File 949). META Group.</li><li>Mell, P., &amp; Grance, T. (2011). <i>The NIST definition of cloud computing</i> (NIST Special Publication 800-145). National Institute of Standards and Technology. https://doi.org/10.6028/NIST.SP.800-145</li><li>OECD. (2024). <i>Recommendation of the Council on Artificial Intelligence</i> (OECD/LEGAL/0449; diamendemen 3 Mei 2024). OECD.</li><li>Ross, J. W., Beath, C. M., &amp; Mocker, M. (2019). <i>Designed for digital: How to architect your business for sustained success</i>. MIT Press.</li><li>Sharda, R., Delen, D., &amp; Turban, E. (2020). <i>Analytics, data science, &amp; artificial intelligence: Systems for decision support</i> (11th ed.). Pearson.</li><li>Westerman, G., Bonnet, D., &amp; McAfee, A. (2014). <i>Leading digital: Turning technology into business transformation</i>. Harvard Business Review Press.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 3.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":3,"title":"Teknologi Pendorong (2)","subtitle":"Internet of Things, mobile dan media sosial, API dan platform digital","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 3</span><span>Transformasi Digital · SI24W15</span></div><h1>Teknologi Pendorong (2)</h1><p class=\"lead\">Internet of Things, mobile dan media sosial, API dan platform digital</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 2–3 · Sub-CPMK-2</div><div><b>Hari ini</b>Konsep + finalisasi mitra &amp; pemetaan</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-2 · Pertemuan 2–3</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menjelaskan peran teknologi pendorong (cloud, data, AI, IoT, mobile) dalam transformasi digital (C2).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1 dan 2 untuk IoT, mobile, dan API/platform; indikator 3 dituntaskan)</span></h3><ol><li>Ketepatan menjelaskan karakteristik setiap teknologi pendorong. <span class=\"muted\">(cloud, data, AI di Pertemuan 2)</span></li><li>Ketepatan mengaitkan teknologi dengan nilai bisnis yang dihasilkan. <span class=\"muted\">(cloud, data, AI di Pertemuan 2)</span></li><li>Ketepatan mengidentifikasi teknologi yang dipakai organisasi mitra.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menjelaskan konsep transformasi digital, teknologi pendorongnya, dan model bisnis digital.</dd><dt>CPL-3</dt><dd class=\"id\">Menguasai konsep teoritis Sistem Informasi, Ilmu Komputer, dan Bisnis Digital secara umum serta konsep khusus secara mendalam untuk memformulasikan solusi prosedural.</dd><dt>Waktu</dt><dd>Tatap muka 2×50 menit · Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Produk (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 2–3</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 2 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><div class=\"cols w\"><ol class=\"lead\"><li>Sebutkan tiga model layanan cloud menurut NIST dan beri satu contoh masing-masing.</li><li>Apa beda analitik prediktif dan preskriptif?</li><li>Mengapa keluaran AI generatif tetap perlu diperiksa manusia?</li></ol><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Cek cepat kelompok</h3><p>Angkat tangan bila kelompok Anda sudah:</p><ul><li>memastikan organisasi mitra,</li><li>mewawancarai narahubung,</li><li>mengisi minimal tiga baris tabel pemetaan.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Kerangka</span><span>Indikator 2</span></div><h2>Tiga teknologi berikutnya</h2><figure class=\"fig\"><svg viewBox=\"0 0 860 250\" role=\"img\" aria-label=\"Teknologi digital di kiri: cloud, data dan analitik, AI sudah dibahas; IoT, mobile dan sosial, API dan platform disorot hari ini. Panah menuju tiga area penciptaan nilai: customer experience, operational processes, dan business models.\"><defs><marker id=\"dv3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><text x=\"20\" y=\"22\" class=\"s-hd\">TEKNOLOGI DIGITAL</text><rect x=\"20\" y=\"32\" width=\"220\" height=\"29\" rx=\"8\" class=\"s-box\"/><text x=\"130\" y=\"51\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Cloud ✓</text><rect x=\"20\" y=\"67\" width=\"220\" height=\"29\" rx=\"8\" class=\"s-box\"/><text x=\"130\" y=\"86\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Data &amp; analitik ✓</text><rect x=\"20\" y=\"102\" width=\"220\" height=\"29\" rx=\"8\" class=\"s-box\"/><text x=\"130\" y=\"121\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">AI / GenAI ✓</text><rect x=\"20\" y=\"137\" width=\"220\" height=\"29\" rx=\"8\" class=\"s-acc\"/><text x=\"130\" y=\"156\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">IoT</text><rect x=\"20\" y=\"172\" width=\"220\" height=\"29\" rx=\"8\" class=\"s-acc\"/><text x=\"130\" y=\"191\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Mobile &amp; sosial</text><rect x=\"20\" y=\"207\" width=\"220\" height=\"29\" rx=\"8\" class=\"s-acc\"/><text x=\"130\" y=\"226\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">API &amp; platform</text><line x1=\"250\" y1=\"130\" x2=\"440\" y2=\"130\" class=\"s-line\" marker-end=\"url(#dv3)\"/><text x=\"345\" y=\"120\" text-anchor=\"middle\" class=\"s-s\">dipakai untuk mengubah…</text><text x=\"460\" y=\"22\" class=\"s-hd\">AREA PENCIPTAAN NILAI</text><rect x=\"460\" y=\"34\" width=\"380\" height=\"58\" rx=\"12\" class=\"s-soft\"/><text x=\"650\" y=\"58\" text-anchor=\"middle\" class=\"s-t\">Customer experience</text><text x=\"650\" y=\"78\" text-anchor=\"middle\" class=\"s-s\">cara melayani &amp; memahami pelanggan</text><rect x=\"460\" y=\"104\" width=\"380\" height=\"58\" rx=\"12\" class=\"s-soft\"/><text x=\"650\" y=\"128\" text-anchor=\"middle\" class=\"s-t\">Operational processes</text><text x=\"650\" y=\"148\" text-anchor=\"middle\" class=\"s-s\">cara bekerja di dalam organisasi</text><rect x=\"460\" y=\"174\" width=\"380\" height=\"58\" rx=\"12\" class=\"s-soft\"/><text x=\"650\" y=\"198\" text-anchor=\"middle\" class=\"s-t\">Business models</text><text x=\"650\" y=\"218\" text-anchor=\"middle\" class=\"s-s\">cara menciptakan &amp; menangkap nilai</text></svg><figcaption>Tiga area penciptaan nilai, diadaptasi dari Westerman et al. (2014). Kotak kuning: dibahas hari ini; tanda ✓: sudah dibahas di Pertemuan 2.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknologi 4</span><span>Internet of Things · indikator 1</span></div><h2>Apa itu <button type=\"button\" class=\"term\" data-term=\"iot\">Internet of Things</button>?</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"A global infrastructure for the information society, enabling advanced services by interconnecting (physical and virtual) things based on existing and evolving interoperable information and communication technologies.\"</p><p class=\"tr\">\"Sebuah infrastruktur global bagi masyarakat informasi, yang memungkinkan layanan-layanan canggih dengan menghubungkan benda-benda (fisik dan virtual) berdasarkan teknologi informasi dan komunikasi interoperabel yang sudah ada dan yang sedang berkembang.\"</p><div class=\"src\">ITU (2012); terjemahan harfiah penyusun</div></blockquote><ul style=\"margin-top:.8em\"><li><b>Benda</b> yang terhubung: kamera, meteran listrik, mesin, kendaraan.</li><li><button type=\"button\" class=\"term\" data-term=\"sensor\">Sensor</button> mengukur, <button type=\"button\" class=\"term\" data-term=\"actuator\">actuator</button> bertindak.</li><li>Data mengalir terus ke cloud untuk dianalisis.</li></ul></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Siklus IoT sederhana</h3><ol><li>Sensor mengukur keadaan.</li><li>Data dikirim lewat jaringan.</li><li>Sistem menganalisis dan memutuskan.</li><li>Aktuator bertindak atau manusia diberi notifikasi.</li></ol><p class=\"muted\" style=\"font-size:.85em\">Ringkasan dosen.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknologi 4</span><span>Model referensi IoT · indikator 1</span></div><h2>Empat lapis sistem IoT</h2><figure class=\"fig\"><svg viewBox=\"0 0 860 270\" style=\"max-height:13.5em\" role=\"img\" aria-label=\"Model referensi IoT ITU-T Y.2060 dengan empat lapis dari atas: Application layer, Service support and application support layer, Network layer, Device layer. Di sisi kiri dan kanan ada kemampuan manajemen dan kemampuan keamanan yang mencakup semua lapis. Kolom contoh memakai kasus ilustrasi pemantauan tandon air pesantren.\"><rect x=\"10\" y=\"10\" width=\"44\" height=\"248\" rx=\"6\" class=\"s-hl\"/><text x=\"32\" y=\"134\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12px\" transform=\"rotate(-90 32 134)\">Management capabilities</text><rect x=\"526\" y=\"10\" width=\"44\" height=\"248\" rx=\"6\" class=\"s-hl\"/><text x=\"548\" y=\"134\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12px\" transform=\"rotate(-90 548 134)\">Security capabilities</text><rect x=\"64\" y=\"10\" width=\"452\" height=\"54\" rx=\"8\" class=\"s-acc\"/><text x=\"290\" y=\"42\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Application layer</text><rect x=\"64\" y=\"73\" width=\"452\" height=\"54\" rx=\"8\" class=\"s-soft\"/><text x=\"290\" y=\"105\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Service support and application support layer</text><rect x=\"64\" y=\"136\" width=\"452\" height=\"54\" rx=\"8\" class=\"s-soft\"/><text x=\"290\" y=\"168\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Network layer</text><rect x=\"64\" y=\"199\" width=\"452\" height=\"54\" rx=\"8\" class=\"s-soft\"/><text x=\"290\" y=\"231\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:14px\">Device layer</text><text x=\"590\" y=\"8\" class=\"s-hd\" style=\"font-size:11px\" dy=\"6\">CONTOH: TANDON AIR PESANTREN</text><rect x=\"590\" y=\"22\" width=\"260\" height=\"40\" rx=\"6\" class=\"s-box\"/><text x=\"720\" y=\"47\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12.5px\">dashboard &amp; notifikasi ke pengurus</text><rect x=\"590\" y=\"85\" width=\"260\" height=\"40\" rx=\"6\" class=\"s-box\"/><text x=\"720\" y=\"110\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12.5px\">simpan data, aturan otomatis</text><rect x=\"590\" y=\"148\" width=\"260\" height=\"40\" rx=\"6\" class=\"s-box\"/><text x=\"720\" y=\"173\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12.5px\">Wi-Fi / seluler ke internet</text><rect x=\"590\" y=\"211\" width=\"260\" height=\"40\" rx=\"6\" class=\"s-box\"/><text x=\"720\" y=\"236\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:12.5px\">sensor ketinggian air, pompa</text></svg><figcaption>Model referensi IoT menurut ITU-T Y.2060 (ITU, 2012): empat lapis ditambah kemampuan manajemen dan keamanan di semua lapis. Nama lapis ditulis sesuai sumber; kolom contoh adalah kasus ilustrasi dosen.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknologi 4</span><span>IoT · indikator 2</span></div><h2>Nilai dan risiko IoT</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Contoh nyata: ETLE nasional</h3><ul><li>23 Maret 2021: Kapolri meresmikan tilang elektronik (ETLE) nasional tahap pertama di <b>12 Polda</b> dengan <b>244 kamera</b>.</li><li>Kamera mendeteksi pelanggaran seperti menerobos lampu merah, tidak memakai helm atau sabuk pengaman, dan memakai ponsel saat berkendara.</li></ul><p class=\"muted\" style=\"font-size:.85em\">Antara Kaltara (2021)</p></div><div><div class=\"card ok\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Nilai</h3><p><b>Operational processes</b>: pemantauan otomatis 24 jam, data real-time. <b>Customer experience</b>: layanan lebih cepat dan transparan.</p></div><div class=\"card warn\" style=\"margin-top:.6em\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Risiko</h3><p>Keamanan perangkat, biaya perawatan, ketergantungan jaringan, dan data pribadi yang terekam (wajah, pelat nomor, lokasi).</p></div></div></div><p class=\"muted\" style=\"margin-top:.5em;font-size:.85em\">Pengelompokan nilai mengikuti Westerman et al. (2014); daftar risiko rangkuman dosen.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknologi 5</span><span>Mobile &amp; media sosial · indikator 1</span></div><h2>Pelanggan sebagai jaringan</h2><p>Ponsel dan media sosial mengubah pelanggan menjadi <button type=\"button\" class=\"term\" data-term=\"customer-network\">jaringan pelanggan</button>. Rogers <span class=\"cite\">(2016)</span> merumuskan lima perilaku inti pelanggan dalam jaringan:</p><div class=\"tw\"><table class=\"t\"><thead><tr><th>Perilaku</th><th>Artinya</th><th>Contoh (ilustrasi)</th></tr></thead><tbody><tr><td><b>Access</b></td><td>ingin layanan cepat, mudah, kapan saja</td><td>cek tagihan syahriah lewat ponsel</td></tr><tr><td><b>Engage</b></td><td>tertarik pada konten yang relevan</td><td>video resep dari UMKM bumbu</td></tr><tr><td><b>Customize</b></td><td>ingin pilihan dan personalisasi</td><td>pesan batik dengan motif sendiri</td></tr><tr><td><b>Connect</b></td><td>berbagi pengalaman dengan orang lain</td><td>ulasan dan foto produk di marketplace</td></tr><tr><td><b>Collaborate</b></td><td>ikut berkontribusi pada tujuan bersama</td><td>donasi dan relawan lewat platform daring</td></tr></tbody></table></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknologi 5</span><span>Mobile &amp; media sosial · indikator 2</span></div><h2>Indonesia: ponsel di setiap saku</h2><div class=\"grid3\"><div class=\"card hl\"><div class=\"big\">356 juta</div><p>koneksi seluler, setara <b>125%</b> populasi (Januari 2025).</p></div><div class=\"card hl\"><div class=\"big\">143 juta</div><p>identitas pengguna media sosial, setara <b>50,2%</b> populasi (Januari 2025).</p></div><div class=\"card\"><div class=\"big\"><button type=\"button\" class=\"term\" data-term=\"social-commerce\">Social commerce</button></div><p>UMKM berjualan lewat WhatsApp, Instagram, dan live streaming.</p></div></div><p class=\"muted\" style=\"font-size:.85em;margin-top:.4em\">Angka: Kemp (2025), DataReportal.</p><div class=\"cols\" style=\"margin-top:.4em\"><div class=\"card ok\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Nilai</h3><p><b>Customer experience</b>: layanan di genggaman. <b>Business models</b>: kanal penjualan baru tanpa toko fisik.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Risiko</h3><p>Bergantung pada algoritma platform, ulasan negatif menyebar cepat, penipuan dan kebocoran data pelanggan.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknologi 6</span><span>API · indikator 1</span></div><h2>Apa itu <button type=\"button\" class=\"term\" data-term=\"api\">API</button>?</h2><p><b>Definisi kerja mata kuliah ini</b>: API adalah pintu dengan aturan baku yang memungkinkan satu aplikasi meminta data atau layanan dari aplikasi lain tanpa harus tahu isi dalamnya.</p><figure class=\"fig\"><svg viewBox=\"0 0 860 200\" style=\"max-height:11em\" role=\"img\" aria-label=\"Aplikasi pendaftaran santri mengirim permintaan buat tagihan melalui API ke sistem pembayaran bank, lalu menerima jawaban berupa nomor virtual account atau kode QR. Di bawahnya, satu standar API yang sama memungkinkan banyak aplikasi terhubung ke banyak penyedia.\"><defs><marker id=\"da\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><rect x=\"10\" y=\"30\" width=\"230\" height=\"80\" rx=\"10\" class=\"s-soft\"/><text x=\"125\" y=\"64\" text-anchor=\"middle\" class=\"s-t\">Aplikasi pendaftaran</text><text x=\"125\" y=\"86\" text-anchor=\"middle\" class=\"s-s\">milik pesantren</text><rect x=\"345\" y=\"20\" width=\"170\" height=\"100\" rx=\"10\" class=\"s-hl\"/><text x=\"430\" y=\"64\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:18px\">API</text><text x=\"430\" y=\"88\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12px\">aturan &amp; format baku</text><rect x=\"620\" y=\"30\" width=\"230\" height=\"80\" rx=\"10\" class=\"s-soft\"/><text x=\"735\" y=\"64\" text-anchor=\"middle\" class=\"s-t\">Sistem pembayaran</text><text x=\"735\" y=\"86\" text-anchor=\"middle\" class=\"s-s\">bank / penyedia jasa</text><line x1=\"242\" y1=\"55\" x2=\"342\" y2=\"55\" class=\"s-line\" marker-end=\"url(#da)\"/><text x=\"292\" y=\"46\" text-anchor=\"middle\" class=\"s-s\">\"buat tagihan\"</text><line x1=\"517\" y1=\"55\" x2=\"617\" y2=\"55\" class=\"s-line\" marker-end=\"url(#da)\"/><line x1=\"617\" y1=\"88\" x2=\"517\" y2=\"88\" class=\"s-line\" marker-end=\"url(#da)\"/><line x1=\"342\" y1=\"88\" x2=\"242\" y2=\"88\" class=\"s-line\" marker-end=\"url(#da)\"/><text x=\"290\" y=\"108\" text-anchor=\"middle\" class=\"s-s\">nomor VA / QR</text><text x=\"430\" y=\"160\" text-anchor=\"middle\" class=\"s-hd\">SATU STANDAR API → BANYAK APLIKASI DAPAT TERHUBUNG KE BANYAK PENYEDIA</text><text x=\"430\" y=\"184\" text-anchor=\"middle\" class=\"s-s\">contoh nyata: SNAP (Bank Indonesia, 2021) untuk pembayaran; HL7 FHIR di platform SATUSEHAT untuk data kesehatan</text></svg><figcaption>Cara kerja API, kasus ilustrasi dosen. Contoh SNAP dan HL7 FHIR dibahas di slide berikutnya.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknologi 6</span><span>API &amp; platform · indikator 1–2</span></div><h2>Dari API ke platform digital</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>SNAP · pembayaran</h3><p>17 Agustus 2021: Bank Indonesia bersama ASPI meluncurkan Standar Nasional <button type=\"button\" class=\"term\" data-term=\"open-api\">Open API</button> Pembayaran (SNAP) agar aplikasi layanan pembayaran saling terhubung secara baku.</p><p class=\"muted\" style=\"font-size:.85em\">Suara Surabaya (2021)</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg>SATUSEHAT · kesehatan</h3><p>Surat edaran Kemenkes (4 Mei 2023) mewajibkan rekam medis elektronik fasilitas kesehatan <button type=\"button\" class=\"term\" data-term=\"interoperability\">terinteroperabilitas</button> dengan Platform SATUSEHAT, memakai standar <button type=\"button\" class=\"term\" data-term=\"fhir\">HL7 FHIR</button>.</p><p class=\"muted\" style=\"font-size:.85em\">Ditjen Pelayanan Kesehatan (2023)</p></div></div><div class=\"callout\" style=\"margin-top:.7em\">Ross et al. <span class=\"cite\">(2019)</span>: organisasi dapat membuka komponen digitalnya kepada pihak luar sebagai <button type=\"button\" class=\"term\" data-term=\"external-developer-platform\">external developer platform</button>, sehingga mitra ikut membangun layanan.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sintesis</span><span>Indikator 1–2</span></div><h2>Enam teknologi pendorong dalam satu tabel</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Teknologi</th><th>Ciri utama</th><th>Nilai yang khas</th></tr></thead><tbody><tr><td><b>Cloud</b></td><td>sumber daya sesuai kebutuhan, elastis</td><td>mulai cepat, biaya sesuai pemakaian</td></tr><tr><td><b>Data &amp; analitik</b></td><td>volume, velocity, variety</td><td>keputusan berbasis data</td></tr><tr><td><b>AI / GenAI</b></td><td>menyimpulkan dari data, menghasilkan keluaran</td><td>prediksi, konten, otomasi</td></tr><tr><td><b>IoT</b></td><td>benda terhubung, sensor dan aktuator</td><td>pemantauan real-time</td></tr><tr><td><b>Mobile &amp; sosial</b></td><td>pelanggan sebagai jaringan</td><td>layanan di genggaman, kanal baru</td></tr><tr><td><b>API &amp; platform</b></td><td>pintu berstandar antaraplikasi</td><td>integrasi, ekosistem mitra</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Rangkuman dosen dari Pertemuan 2–3.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Diskusi kelompok</span><span>Kelompok proyek · 25 menit</span></div><h2>Lengkapi peta teknologi mitra Anda</h2><div class=\"cols w\"><div><ol><li>Buka draf tabel pemetaan dari Pertemuan 2.</li><li>Periksa keenam teknologi: adakah IoT, mobile/media sosial, atau API yang belum tercatat?</li><li>Untuk setiap baris, pastikan ada <b>area nilai</b> dan <b>manfaat konkret</b>.</li><li>Tukar tabel dengan kelompok sebelah; beri dua masukan tertulis.</li></ol><div class=\"tw\"><table class=\"t\"><thead><tr><th>Teknologi</th><th>Fungsi</th><th>Area nilai</th><th>Manfaat</th><th>Masalah</th></tr></thead><tbody><tr><td>…</td><td>…</td><td>…</td><td>…</td><td>…</td></tr></tbody></table></div></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Pertanyaan pemandu</h3><ul><li>Bagaimana pelanggan menghubungi mitra?</li><li>Apakah ada perangkat yang mencatat otomatis?</li><li>Aplikasi mana yang saling terhubung, dan mana yang datanya diketik ulang?</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Aktivitas</span><span>Finalisasi mitra · 10 menit</span></div><h2>Kunci organisasi mitra hari ini</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Daftar periksa kelompok</h3><ul><li>Nama organisasi dan jenisnya (UMKM, instansi, perguruan tinggi, pesantren/lembaga NU).</li><li>Nama dan kontak narahubung.</li><li>Izin dari pimpinan mitra (lisan atau tertulis).</li><li>Jadwal wawancara berikutnya (untuk Business Model Canvas, Pertemuan 4–5).</li></ul></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"/><path d=\"M12 9v4M12 17h.01\"/></svg>Etika dengan mitra</h3><ul><li>Jelaskan bahwa ini tugas kuliah, bukan proyek berbayar.</li><li>Jangan menjanjikan pembuatan aplikasi.</li><li>Data mitra hanya untuk tugas; samarkan bila perlu.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>IoT</b> menghubungkan benda; model ITU punya empat lapis plus kemampuan manajemen dan keamanan.</li><li><b>Mobile dan media sosial</b> menjadikan pelanggan jaringan: access, engage, customize, connect, collaborate.</li><li><b>API</b> adalah pintu berstandar antaraplikasi; standar seperti SNAP dan HL7 FHIR membuka ekosistem.</li><li>Setiap teknologi dinilai dari <b>area nilai</b> yang diubahnya dan <b>risikonya</b>.</li><li>Enam teknologi pendorong hampir selalu bekerja <b>bersama</b>.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"c\" data-why=\"Sensor dan aktuator berada di device layer.\"><p class=\"q\">Pada model ITU-T Y.2060, sensor ketinggian air termasuk lapis…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Application layer</button><button type=\"button\" data-o=\"b\">B. Network layer</button><button type=\"button\" data-o=\"c\">C. Device layer</button><button type=\"button\" data-o=\"d\">D. Service support layer</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Connect: berbagi pengalaman dengan orang lain.\"><p class=\"q\">Pelanggan menulis ulasan dan foto produk di marketplace. Perilaku jaringan pelanggan (Rogers) ini adalah…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Access</button><button type=\"button\" data-o=\"b\">B. Connect</button><button type=\"button\" data-o=\"c\">C. Customize</button><button type=\"button\" data-o=\"d\">D. Engage</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Standar API membuat banyak aplikasi dapat bertukar data dengan format dan aturan yang sama.\"><p class=\"q\">Tujuan utama standar seperti SNAP dan HL7 FHIR adalah…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. mempercantik tampilan aplikasi</button><button type=\"button\" data-o=\"b\">B. membuat aplikasi saling terhubung secara baku</button><button type=\"button\" data-o=\"c\">C. mengganti internet</button><button type=\"button\" data-o=\"d\">D. menghapus kebutuhan data</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit</span></div><h2>Tugas 1 bagian pertama</h2><div class=\"cols\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Pemetaan teknologi digital mitra (10%)</h3><ul><li>Profil singkat mitra dan narahubung.</li><li>Tabel pemetaan lengkap: <b>teknologi – fungsi – area nilai – manfaat – masalah</b>, mencakup keenam teknologi pendorong (tulis \"belum dipakai\" bila tidak ada).</li><li>Satu paragraf kesimpulan: teknologi mana yang paling bernilai dan mana yang paling bermasalah.</li><li>Sumber data: wawancara, observasi, dokumen mitra.</li></ul></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bab tentang pelanggan dan jaringan pelanggan dalam Rogers (2016), serta bagian tentang model bisnis dalam Osterwalder dan Pigneur (2010) sebagai persiapan Business Model Canvas.</p></div></div><p class=\"muted\" style=\"margin-top:.8em\">Lembar tugas dan rubrik dibagikan terpisah. Ditulis dalam bahasa Indonesia; pemakaian AI disebutkan.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Internet of Things (IoT)</span></dt><dd>Jaringan benda fisik (sensor, kamera, mesin) yang terhubung ke internet sehingga bisa mengirim data dan dikendalikan dari jauh. <i>(internet untuk segala)</i></dd></div><div><dt><span class=\"en\">Sensor</span></dt><dd>Perangkat yang mengukur keadaan fisik (suhu, ketinggian air, gerak) lalu mengubahnya menjadi data. <i>(sensor / pengindra)</i></dd></div><div><dt><span class=\"en\">Actuator</span></dt><dd>Perangkat yang melakukan tindakan fisik berdasarkan perintah, misalnya menyalakan pompa atau membuka katup. <i>(aktuator / penggerak)</i></dd></div><div><dt><span class=\"en\">Gateway</span></dt><dd>Perangkat penghubung yang meneruskan data dari banyak perangkat IoT ke jaringan atau cloud. <i>(gerbang penghubung)</i></dd></div><div><dt><span class=\"en\">Interoperability</span></dt><dd>Kemampuan sistem yang berbeda untuk bertukar dan memakai data bersama. <i>(interoperabilitas / saling bisa bekerja sama)</i></dd></div><div><dt><span class=\"en\">Mobile-first</span></dt><dd>Merancang layanan dengan mengutamakan pengguna ponsel sejak awal. <i>(mengutamakan ponsel)</i></dd></div><div><dt><span class=\"en\">Social commerce</span></dt><dd>Jual beli yang berlangsung di dalam atau lewat media sosial dan aplikasi pesan. <i>(perdagangan sosial)</i></dd></div><div><dt><span class=\"en\">Customer network</span></dt><dd>Pelanggan sebagai jaringan yang aktif saling terhubung, memberi ulasan, dan memengaruhi satu sama lain. <i>(jaringan pelanggan)</i></dd></div><div><dt><span class=\"en\">Application Programming Interface (API)</span></dt><dd>Pintu dengan aturan tertentu yang memungkinkan satu aplikasi meminta data atau layanan dari aplikasi lain. <i>(antarmuka pemrograman aplikasi)</i></dd></div><div><dt><span class=\"en\">Open API</span></dt><dd>API yang dibuka untuk dipakai pihak lain dengan standar dan izin yang jelas. <i>(API terbuka)</i></dd></div><div><dt><span class=\"en\">Digital platform</span></dt><dd>Kumpulan komponen bisnis, data, dan infrastruktur yang dapat dipakai ulang untuk cepat membangun layanan digital baru. <i>(platform digital)</i></dd></div><div><dt><span class=\"en\">External developer platform</span></dt><dd>Kumpulan komponen digital organisasi yang dibuka untuk dipakai pihak luar (mitra, pengembang) membangun layanan. <i>(platform pengembang eksternal)</i></dd></div><div><dt><span class=\"en\">HL7 FHIR</span></dt><dd>Standar internasional pertukaran data kesehatan secara elektronik, banyak dipakai lewat API. <i>(standar interoperabilitas data kesehatan)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\" style=\"font-size:.74em;gap:.3em\"><li>Kemp, S. (2025, 25 Februari). <i>Digital 2025: Indonesia</i>. DataReportal. https://datareportal.com/reports/digital-2025-indonesia</li><li>Antara Kaltara. (2021, 23 Maret). <i>Kapolri launching Etle, 12 Polda terapkan tilang elektronik</i>. https://kaltara.antaranews.com/berita/482690/</li><li>International Telecommunication Union. (2012). <i>Overview of the Internet of things</i> (Recommendation ITU-T Y.2060). ITU. https://www.itu.int/rec/T-REC-Y.2060-201206-I</li><li>Rogers, D. L. (2016). <i>The digital transformation playbook: Rethink your business for the digital age</i>. Columbia Business School Publishing.</li><li>Ross, J. W., Beath, C. M., &amp; Mocker, M. (2019). <i>Designed for digital: How to architect your business for sustained success</i>. MIT Press.</li><li>Direktorat Jenderal Pelayanan Kesehatan. (2023, 4 Mei). <i>Surat Edaran Nomor HK.02.02/D/7093/2023 tentang Penyelenggaraan Rekam Medis Elektronik yang Terinteroperabilitas dengan Platform SATUSEHAT</i>. Kementerian Kesehatan Republik Indonesia.</li><li>Suara Surabaya. (2021, 17 Agustus). <i>BI luncurkan standar nasional open API pembayaran</i>. https://www.suarasurabaya.net/ekonomibisnis/2021/bi-luncurkan-standar-nasional-open-api-pembayaran/</li><li>Westerman, G., Bonnet, D., &amp; McAfee, A. (2014). <i>Leading digital: Turning technology into business transformation</i>. Harvard Business Review Press.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 4.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":4,"title":"Model Bisnis Digital (1)","subtitle":"Model bisnis, proposisi nilai, dan Business Model Canvas","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 4</span><span>Transformasi Digital · SI24W15</span></div><h1>Model Bisnis Digital (1)</h1><p class=\"lead\">Model bisnis, proposisi nilai, dan Business Model Canvas</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 4–5 · Sub-CPMK-3</div><div><b>Hari ini</b>Proposisi nilai + workshop BMC</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-3 · Pertemuan 4–5</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu memetakan model bisnis dan platform digital suatu organisasi dengan Business Model Canvas (C3).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1 dan 3)</span></h3><ol><li>Kelengkapan sembilan blok Business Model Canvas.</li><li>Ketepatan membedakan model bisnis pipeline dan platform. <span class=\"muted\">(Pertemuan 5)</span></li><li>Ketepatan mengidentifikasi proposisi nilai digital organisasi.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menjelaskan konsep transformasi digital, teknologi pendorongnya, dan model bisnis digital.</dd><dt>CPL-3</dt><dd class=\"id\">Menguasai konsep teoritis Sistem Informasi, Ilmu Komputer, dan Bisnis Digital secara umum serta konsep khusus secara mendalam untuk memformulasikan solusi prosedural.</dd><dt>Waktu</dt><dd>Tatap muka 2×50 menit · Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Produk (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 4–5</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemanasan</span><span>3 menit · berpasangan</span></div><h2>Bagaimana warung kopi depan kampus hidup?</h2><div class=
