\"150\" class=\"s-s\" style=\"font-size:10px\">ke petugas TU</text><rect x=\"558.4000000000001\" y=\"258\" width=\"142.8\" height=\"42\" rx=\"5\" class=\"s-warn\"/><text x=\"563.4000000000001\" y=\"276\" class=\"s-t\" style=\"font-size:10px\">Tidak tahu status,</text><text x=\"563.4000000000001\" y=\"290\" class=\"s-t\" style=\"font-size:10px\">harus bertanya terus</text><rect x=\"707.2\" y=\"34\" width=\"142.8\" height=\"24\" class=\"s-hl\"/><text x=\"778.6\" y=\"51\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:12.5px\">5. Diterima</text><text x=\"711.2\" y=\"80\" class=\"s-t\" style=\"font-size:10px\">Mengambil surat</text><text x=\"711.2\" y=\"94\" class=\"s-t\" style=\"font-size:10px\">penerimaan</text><text x=\"711.2\" y=\"136\" class=\"s-s\" style=\"font-size:10px\">Kantor pondok</text><rect x=\"707.2\" y=\"258\" width=\"142.8\" height=\"42\" rx=\"5\" class=\"s-warn\"/><text x=\"712.2\" y=\"276\" class=\"s-t\" style=\"font-size:10px\">Datang lagi hanya</text><text x=\"712.2\" y=\"290\" class=\"s-t\" style=\"font-size:10px\">untuk ambil surat</text><rect x=\"112\" y=\"164\" width=\"742\" height=\"82\" class=\"s-box\" style=\"opacity:.55\"/><text x=\"116\" y=\"176\" class=\"s-s\" style=\"font-size:10px\">senang</text><text x=\"116\" y=\"240\" class=\"s-s\" style=\"font-size:10px\">kesal</text><polyline points=\"183.4,191 332.20000000000005,221 481,206 629.8000000000001,236 778.6,191\" fill=\"none\" class=\"s-line\" style=\"stroke-width:3\"/><circle cx=\"183.4\" cy=\"191\" r=\"6\" class=\"s-hl\" style=\"stroke:var(--line);stroke-width:2.5\"/><circle cx=\"332.20000000000005\" cy=\"221\" r=\"6\" class=\"s-hl\" style=\"stroke:var(--line);stroke-width:2.5\"/><circle cx=\"481\" cy=\"206\" r=\"6\" class=\"s-hl\" style=\"stroke:var(--line);stroke-width:2.5\"/><circle cx=\"629.8000000000001\" cy=\"236\" r=\"6\" class=\"s-hl\" style=\"stroke:var(--line);stroke-width:2.5\"/><circle cx=\"778.6\" cy=\"191\" r=\"6\" class=\"s-hl\" style=\"stroke:var(--line);stroke-width:2.5\"/></svg><figcaption>Customer journey map kasus ilustrasi proses as-is pendaftaran santri baru. Persona, tindakan, dan kurva perasaan adalah rekaan dosen untuk contoh, bukan hasil survei.</figcaption></figure>\n   <p style=\"margin-top:.3em\">Proses melihat dari <b>dalam</b> organisasi; journey melihat dari <b>luar</b>, lewat mata pelanggan. Titik masalah ditandai di tahap tempat perasaan pelanggan turun.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Penelitian dosen pengampu</span><span>RPS [9] dan [10]</span></div><h2>Digitalisasi pendaftaran dan administrasi</h2>\n   <div class=\"cols\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Pendaftaran santri TPQ</h3><p style=\"font-size:.9em\"><b>Rohman dkk. (2023)</b>, TPQ Al-Irsyad, Sukodono.</p><ul style=\"font-size:.86em;margin:.2em 0 0\"><li><b>As-is:</b> pendaftar melonjak saat pendaftaran dibuka, petugas terbatas; formulir kertas atau komputer lembaga.</li><li><b>To-be:</b> aplikasi web: formulir daring dengan validasi isian, data santri, guru, kelas, dan kenaikan kelas.</li><li><b>Pelaku:</b> admin, kepala TPQ, guru, pendaftar.</li><li><b>Metode:</b> Agile (kebutuhan, rencana, desain, rilis).</li></ul></div>\n   <div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Presensi rapat instansi</h3><p style=\"font-size:.9em\"><b>Robbi dkk. (2026)</b>, BDK Surabaya (Kemenag).</p><ul style=\"font-size:.86em;margin:.2em 0 0\"><li><b>As-is:</b> daftar hadir kertas dicetak tiap rapat; rekap lama, rawan salah catat, arsip bisa hilang.</li><li><b>To-be:</b> presensi web: tanda tangan digital, foto, lokasi GPS, waktu hadir otomatis, daftar hadir PDF siap disahkan.</li><li><b>Pelaku:</b> admin dan peserta rapat.</li><li><b>Metode:</b> Waterfall; observasi, kuesioner, uji black box.</li></ul></div></div>\n   <div class=\"callout\" style=\"margin-top:.6em\"><b>Diskusikan:</b> (1) di mana titik masalah as-is pada kedua kasus? (2) fitur mana yang menjawab masalah apa? (3) langkah manual apa yang <i>dihapus</i>, bukan sekadar didigitalkan?</div>\n   <p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Ringkasan dari artikel penelitian dosen pengampu; kedua artikel melaporkan uji fungsi, bukan ukuran waktu atau efisiensi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Skenario interaktif</span><span>Anda analis proses di kantor desa</span></div><h2>Surat keterangan yang lama</h2><div class=\"sim sim-scenario\" data-sim=\"scenario\" data-cfg=\"{&quot;id&quot;:&quot;td6-skenario&quot;,&quot;start&quot;:&quot;s1&quot;,&quot;ask&quot;:&quot;Apa keputusan Anda?&quot;,&quot;nodes&quot;:{&quot;s1&quot;:{&quot;text&quot;:&quot;Warga mengeluh pembuatan surat keterangan usaha memakan tiga hari. Kepala desa memanggil Anda sebagai analis proses.&quot;,&quot;say&quot;:[[&quot;Kepala desa&quot;,&quot;Saya ingin ada aplikasi surat daring secepatnya. Bisa?&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Pesan aplikasi surat daring sekarang juga agar cepat selesai.&quot;,&quot;tag&quot;:&quot;Langsung bangun aplikasi&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;to&quot;:&quot;e_langsung&quot;,&quot;fb&quot;:&quot;Proses belum dipahami. Aplikasi akan mengikuti alur lama beserta masalahnya.&quot;},{&quot;t&quot;:&quot;Pelajari dulu: gambar proses as-is bersama staf dan warga.&quot;,&quot;tag&quot;:&quot;Gambar as-is dulu&quot;,&quot;k&quot;:&quot;good&quot;,&quot;to&quot;:&quot;s2&quot;,&quot;fb&quot;:&quot;Tepat. Perbaikan yang baik dimulai dari pemahaman proses sebagaimana adanya.&quot;},{&quot;t&quot;:&quot;Tiru aplikasi desa tetangga yang katanya bagus.&quot;,&quot;tag&quot;:&quot;Tiru desa lain&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;to&quot;:&quot;e_tiru&quot;,&quot;fb&quot;:&quot;Bisa jadi inspirasi, tetapi proses dan warga tiap desa berbeda.&quot;}]},&quot;s2&quot;:{&quot;text&quot;:&quot;Swimlane as-is selesai: surat melewati empat meja. Paling lama di meja kepala desa karena tanda tangan menunggu beliau kembali dari luar desa. Data warga juga diketik ulang di dua meja.&quot;,&quot;say&quot;:[[&quot;Sekretaris desa&quot;,&quot;Sehari-hari surat menumpuk menunggu tanda tangan.&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Fokus ke sumbatan terbesar: persetujuan lewat ponsel dan notifikasi, serta hapus pengetikan ulang.&quot;,&quot;tag&quot;:&quot;Atasi bottleneck&quot;,&quot;k&quot;:&quot;good&quot;,&quot;to&quot;:&quot;s3&quot;,&quot;fb&quot;:&quot;Tepat. Bottleneck ditangani langsung, dan pengetikan ulang dihapus sebelum diotomasi.&quot;},{&quot;t&quot;:&quot;Tambah dua staf pengetik agar surat lebih cepat diketik.&quot;,&quot;tag&quot;:&quot;Tambah staf&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;to&quot;:&quot;e_staf&quot;,&quot;fb&quot;:&quot;Membantu sedikit, tetapi sumbatan sebenarnya ada pada tanda tangan.&quot;},{&quot;t&quot;:&quot;Minta warga datang lebih pagi supaya sempat ditandatangani.&quot;,&quot;tag&quot;:&quot;Salahkan warga&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;to&quot;:&quot;e_warga&quot;,&quot;fb&quot;:&quot;Ini memindahkan beban ke pelanggan tanpa memperbaiki prosesnya.&quot;}]},&quot;s3&quot;:{&quot;text&quot;:&quot;Rancangan to-be siap. Perangkat desa khawatir: banyak warga lansia belum bisa memakai ponsel.&quot;,&quot;say&quot;:[[&quot;Perangkat desa&quot;,&quot;Kalau semua serba daring, bagaimana nasib warga yang gaptek?&quot;]],&quot;ch&quot;:[{&quot;t&quot;:&quot;Wajibkan semua pengajuan lewat aplikasi mulai bulan depan.&quot;,&quot;tag&quot;:&quot;Paksa semua daring&quot;,&quot;k&quot;:&quot;bad&quot;,&quot;to&quot;:&quot;e_paksa&quot;,&quot;fb&quot;:&quot;Mengabaikan warga yang kesulitan; risiko keluhan dan eksklusi.&quot;},{&quot;t&quot;:&quot;Sediakan jalur daring dan loket bantu, lalu ukur lama pengurusan setelah sebulan.&quot;,&quot;tag&quot;:&quot;Daring + loket bantu&quot;,&quot;k&quot;:&quot;good&quot;,&quot;to&quot;:&quot;e_baik&quot;,&quot;fb&quot;:&quot;Tepat. Transformasi perlu memperhitungkan semua pengguna dan diukur manfaatnya.&quot;},{&quot;t&quot;:&quot;Tunda sampai semua warga mahir ponsel.&quot;,&quot;tag&quot;:&quot;Tunda&quot;,&quot;k&quot;:&quot;mid&quot;,&quot;to&quot;:&quot;e_tunda&quot;,&quot;fb&quot;:&quot;Aman, tetapi manfaat bagi sebagian besar warga tertunda tanpa batas.&quot;}]},&quot;e_langsung&quot;:{&quot;end&quot;:&quot;Aplikasi jadi, tetapi surat tetap menunggu tanda tangan di meja kepala desa dan data tetap diketik ulang. Warga bertanya apa bedanya.&quot;,&quot;title&quot;:&quot;Akhir: masalah lama, layar baru&quot;,&quot;k&quot;:&quot;bad&quot;},&quot;e_tiru&quot;:{&quot;end&quot;:&quot;Aplikasi desa tetangga memakai alur tiga tingkat persetujuan yang tidak ada di desa Anda. Staf bingung dan banyak fitur tidak terpakai.&quot;,&quot;title&quot;:&quot;Akhir: tidak cocok dengan proses sendiri&quot;,&quot;k&quot;:&quot;mid&quot;},&quot;e_staf&quot;:{&quot;end&quot;:&quot;Pengetikan agak lebih cepat, tetapi surat tetap menunggu tanda tangan. Biaya naik, lama pengurusan hampir sama.&quot;,&quot;title&quot;:&quot;Akhir: biaya naik, sumbatan tetap&quot;,&quot;k&quot;:&quot;mid&quot;},&quot;e_warga&quot;:{&quot;end&quot;:&quot;Warga kesal karena harus antre sejak subuh. Keluhan malah bertambah.&quot;,&quot;title&quot;:&quot;Akhir: pelanggan menanggung beban&quot;,&quot;k&quot;:&quot;bad&quot;},&quot;e_paksa&quot;:{&quot;end&quot;:&quot;Warga lansia tidak bisa mengajukan surat dan terpaksa meminta bantuan tetangga. Kepercayaan pada layanan desa menurun.&quot;,&quot;title&quot;:&quot;Akhir: ada warga tertinggal&quot;,&quot;k&quot;:&quot;bad&quot;},&quot;e_tunda&quot;:{&quot;end&quot;:&quot;Satu tahun berlalu dan proses masih sama. Warga yang sebenarnya siap tetap menunggu tiga hari.&quot;,&quot;title&quot;:&quot;Akhir: perbaikan terlalu lama tertunda&quot;,&quot;k&quot;:&quot;mid&quot;},&quot;e_baik&quot;:{&quot;end&quot;:&quot;Surat selesai dalam satu hari bagi pengguna daring, loket bantu melayani warga yang membutuhkan, dan hasilnya diukur tiap bulan untuk perbaikan berikutnya.&quot;,&quot;title&quot;:&quot;Akhir: proses lebih baik dan inklusif&quot;,&quot;k&quot;:&quot;good&quot;}}}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Latihan</span><span>Berpasangan · 5 menit · kasus ilustrasi</span></div><h2>Hapus, sederhanakan, digitalkan, atau otomasikan?</h2>\n   <div class=\"grid3\"><div class=\"card\"><h3>1</h3><p>Petugas menyalin nama pelanggan dari formulir kertas ke buku besar, lalu ke Excel.</p></div>\n   <div class=\"card\"><h3>2</h3><p>Pelanggan menerima nota tulis tangan yang sering salah hitung.</p></div>\n   <div class=\"card\"><h3>3</h3><p>Pelanggan harus bertanya lewat telepon untuk tahu pesanannya sudah dikirim atau belum.</p></div>\n   <div class=\"card\"><h3>4</h3><p>Pesanan harus disetujui pemilik, padahal selalu disetujui bila stok ada.</p></div>\n   <div class=\"card\"><h3>5</h3><p>Formulir pemesanan memiliki 25 isian, setengahnya tidak pernah dipakai.</p></div>\n   <div class=\"card\"><h3>6</h3><p>Laporan penjualan mingguan dihitung manual dari tumpukan nota.</p></div></div>\n   <p class=\"lead\" style=\"margin-top:.7em;font-size:1em\">Untuk tiap kasus: perbaikan apa yang paling tepat, dan mengapa?</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Workshop customer journey</span><span>Kelompok proyek · 20 menit</span></div><h2>Petakan proses dan perjalanan pelanggan mitra</h2>\n   <div class=\"cols w\"><div><ol><li>Tulis <b>pemicu</b>, <b>pelaku</b>, dan <b>hasil</b> proses utama mitra Anda.</li><li>Gambar <b>as-is</b> dalam swimlane (kertas besar atau papan tulis): langkah, pelaku, serah-terima.</li><li>Tandai <b>titik masalah</b> dan catat buktinya (pernah terjadi apa? kata siapa?).</li><li>Tentukan satu <b>persona</b> pelanggan; buat <b>journey</b> singkat lima tahap dengan kurva perasaan.</li><li>Pilih titik masalah <b>quick win</b>; coret kasar <b>to-be</b>-nya.</li></ol></div>\n   <div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Pertanyaan pemandu</h3><ul><li>Apa yang sebenarnya terjadi, bukan yang seharusnya?</li><li>Siapa yang menunggu, dan menunggu apa?</li><li>Bagaimana kami tahu itu masalah? Buktinya?</li><li>Langkah mana yang bisa dihapus sebelum didigitalkan?</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Penilaian sejawat</span><span>Formatif · tidak masuk nilai</span></div><h2>Periksa proses dan journey kelompok lain</h2><div class=\"sim sim-peer\" data-sim=\"peer\" data-cfg=\"{&quot;id&quot;:&quot;td6-sejawat&quot;,&quot;title&quot;:&quot;Penilaian sejawat · Proses dan customer journey mitra (Transformasi Digital P6)&quot;,&quot;levels&quot;:[&quot;Belum tampak&quot;,&quot;Mulai tampak&quot;,&quot;Tampak&quot;,&quot;Menonjol&quot;],&quot;pick&quot;:&quot;Pilih level 1–4.&quot;,&quot;whoLabel&quot;:&quot;Kelompok yang dinilai (nama/mitra)&quot;,&quot;whoPh&quot;:&quot;mis. Kelompok 2 · UMKM keripik&quot;,&quot;goodLabel&quot;:&quot;Yang sudah baik&quot;,&quot;goodPh&quot;:&quot;Satu hal spesifik di diagram mereka&quot;,&quot;tipLabel&quot;:&quot;Saran perbaikan&quot;,&quot;tipPh&quot;:&quot;Sebut bagian yang perlu diperbaiki dan caranya&quot;,&quot;bands&quot;:[{&quot;min&quot;:0,&quot;t&quot;:&quot;Perlu banyak perbaikan&quot;},{&quot;min&quot;:8,&quot;t&quot;:&quot;Berkembang&quot;},{&quot;min&quot;:11,&quot;t&quot;:&quot;Baik&quot;},{&quot;min&quot;:14,&quot;t&quot;:&quot;Sangat baik&quot;}],&quot;criteria&quot;:[{&quot;t&quot;:&quot;Diagram as-is&quot;,&quot;ind&quot;:&quot;Indikator 1&quot;,&quot;d&quot;:[&quot;Hanya daftar langkah, pelaku tidak jelas.&quot;,&quot;Ada pelaku dan langkah, tetapi serah-terima tidak terlihat.&quot;,&quot;Pelaku, langkah, dan serah-terima jelas.&quot;,&quot;Jelas, sesuai kenyataan, dan memuat pengulangan atau waktu tunggu.&quot;]},{&quot;t&quot;:&quot;Diagram to-be dan perbedaannya&quot;,&quot;ind&quot;:&quot;Indikator 1&quot;,&quot;d&quot;:[&quot;Tidak ada to-be.&quot;,&quot;To-be ada, tetapi sama dengan as-is.&quot;,&quot;Perbedaan dengan as-is tampak.&quot;,&quot;Perbedaan jelas dan dapat dihitung (langkah, kedatangan, entri).&quot;]},{&quot;t&quot;:&quot;Titik masalah pada journey&quot;,&quot;ind&quot;:&quot;Indikator 2&quot;,&quot;d&quot;:[&quot;Titik masalah umum atau tidak ada.&quot;,&quot;Titik masalah ada, tetapi tidak dikaitkan dengan tahap.&quot;,&quot;Titik masalah tepat pada tahap yang benar.&quot;,&quot;Tepat dan didukung bukti (wawancara, observasi, keluhan).&quot;]},{&quot;t&quot;:&quot;Usulan digitalisasi dan manfaat&quot;,&quot;ind&quot;:&quot;Indikator 3&quot;,&quot;d&quot;:[&quot;Usulan tidak menjawab masalah.&quot;,&quot;Usulan menyebut teknologi tanpa alasan.&quot;,&quot;Usulan menjawab titik masalah dan manfaatnya disebut.&quot;,&quot;Usulan menjawab masalah, urutannya masuk akal, manfaat dan risiko dibahas.&quot;]}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.78em;margin-top:.5em\">Isian hanya tersimpan di perangkat Anda. Tekan Copy summary, lalu kirim ke kelompok yang dinilai.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2>\n   <ul class=\"lead\"><li><b>Proses bisnis</b>: pemicu, pelaku, langkah, hasil. Pemodelan <b>as-is</b> menggambarkan kenyataan; <b>to-be</b> menggambarkan rancangan perbaikan.</li><li><b>Swimlane</b> menunjukkan siapa mengerjakan apa dan di mana pekerjaan berpindah (handoff, tempat menunggu).</li><li>Titik masalah dicari lewat <b>pengamatan dan bukti</b>, dari sisi proses (swimlane) dan sisi pelanggan (journey).</li><li>Urutan perbaikan: <b>hapus, sederhanakan, digitalkan, otomasikan</b>; digitalisasi tanpa memahami proses hanya memindahkan masalah.</li><li>Prioritaskan lewat <b>dampak dan kemudahan</b>; ukur manfaat dan perhatikan risiko serta pengguna yang tertinggal.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>5 soal · satu per satu</span></div><h2>Kuis singkat</h2><div class=\"sim sim-quizset\" data-sim=\"quizset\" data-cfg=\"{&quot;id&quot;:&quot;td6-kuis&quot;,&quot;items&quot;:[{&quot;q&quot;:&quot;Formulir kertas diganti PDF yang tetap dicetak, diisi tangan, dan diantar ke kantor. Perubahan ini…&quot;,&quot;o&quot;:[&quot;sudah merupakan transformasi proses&quot;,&quot;hanya mengubah bentuk formulir, belum alur prosesnya&quot;,&quot;menghapus semua titik masalah&quot;,&quot;menggantikan seluruh pelaku proses&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Langkah, pelaku, dan serah-terima tetap sama; yang berubah hanya media dokumen.&quot;},{&quot;q&quot;:&quot;Proses as-is adalah proses…&quot;,&quot;o&quot;:[&quot;sebagaimana berjalan saat ini di lapangan&quot;,&quot;sebagaimana tertulis di peraturan, walau tidak dijalankan&quot;,&quot;yang akan dirancang setelah digitalisasi&quot;,&quot;yang dipakai organisasi lain&quot;],&quot;a&quot;:0,&quot;why&quot;:&quot;As-is menggambarkan kenyataan, bukan yang seharusnya; harus divalidasi dengan pelaku di lapangan.&quot;},{&quot;q&quot;:&quot;Setelah titik masalah ditemukan, urutan perbaikan yang masuk akal adalah…&quot;,&quot;o&quot;:[&quot;otomasikan, hapus, sederhanakan, digitalkan&quot;,&quot;hapus, sederhanakan, digitalkan, otomasikan&quot;,&quot;digitalkan semua, lalu hapus&quot;,&quot;pilih aplikasi, lalu cari masalahnya&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Menghapus dan menyederhanakan lebih dulu mencegah mendigitalkan langkah yang sebenarnya tidak perlu.&quot;},{&quot;q&quot;:&quot;Pada swimlane, panah yang menyeberang dari satu lajur ke lajur lain menunjukkan…&quot;,&quot;o&quot;:[&quot;langkah yang dihapus&quot;,&quot;titik masalah pasti&quot;,&quot;keputusan manajer&quot;,&quot;serah-terima (handoff) pekerjaan antarpelaku&quot;],&quot;a&quot;:3,&quot;why&quot;:&quot;Serah-terima sering menjadi tempat menunggu dan kesalahan, sehingga layak diperiksa.&quot;},{&quot;q&quot;:&quot;Titik masalah dengan dampak besar bagi pelanggan dan mudah didigitalkan sebaiknya…&quot;,&quot;o&quot;:[&quot;ditunda sampai tahun depan&quot;,&quot;dikerjakan lebih dulu sebagai quick win&quot;,&quot;dihapus dari daftar usulan&quot;,&quot;dikerjakan setelah semua perbaikan kecil&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Dampak besar dan mudah: hasil cepat terasa dan membangun dukungan untuk perubahan berikutnya.&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit</span></div><h2>Tugas 1B: proses, journey, dan laporan akhir</h2>\n   <div class=\"cols w\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Bagian C dan laporan akhir Tugas 1 (10%)</h3><ul><li>Rapikan <b>swimlane as-is dan to-be</b> satu proses utama mitra, serta <b>customer journey map</b> dengan titik masalah berbukti.</li><li>Uraikan <b>usulan digitalisasi</b> dan manfaat yang diharapkan.</li><li>Sempurnakan Bagian A dan B dari umpan balik Tugas 1A; tulis kesimpulan terpadu.</li><li>Siapkan <b>slide presentasi</b> (maks. 10 slide) untuk Pertemuan 7.</li></ul></div>\n   <div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Tenggat dan format</h3><p>Dikumpulkan di Elin paling lambat <b>Senin, 2 November 2026, 23.59 WIB</b>. Presentasi di Pertemuan 7 (hari yang sama, jam kuliah).</p><p>Laporan PDF maks. 15 halaman; slide PDF atau PPTX. Tiap anggota mengunggah berkas kelompok yang sama.</p></div></div>\n   <p class=\"muted\" style=\"margin-top:.4em;font-size:.9em\">Rincian dan rubrik ada di halaman tugas Elin. Ditulis dalam bahasa Indonesia; pemakaian AI disebutkan.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Business process</span></dt><dd>Rangkaian aktivitas yang saling berkaitan dan dikerjakan satu atau beberapa pihak untuk menghasilkan suatu hasil bagi pelanggan. <i>(proses bisnis)</i></dd></div><div><dt><span class=\"en\">As-is process</span></dt><dd>Gambaran proses sebagaimana berjalan saat ini, apa adanya, termasuk kebiasaan dan jalan pintas di lapangan. <i>(proses kondisi saat ini)</i></dd></div><div><dt><span class=\"en\">To-be process</span></dt><dd>Gambaran proses yang dirancang setelah perbaikan atau digitalisasi. <i>(proses yang dituju)</i></dd></div><div><dt><span class=\"en\">Swimlane diagram</span></dt><dd>Diagram alur yang membagi proses ke dalam lajur per pelaku, sehingga terlihat siapa mengerjakan apa dan kapan pekerjaan berpindah tangan. <i>(diagram lajur renang)</i></dd></div><div><dt><span class=\"en\">Pain point</span></dt><dd>Titik dalam proses atau pengalaman pelanggan yang menimbulkan kesulitan, kekesalan, atau pemborosan. <i>(titik masalah)</i></dd></div><div><dt><span class=\"en\">Bottleneck</span></dt><dd>Langkah yang kapasitasnya paling sempit sehingga pekerjaan menumpuk dan menunggu di sana. <i>(sumbatan / leher botol)</i></dd></div><div><dt><span class=\"en\">Handoff</span></dt><dd>Perpindahan pekerjaan dari satu pelaku ke pelaku lain; sering menjadi tempat menunggu dan kesalahan. <i>(serah-terima pekerjaan)</i></dd></div><div><dt><span class=\"en\">Process automation</span></dt><dd>Penggunaan perangkat lunak untuk mengerjakan langkah proses tanpa kerja manual, misalnya validasi, notifikasi, dan pencatatan otomatis. <i>(otomasi proses)</i></dd></div><div><dt><span class=\"en\">Customer journey map</span></dt><dd>Peta yang menggambarkan tahapan yang dilalui pelanggan saat berinteraksi dengan organisasi, beserta tindakan, titik sentuh, dan perasaannya. <i>(peta perjalanan pelanggan)</i></dd></div><div><dt><span class=\"en\">Touchpoint</span></dt><dd>Titik tempat pelanggan bersentuhan dengan organisasi, misalnya loket, aplikasi, WhatsApp, atau brosur. <i>(titik sentuh)</i></dd></div><div><dt><span class=\"en\">Persona</span></dt><dd>Tokoh rekaan yang mewakili satu kelompok pelanggan, disusun dari data wawancara dan observasi. <i>(persona pelanggan)</i></dd></div><div><dt><span class=\"en\">Quick win</span></dt><dd>Perbaikan yang mudah dikerjakan tetapi dampaknya terasa jelas bagi pelanggan. <i>(kemenangan cepat)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Westerman, G., Bonnet, D., &amp; McAfee, A. (2014). <i>Leading digital: Turning technology into business transformation</i>. Harvard Business Review Press.</li><li>Rogers, D. L. (2016). <i>The digital transformation playbook: Rethink your business for the digital age</i>. Columbia Business School Publishing.</li><li>Rohman, A. A., Nugroho, R. A., &amp; Mufliq, A. (2023). Sistem informasi manajemen Taman Pendidikan Al-Qur'an menggunakan metode Agile. <i>Nusantara Computer and Design Review, 1</i>(1), 9–16.</li><li>Robbi, I. A., Mufliq, A., Nugroho, R. A., Mu'min, S., Andhyka, A., Arif, S., &amp; Al-Haq, A. K. (2026). Perancangan sistem presensi rapat berbasis web untuk meningkatkan efisiensi administrasi pada Balai Diklat Keagamaan Surabaya. <i>Jurnal Riset Sistem Informasi dan Teknologi Informasi (JURSISTEKNI), 8</i>(1), 1090–1105.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 7.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":7,"title":"Pengalaman Pelanggan Digital","subtitle":"Customer journey map, pengalaman omnichannel · presentasi Tugas 1","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 7</span><span>Transformasi Digital · SI24W15</span></div><h1>Pengalaman Pelanggan Digital</h1><p class=\"lead\">Customer journey map, pengalaman omnichannel, dan presentasi kelompok Tugas 1</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 6–7 · Sub-CPMK-4</div><div><b>Hari ini</b>Omnichannel + presentasi Tugas 1</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-4 · Pertemuan 6–7</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menganalisis peluang digitalisasi proses bisnis dan pengalaman pelanggan (C4).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 2 dan 4; indikator 1 dan 3 diterapkan dalam presentasi)</span></h3><ol><li>Ketepatan memodelkan proses as-is dan to-be. <span class=\"muted\">(Pertemuan 6; ditunjukkan di presentasi)</span></li><li><b>Ketepatan mengidentifikasi titik masalah pada customer journey.</b></li><li>Kelogisan usulan digitalisasi proses berikut manfaatnya. <span class=\"muted\">(Pertemuan 6; ditunjukkan di presentasi)</span></li><li><b>Kualitas presentasi hasil analisis.</b></li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-2</dt><dd>Mahasiswa mampu menganalisis proses, kematangan digital, dan kebutuhan perubahan organisasi untuk merumuskan strategi dan roadmap transformasi digital.</dd><dt>CPL-4</dt><dd class=\"id\">Memiliki kompetensi menganalisis persoalan Sistem Informasi yang kompleks untuk mengidentifikasi solusi pengelolaan proyek teknologi dan transformasi digital dengan wawasan transdisiplin.</dd><dt>Waktu</dt><dd>Tatap muka 2×50 menit · Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Proyek (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 6–7</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 6</span></div><h2>Masih ingat?</h2>\n   <div class=\"cols w\"><ol class=\"lead\"><li>Apa beda proses <b>as-is</b> dan <b>to-be</b>?</li><li>Sebutkan urutan perbaikan proses sebelum memilih teknologi.</li><li>Pada <button type=\"button\" class=\"term\" data-term=\"customer-journey\">customer journey map</button>, di mana titik masalah ditaruh, dan apa yang membuatnya meyakinkan?</li></ol>\n   <div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Cek kesiapan presentasi</h3><ul><li>Slide kelompok sudah disalin ke laptop kelas.</li><li>Setiap anggota tahu bagian yang ia sampaikan.</li><li>Laporan akhir siap diunggah malam ini.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemanasan</span><span>3 menit · berpasangan</span></div><h2>Satu pesanan, empat saluran</h2>\n   <div class=\"cols w\"><div class=\"card\"><p>Rani memesan kue ulang tahun di toko kue langganannya. Ia bertanya harga lewat <b>DM Instagram</b>, lalu diminta lanjut di <b>WhatsApp</b>. Setelah transfer, ia mengirim foto bukti ke nomor WhatsApp lain milik bagian keuangan. Saat mengambil kue di <b>toko</b>, kasir tidak menemukan pesanannya dan Rani menjelaskan semuanya dari awal.</p><p class=\"muted\" style=\"font-size:.85em\">Kasus ilustrasi buatan dosen.</p></div>\n   <ol><li>Berapa kali Rani mengulang ceritanya?</li><li>Di perpindahan saluran mana informasi terputus?</li><li>Satu perbaikan kecil apa yang paling terasa bagi Rani?</li></ol></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 2 · definisi kerja mata kuliah</span></div><h2>Banyak saluran belum tentu terpadu</h2><figure class=\"fig\"><svg viewBox=\"0 0 860 270\" style=\"max-height:17em\" role=\"img\" aria-label=\"Perbandingan dua rancangan layanan, kasus ilustrasi. Kiri, multichannel: pelanggan memakai empat saluran yaitu WhatsApp, situs web, loket, dan Instagram, dan setiap saluran menyimpan datanya sendiri sehingga pelanggan harus mengulang cerita saat pindah saluran. Kanan, omnichannel: empat saluran yang sama terhubung ke satu data pelanggan terpadu sehingga riwayat dan status ikut berpindah.\"><defs><marker id=\"dom7\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><text x=\"10\" y=\"20\" class=\"s-hd\" style=\"font-size:14px\">Multichannel: saluran terpisah</text><text x=\"450\" y=\"20\" class=\"s-hd\" style=\"font-size:14px\">Omnichannel: saluran terpadu</text><line x1=\"430\" y1=\"8\" x2=\"430\" y2=\"262\" class=\"s-dash\"/><rect x=\"8\" y=\"112\" width=\"74\" height=\"44\" rx=\"22\" class=\"s-hl\"/><text x=\"45\" y=\"139\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11px\">Pelanggan</text><path d=\"M82 134 L124 63\" fill=\"none\" class=\"s-line\" marker-end=\"url(#dom7)\"/><rect x=\"128\" y=\"46\" width=\"112\" height=\"34\" rx=\"5\" class=\"s-box\"/><text x=\"184\" y=\"68\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">WhatsApp</text><path d=\"M240 63 H282\" fill=\"none\" class=\"s-line\" marker-end=\"url(#dom7)\"/><rect x=\"286\" y=\"49\" width=\"118\" height=\"28\" rx=\"4\" class=\"s-warn\"/><text x=\"345\" y=\"68\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10.5px\">chat WA</text><path d=\"M82 134 L124 117\" fill=\"none\" class=\"s-line\" marker-end=\"url(#dom7)\"/><rect x=\"128\" y=\"100\" width=\"112\" height=\"34\" rx=\"5\" class=\"s-box\"/><text x=\"184\" y=\"122\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Situs web</text><path d=\"M240 117 H282\" fill=\"none\" class=\"s-line\" marker-end=\"url(#dom7)\"/><rect x=\"286\" y=\"103\" width=\"118\" height=\"28\" rx=\"4\" class=\"s-warn\"/><text x=\"345\" y=\"122\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10.5px\">data formulir</text><path d=\"M82 134 L124 171\" fill=\"none\" class=\"s-line\" marker-end=\"url(#dom7)\"/><rect x=\"128\" y=\"154\" width=\"112\" height=\"34\" rx=\"5\" class=\"s-box\"/><text x=\"184\" y=\"176\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Loket</text><path d=\"M240 171 H282\" fill=\"none\" class=\"s-line\" marker-end=\"url(#dom7)\"/><rect x=\"286\" y=\"157\" width=\"118\" height=\"28\" rx=\"4\" class=\"s-warn\"/><text x=\"345\" y=\"176\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10.5px\">buku loket</text><path d=\"M82 134 L124 225\" fill=\"none\" class=\"s-line\" marker-end=\"url(#dom7)\"/><rect x=\"128\" y=\"208\" width=\"112\" height=\"34\" rx=\"5\" class=\"s-box\"/><text x=\"184\" y=\"230\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Instagram</text><path d=\"M240 225 H282\" fill=\"none\" class=\"s-line\" marker-end=\"url(#dom7)\"/><rect x=\"286\" y=\"211\" width=\"118\" height=\"28\" rx=\"4\" class=\"s-warn\"/><text x=\"345\" y=\"230\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10.5px\">pesan DM</text><rect x=\"448\" y=\"112\" width=\"74\" height=\"44\" rx=\"22\" class=\"s-hl\"/><text x=\"485\" y=\"139\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11px\">Pelanggan</text><path d=\"M522 134 L564 63\" fill=\"none\" class=\"s-line\" marker-end=\"url(#dom7)\"/><rect x=\"568\" y=\"46\" width=\"112\" height=\"34\" rx=\"5\" class=\"s-box\"/><text x=\"624\" y=\"68\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">WhatsApp</text><path d=\"M680 63 L718 134\" fill=\"none\" class=\"s-line\" marker-end=\"url(#dom7)\"/><path d=\"M522 134 L564 117\" fill=\"none\" class=\"s-line\" marker-end=\"url(#dom7)\"/><rect x=\"568\" y=\"100\" width=\"112\" height=\"34\" rx=\"5\" class=\"s-box\"/><text x=\"624\" y=\"122\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Situs web</text><path d=\"M680 117 L718 134\" fill=\"none\" class=\"s-line\" marker-end=\"url(#dom7)\"/><path d=\"M522 134 L564 171\" fill=\"none\" class=\"s-line\" marker-end=\"url(#dom7)\"/><rect x=\"568\" y=\"154\" width=\"112\" height=\"34\" rx=\"5\" class=\"s-box\"/><text x=\"624\" y=\"176\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Loket</text><path d=\"M680 171 L718 134\" fill=\"none\" class=\"s-line\" marker-end=\"url(#dom7)\"/><path d=\"M522 134 L564 225\" fill=\"none\" class=\"s-line\" marker-end=\"url(#dom7)\"/><rect x=\"568\" y=\"208\" width=\"112\" height=\"34\" rx=\"5\" class=\"s-box\"/><text x=\"624\" y=\"230\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Instagram</text><path d=\"M680 225 L718 134\" fill=\"none\" class=\"s-line\" marker-end=\"url(#dom7)\"/><rect x=\"722\" y=\"96\" width=\"128\" height=\"76\" rx=\"6\" class=\"s-acc\"/><text x=\"786\" y=\"122\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">Data pelanggan</text><text x=\"786\" y=\"138\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:11.5px\">terpadu</text><text x=\"786\" y=\"156\" text-anchor=\"middle\" class=\"s-s\" style=\"font-size:10px\">status · riwayat</text><text x=\"10\" y=\"258\" class=\"s-s\" style=\"font-size:11px\">Kotak merah muda = data terpisah per saluran: pelanggan mengulang cerita.</text><text x=\"450\" y=\"258\" class=\"s-s\" style=\"font-size:11px\">Satu data untuk semua saluran: riwayat ikut berpindah.</text></svg><figcaption>Kasus ilustrasi buatan dosen; nama saluran hanya contoh. Istilah multichannel dan omnichannel memakai definisi kerja mata kuliah.</figcaption></figure>\n   <p style=\"margin-top:.3em;font-size:.95em\"><button type=\"button\" class=\"term\" data-term=\"multichannel\">Multichannel</button>: banyak saluran, data terpisah. <button type=\"button\" class=\"term\" data-term=\"omnichannel\">Omnichannel</button>: saluran terhubung ke satu <button type=\"button\" class=\"term\" data-term=\"single-customer-view\">data pelanggan</button>, sehingga <button type=\"button\" class=\"term\" data-term=\"channel-switching\">pindah saluran</button> tidak berarti mengulang.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Simulasi</span><span>Geser titik atau slider</span></div><h2>Di tingkat mana layanan mitra Anda?</h2><div class=\"sim sim-grid2\" data-sim=\"grid2\" data-cfg=\"{&quot;id&quot;:&quot;td7-saluran&quot;,&quot;aria&quot;:&quot;Simulasi tingkat keterpaduan saluran. Sumbu mendatar jumlah saluran layanan, sumbu tegak keterpaduan data antarsaluran. Empat zona: omnichannel, cross-channel, multichannel, dan saluran terbatas.&quot;,&quot;x&quot;:{&quot;label&quot;:&quot;Jumlah saluran&quot;,&quot;lo&quot;:&quot;1&quot;,&quot;hi&quot;:&quot;banyak&quot;},&quot;y&quot;:{&quot;label&quot;:&quot;Keterpaduan data&quot;,&quot;lo&quot;:&quot;terpisah&quot;,&quot;hi&quot;:&quot;menyatu&quot;},&quot;init&quot;:[7,2],&quot;zones&quot;:[{&quot;k&quot;:&quot;om&quot;,&quot;en&quot;:&quot;Omnichannel&quot;,&quot;name&quot;:&quot;Saluran terpadu&quot;,&quot;tag&quot;:&quot;banyak saluran · data menyatu&quot;,&quot;r&quot;:[4,10,7,10],&quot;cls&quot;:&quot;s-soft&quot;,&quot;d&quot;:&quot;Pelanggan bisa memulai di satu saluran dan menyelesaikan di saluran lain tanpa mengulang. Status dan riwayat terlihat oleh petugas di mana pun.&quot;,&quot;ex&quot;:&quot;Daftar daring, tanya status lewat WA, daftar ulang di loket; petugas melihat data yang sama.&quot;},{&quot;k&quot;:&quot;cc&quot;,&quot;en&quot;:&quot;Cross-channel&quot;,&quot;name&quot;:&quot;Mulai terhubung&quot;,&quot;tag&quot;:&quot;banyak saluran · sebagian menyatu&quot;,&quot;r&quot;:[4,10,4,7],&quot;cls&quot;:&quot;s-acc&quot;,&quot;d&quot;:&quot;Beberapa perpindahan saluran sudah lancar, tetapi masih ada titik tempat pelanggan mengulang atau menunggu.&quot;,&quot;ex&quot;:&quot;Pesan di situs lalu ambil di toko bisa, tetapi pertanyaan di WA tidak tercatat di sistem pesanan.&quot;},{&quot;k&quot;:&quot;mc&quot;,&quot;en&quot;:&quot;Multichannel&quot;,&quot;name&quot;:&quot;Banyak saluran, tersekat&quot;,&quot;tag&quot;:&quot;banyak saluran · data terpisah&quot;,&quot;r&quot;:[4,10,0,4],&quot;cls&quot;:&quot;s-box&quot;,&quot;d&quot;:&quot;Tiap saluran berjalan sendiri. Saluran bertambah, tetapi titik masalah di perpindahan saluran ikut bertambah.&quot;,&quot;ex&quot;:&quot;Kasus Rani: DM, dua nomor WA, dan toko tidak saling tahu.&quot;},{&quot;k&quot;:&quot;sc&quot;,&quot;en&quot;:&quot;Saluran terbatas&quot;,&quot;name&quot;:&quot;Satu atau dua saluran&quot;,&quot;tag&quot;:&quot;sedikit saluran&quot;,&quot;r&quot;:[0,4,0,10],&quot;cls&quot;:&quot;s-box&quot;,&quot;d&quot;:&quot;Pelanggan hanya punya sedikit pilihan saluran. Belum tentu buruk; pertanyaannya apakah saluran itu sesuai kebiasaan pelanggan.&quot;,&quot;ex&quot;:&quot;Pendaftaran hanya di kantor pada jam kerja.&quot;}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.5em\">Batas zona adalah penyederhanaan untuk simulasi; istilah memakai definisi kerja mata kuliah.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Journey to-be</span><span>Tekan Play atau klik tiap tahap</span></div><h2>Bu Aminah berpindah saluran tanpa mengulang</h2><div class=\"sim sim-stepper\" data-sim=\"stepper\" data-cfg=\"{&quot;id&quot;:&quot;td7-journey&quot;,&quot;ms&quot;:3400,&quot;steps&quot;:[{&quot;t&quot;:&quot;Mencari info&quot;,&quot;en&quot;:&quot;Instagram → situs&quot;,&quot;d&quot;:&quot;Unggahan Instagram pondok menautkan ke halaman pendaftaran di situs. Biaya dan syarat sama di semua saluran karena diambil dari satu sumber.&quot;,&quot;ex&quot;:&quot;Titik masalah as-is \\&quot;biaya berbeda antara brosur dan alumni\\&quot; hilang.&quot;},{&quot;t&quot;:&quot;Mendaftar&quot;,&quot;en&quot;:&quot;ponsel → laptop&quot;,&quot;d&quot;:&quot;Bu Aminah mulai mengisi formulir daring di ponsel, berhenti, lalu melanjutkan di laptop anaknya. Isian tersimpan sebagai draf.&quot;,&quot;ex&quot;:&quot;Tidak perlu datang ke kantor dan tidak mengisi ulang dari awal.&quot;},{&quot;t&quot;:&quot;Membayar&quot;,&quot;en&quot;:&quot;QRIS&quot;,&quot;d&quot;:&quot;Pembayaran lewat QRIS atau virtual account langsung tercatat pada data pendaftar. Tidak perlu mengirim foto bukti ke nomor lain.&quot;,&quot;ex&quot;:&quot;Bendahara melihat status \\&quot;lunas\\&quot; di dasbor yang sama dengan petugas TU.&quot;},{&quot;t&quot;:&quot;Menunggu&quot;,&quot;en&quot;:&quot;self-service + WA&quot;,&quot;d&quot;:&quot;Status pendaftaran dapat dicek sendiri di situs, dan notifikasi dikirim lewat WA. Bila Bu Aminah bertanya lewat WA, admin melihat status yang sama.&quot;,&quot;ex&quot;:&quot;Pertanyaan selesai di kontak pertama, tanpa \\&quot;nanti saya tanyakan ke TU\\&quot;.&quot;},{&quot;t&quot;:&quot;Diterima&quot;,&quot;en&quot;:&quot;WA → loket&quot;,&quot;d&quot;:&quot;Surat penerimaan PDF dikirim lewat WA. Saat daftar ulang di loket, petugas membuka data yang sama sehingga Bu Aminah tidak mengisi formulir lagi.&quot;,&quot;ex&quot;:&quot;Loket tetap ada untuk wali yang membutuhkan bantuan.&quot;}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.5em\">Kasus ilustrasi lanjutan Pertemuan 6 (persona dan alur rekaan dosen).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Mengukur</span><span>Indikator 2 dan 3</span></div><h2>Bukti bahwa pengalaman membaik</h2>\n   <div class=\"tw\"><table class=\"t\"><thead><tr><th>Ukuran</th><th>Menjawab titik masalah</th><th>Cara mengumpulkan</th></tr></thead><tbody>\n   <tr><td><b>Berapa kali data diisi ulang</b></td><td>mengulang cerita</td><td>hitung dari journey dan swimlane</td></tr>\n   <tr><td><b>Kedatangan fisik per urusan</b></td><td>harus datang berkali-kali</td><td>wawancara 3–5 pelanggan</td></tr>\n   <tr><td><b>Waktu menunggu jawaban atau status</b></td><td>tidak tahu status</td><td>catatan chat WA, buku tamu</td></tr>\n   <tr><td><b>Urusan selesai di kontak pertama</b></td><td>dilempar antarpetugas</td><td>catat 1 minggu: selesai atau dirujuk</td></tr>\n   <tr><td><b>Keluhan per bulan</b></td><td>kekesalan umum</td><td>kotak saran, ulasan, chat</td></tr></tbody></table></div>\n   <p class=\"muted\" style=\"font-size:.85em;margin-top:.5em\">Pilih ukuran yang sesuai titik masalah mitra Anda. Ukuran dan cara di tabel adalah saran dosen.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Presentasi Tugas 1</span><span>Indikator 4 · urutan dan durasi diumumkan dosen</span></div><h2>Alur presentasi kelompok</h2>\n   <div class=\"cols w\"><ol style=\"font-size:.95em\"><li><b>Mitra</b>: profil singkat dan alasan memilih.</li><li><b>Bagian A</b>: teknologi digital dan nilai bisnisnya.</li><li><b>Bagian B</b>: BMC dan proposisi nilai digital.</li><li><b>Bagian C</b>: swimlane as-is dan to-be, ukuran perbedaannya.</li><li><b>Customer journey</b>: persona, titik masalah, dan buktinya; termasuk perpindahan saluran.</li><li><b>Usulan dan manfaat</b>: urutan perbaikan, ukuran, risiko.</li><li><b>Kesimpulan terpadu</b>: teknologi, model bisnis, dan proses saling terkait.</li></ol>\n   <div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"2\" width=\"6\" height=\"12\" rx=\"3\"/><path d=\"M19 10v2a7 7 0 0 1-14 0v-2M12 19v3\"/></svg>Supaya jelas</h3><ul><li>Maks. 10 slide; satu gagasan per slide.</li><li>Tampilkan diagram, jangan membacakan teks.</li><li>Setiap anggota berbicara.</li><li>Sebut sumber data: wawancara, observasi, dokumen.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pengatur waktu</span><span>Ditampilkan di layar selama presentasi</span></div><h2>Waktu presentasi</h2><div class=\"sim sim-timer\" data-sim=\"timer\" data-cfg=\"{&quot;id&quot;:&quot;td7-waktu&quot;,&quot;presets&quot;:[[5,&quot;5 menit&quot;],[7,&quot;7 menit&quot;],[10,&quot;10 menit&quot;]],&quot;qa&quot;:3,&quot;groupLabel&quot;:&quot;Kelompok&quot;,&quot;talkLabel&quot;:&quot;Presentasi&quot;,&quot;qaLabel&quot;:&quot;Tanya jawab&quot;,&quot;hint&quot;:&quot;Pilih durasi, tekan Start. Layar berubah warna pada menit terakhir dan saat waktu habis. Tombol ← → di atas angka mengganti nomor kelompok.&quot;}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.6em\">Selama presentasi, kelompok lain mengisi penilaian sejawat di slide berikutnya lewat ponsel.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Tanya jawab</span><span>Setiap kelompok bertanya minimal satu kali</span></div><h2>Pertanyaan pemandu untuk penanya</h2>\n   <div class=\"grid3\"><div class=\"card\"><h3>As-is</h3><p>Dari mana kalian tahu proses berjalan seperti itu? Siapa yang diwawancarai?</p></div>\n   <div class=\"card\"><h3>Titik masalah</h3><p>Apa bukti titik masalah ini? Di tahap journey mana pelanggan paling kesal?</p></div>\n   <div class=\"card\"><h3>Saluran</h3><p>Bila pelanggan pindah saluran, apakah datanya ikut, atau ia harus mengulang?</p></div>\n   <div class=\"card\"><h3>Usulan</h3><p>Mengapa usulan ini didahulukan? Langkah apa yang dihapus sebelum didigitalkan?</p></div>\n   <div class=\"card\"><h3>Manfaat dan risiko</h3><p>Ukuran apa yang membuktikan manfaatnya? Siapa yang bisa tertinggal?</p></div>\n   <div class=\"card\"><h3>Keterkaitan</h3><p>Bagaimana usulan ini mengubah BMC atau teknologi yang dipakai mitra?</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Penilaian sejawat</span><span>Formatif · tidak masuk nilai</span></div><h2>Nilai presentasi kelompok lain</h2><div class=\"sim sim-peer\" data-sim=\"peer\" data-cfg=\"{&quot;id&quot;:&quot;td7-sejawat&quot;,&quot;title&quot;:&quot;Penilaian sejawat · Presentasi Tugas 1 (Transformasi Digital P7)&quot;,&quot;levels&quot;:[&quot;Belum tampak&quot;,&quot;Mulai tampak&quot;,&quot;Tampak&quot;,&quot;Menonjol&quot;],&quot;pick&quot;:&quot;Pilih level 1–4.&quot;,&quot;whoLabel&quot;:&quot;Kelompok yang dinilai (nama/mitra)&quot;,&quot;whoPh&quot;:&quot;mis. Kelompok 3 · Toko kue&quot;,&quot;goodLabel&quot;:&quot;Yang sudah baik&quot;,&quot;goodPh&quot;:&quot;Satu hal spesifik dari presentasi mereka&quot;,&quot;tipLabel&quot;:&quot;Saran perbaikan&quot;,&quot;tipPh&quot;:&quot;Bagian yang perlu diperbaiki sebelum laporan diunggah&quot;,&quot;bands&quot;:[{&quot;min&quot;:0,&quot;t&quot;:&quot;Perlu banyak perbaikan&quot;},{&quot;min&quot;:10,&quot;t&quot;:&quot;Berkembang&quot;},{&quot;min&quot;:14,&quot;t&quot;:&quot;Baik&quot;},{&quot;min&quot;:18,&quot;t&quot;:&quot;Sangat baik&quot;}],&quot;criteria&quot;:[{&quot;t&quot;:&quot;Proses as-is dan to-be&quot;,&quot;ind&quot;:&quot;Indikator 1&quot;,&quot;d&quot;:[&quot;Diagram tidak ditampilkan atau tidak terbaca.&quot;,&quot;Diagram ada, tetapi perbedaan as-is dan to-be tidak dijelaskan.&quot;,&quot;Perbedaan as-is dan to-be jelas.&quot;,&quot;Perbedaan jelas dan diukur (langkah, kedatangan, entri data).&quot;]},{&quot;t&quot;:&quot;Journey dan titik masalah&quot;,&quot;ind&quot;:&quot;Indikator 2&quot;,&quot;d&quot;:[&quot;Journey tidak ada atau titik masalah umum.&quot;,&quot;Titik masalah ada, tetapi tidak terkait tahap.&quot;,&quot;Titik masalah tepat pada tahapnya.&quot;,&quot;Tepat, berbukti, dan memperhatikan perpindahan saluran.&quot;]},{&quot;t&quot;:&quot;Usulan digitalisasi dan manfaat&quot;,&quot;ind&quot;:&quot;Indikator 3&quot;,&quot;d&quot;:[&quot;Usulan tidak menjawab titik masalah.&quot;,&quot;Usulan menyebut teknologi tanpa alasan.&quot;,&quot;Usulan menjawab titik masalah; manfaat disebut.&quot;,&quot;Usulan berurutan, manfaat terukur, risiko dibahas.&quot;]},{&quot;t&quot;:&quot;Alur dan kejelasan slide&quot;,&quot;ind&quot;:&quot;Indikator 4&quot;,&quot;d&quot;:[&quot;Slide padat teks dan sulit diikuti.&quot;,&quot;Alur ada, tetapi beberapa slide membingungkan.&quot;,&quot;Alur runtut dan slide mudah dibaca.&quot;,&quot;Runtut, diagram dipakai efektif, dan sumber disebut.&quot;]},{&quot;t&quot;:&quot;Penyampaian dan tanya jawab&quot;,&quot;ind&quot;:&quot;Indikator 4&quot;,&quot;d&quot;:[&quot;Membaca slide; pertanyaan tidak terjawab.&quot;,&quot;Sebagian anggota berbicara; jawaban kurang tepat.&quot;,&quot;Semua anggota berbicara; jawaban tepat.&quot;,&quot;Penyampaian lancar, tepat waktu, dan jawaban berbukti.&quot;]}]}\"><p class=\"muted\">Loading…</p></div><p class=\"muted\" style=\"font-size:.78em;margin-top:.5em\">Isian hanya tersimpan di perangkat Anda. Tekan Copy summary, kirim ke kelompok yang dinilai, lalu Clear untuk kelompok berikutnya.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span><span>Blok Pertemuan 6–7</span></div><h2>Poin-poin kunci</h2>\n   <ul class=\"lead\"><li>Proses dilihat dari <b>dalam</b> (swimlane as-is dan to-be) dan dari <b>luar</b> (customer journey map).</li><li>Titik masalah sering muncul di <b>perpindahan saluran</b>; banyak saluran yang tersekat menambah masalah.</li><li><b>Omnichannel</b>: semua saluran terhubung ke satu data pelanggan, sehingga pelanggan tidak mengulang. Loket tetap boleh ada.</li><li>Usulan digitalisasi menjawab titik masalah yang <b>berbukti</b>, berurutan (hapus, sederhanakan, digitalkan, otomasikan), dan diukur.</li><li>Presentasi yang baik menunjukkan <b>analisis</b>: diagram, bukti, ukuran, dan alasan.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>5 soal · satu per satu · formatif</span></div><h2>Kuis singkat</h2><div class=\"sim sim-quizset\" data-sim=\"quizset\" data-cfg=\"{&quot;id&quot;:&quot;td7-kuis&quot;,&quot;items&quot;:[{&quot;q&quot;:&quot;Pelanggan bertanya lewat WA, lalu datang ke loket dan harus menjelaskan ulang dari awal. Ini ciri layanan…&quot;,&quot;o&quot;:[&quot;omnichannel&quot;,&quot;multichannel dengan saluran yang tersekat&quot;,&quot;saluran tunggal&quot;,&quot;self-service penuh&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Ada lebih dari satu saluran, tetapi datanya tidak ikut berpindah sehingga pelanggan mengulang.&quot;},{&quot;q&quot;:&quot;Inti layanan omnichannel adalah…&quot;,&quot;o&quot;:[&quot;membuka saluran sebanyak mungkin&quot;,&quot;memindahkan semua layanan ke aplikasi seluler&quot;,&quot;menghubungkan saluran sehingga data dan riwayat pelanggan ikut berpindah&quot;,&quot;menutup layanan tatap muka&quot;],&quot;a&quot;:2,&quot;why&quot;:&quot;Ukurannya keterpaduan, bukan jumlah saluran. Loket tetap boleh ada bila melihat data yang sama.&quot;},{&quot;q&quot;:&quot;Pada customer journey map, titik masalah sebaiknya…&quot;,&quot;o&quot;:[&quot;ditaruh pada tahap tempat terjadinya dan didukung bukti&quot;,&quot;ditulis di akhir laporan saja&quot;,&quot;ditebak dari pengalaman pribadi anggota kelompok&quot;,&quot;diwakili satu angka kepuasan&quot;],&quot;a&quot;:0,&quot;why&quot;:&quot;Titik masalah harus jelas letaknya di journey dan berbukti (wawancara, observasi, keluhan).&quot;},{&quot;q&quot;:&quot;Untuk masalah \\&quot;pelanggan mengisi data yang sama berulang kali\\&quot;, ukuran manfaat yang paling tepat adalah…&quot;,&quot;o&quot;:[&quot;jumlah pengikut Instagram&quot;,&quot;berapa kali pelanggan memasukkan data yang sama&quot;,&quot;jumlah fitur aplikasi&quot;,&quot;lama rapat staf&quot;],&quot;a&quot;:1,&quot;why&quot;:&quot;Ukuran harus langsung menjawab titik masalah yang diperbaiki.&quot;},{&quot;q&quot;:&quot;Pondok kecil yang walinya aktif di WA berencana membuat aplikasi seluler sendiri. Sikap analis yang tepat adalah…&quot;,&quot;o&quot;:[&quot;langsung setuju karena aplikasi selalu quick win&quot;,&quot;menolak semua digitalisasi&quot;,&quot;setuju karena omnichannel wajib memakai aplikasi&quot;,&quot;menimbang dampak dan kemudahannya; mungkin cukup memadukan WA dengan formulir daring&quot;],&quot;a&quot;:3,&quot;why&quot;:&quot;Usulan harus menjawab titik masalah dan realistis; saluran yang sudah dipakai pelanggan sering lebih tepat.&quot;}]}\"><p class=\"muted\">Loading…</p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit</span></div><h2>Unggah Tugas 1B, lalu siapkan UTS</h2>\n   <div class=\"cols w\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Tugas 1B (10%)</h3><ul><li>Perbaiki laporan dari umpan balik dosen dan sejawat hari ini.</li><li>Unggah <b>laporan akhir</b> (PDF, maks. 15 halaman) dan <b>slide</b> (PDF atau PPTX) di Elin.</li><li>Tenggat: <b>hari ini, Senin, 2 November 2026, 23.59 WIB</b>.</li></ul></div>\n   <div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>UTS · Pertemuan 8</h3><p>Tes Tulis 2×50 menit, materi Pertemuan 1–7 (Sub-CPMK-1 sampai Sub-CPMK-4). Kisi-kisi diumumkan di kelas.</p><p>Belajar mandiri: ulang rangkuman dan kuis tiap pertemuan, latih membaca swimlane dan customer journey.</p></div></div>\n   <p class=\"muted\" style=\"margin-top:.4em;font-size:.9em\">Rincian dan rubrik Tugas 1B ada di halaman tugas Elin.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Customer experience</span></dt><dd>Keseluruhan pengalaman pelanggan saat berinteraksi dengan organisasi di semua titik kontak. <i>(pengalaman pelanggan)</i></dd></div><div><dt><span class=\"en\">Touchpoint</span></dt><dd>Titik tempat pelanggan bersentuhan dengan organisasi, misalnya loket, aplikasi, WhatsApp, atau brosur. <i>(titik sentuh)</i></dd></div><div><dt><span class=\"en\">Customer journey map</span></dt><dd>Peta yang menggambarkan tahapan yang dilalui pelanggan saat berinteraksi dengan organisasi, beserta tindakan, titik sentuh, dan perasaannya. <i>(peta perjalanan pelanggan)</i></dd></div><div><dt><span class=\"en\">Persona</span></dt><dd>Tokoh rekaan yang mewakili satu kelompok pelanggan, disusun dari data wawancara dan observasi. <i>(persona pelanggan)</i></dd></div><div><dt><span class=\"en\">Pain point</span></dt><dd>Titik dalam proses atau pengalaman pelanggan yang menimbulkan kesulitan, kekesalan, atau pemborosan. <i>(titik masalah)</i></dd></div><div><dt><span class=\"en\">Multichannel</span></dt><dd>Organisasi melayani lewat beberapa saluran, tetapi tiap saluran berjalan sendiri dengan data dan aturannya masing-masing. <i>(layanan banyak saluran)</i></dd></div><div><dt><span class=\"en\">Cross-channel</span></dt><dd>Beberapa saluran mulai saling terhubung (mis. pesan daring, ambil di loket), tetapi data dan riwayat pelanggan belum sepenuhnya menyatu. <i>(layanan lintas saluran)</i></dd></div><div><dt><span class=\"en\">Omnichannel</span></dt><dd>Semua saluran terpadu sehingga pelanggan dapat berpindah saluran tanpa mengulang; data, status, dan riwayatnya ikut berpindah. <i>(layanan saluran terpadu)</i></dd></div><div><dt><span class=\"en\">Channel silo</span></dt><dd>Saluran yang berdiri sendiri dan tidak berbagi data dengan saluran lain. <i>(sekat antarsaluran)</i></dd></div><div><dt><span class=\"en\">Single customer view</span></dt><dd>Satu tampilan data pelanggan yang sama dan dapat dilihat petugas di saluran mana pun. <i>(pandangan tunggal pelanggan)</i></dd></div><div><dt><span class=\"en\">Channel switching</span></dt><dd>Perpindahan pelanggan dari satu saluran ke saluran lain dalam satu urusan yang sama. <i>(perpindahan saluran)</i></dd></div><div><dt><span class=\"en\">Self-service</span></dt><dd>Layanan yang dapat diselesaikan pelanggan sendiri tanpa menunggu petugas, mis. cek status atau unduh surat. <i>(layanan mandiri)</i></dd></div><div><dt><span class=\"en\">First contact resolution</span></dt><dd>Urusan pelanggan selesai pada kontak pertama tanpa dilempar ke saluran atau petugas lain. <i>(selesai di kontak pertama)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Westerman, G., Bonnet, D., &amp; McAfee, A. (2014). <i>Leading digital: Turning technology into business transformation</i>. Harvard Business Review Press.</li><li>Rogers, D. L. (2016). <i>The digital transformation playbook: Rethink your business for the digital age</i>. Columbia Business School Publishing.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 8 (UTS).</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":8,"title":"Ujian Tengah Semester (UTS)","subtitle":"Materi Pertemuan 1–7 · Sub-CPMK-1 s.d. Sub-CPMK-4","status":"exam","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag exam pill\">Exam</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 8</span></div><h1>Ujian Tengah Semester (UTS)</h1><p class=\"lead\">Materi Pertemuan 1–7 · Sub-CPMK-1 s.d. Sub-CPMK-4</p><p class=\"muted\" style=\"margin-top:1em\">Ujian tertulis (Tes Tulis), 2×50 menit. Kisi-kisi ujian diumumkan di kelas.</p></div>"}]},{"no":9,"title":"Kematangan Digital (1)","subtitle":"Konsep kematangan digital, digital capability dan leadership capability, model kematangan","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 9</span><span>Sub-CPMK-5 (Pertemuan 9–10) · CPMK-2 · CPL-4</span></div><h1>Kematangan Digital (1)</h1><p class=\"lead\">Konsep kematangan digital, digital capability dan leadership capability, model kematangan</p><div class=\"callout\" style=\"margin-top:1.2em\" /* ============ RUNTIME (UI in English; content in Indonesian) ============ */
(function(){
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(COURSE.key+':'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(COURSE.key+':'+k,JSON.stringify(v));}catch(e){}}};
const sess={get(k){try{return sessionStorage.getItem(COURSE.key+':'+k);}catch(e){return null;}},set(k,v){try{sessionStorage.setItem(COURSE.key+':'+k,v);}catch(e){}},del(k){try{sessionStorage.removeItem(COURSE.key+':'+k);}catch(e){}}};
const st={m:0,s:0,mode:store.get('mode','slide'),notes:false};
const root=document.documentElement;
const savedTheme=store.get('theme',null); if(savedTheme) root.setAttribute('data-theme',savedTheme);
MEETINGS.forEach(m=>m.slides.forEach(s=>{s.html=s.html.split('__LOGO__').join(LOGO);}));

/* ---------- Encrypted lecturer notes ---------- */
let NOTES=null; // {meetingNo:[html per slide]} after unlock
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptNotes(pw){
  if(!(window.crypto&&crypto.subtle)) throw new Error('nocrypto');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(NOTES_ENC.salt),iterations:NOTES_ENC.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(NOTES_ENC.iv)},key,b64(NOTES_ENC.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
function noteOf(i){const a=NOTES&&NOTES[MEETINGS[st.m].no];return a&&a[i]?a[i]:'';}
function notesBox(i){
  if(!st.notes) return '';
  const n=noteOf(i);
  return '<div class="notes"><div class="nhead"><h4>Lecturer Note</h4><button class="lockb" type="button" data-lock="1">'+ic('lock','')+'Lock</button></div>'+(n||'<p class="muted" style="margin:0">No note for this slide.</p>')+'</div>';
}
function openUnlock(){
  const d=$('#unlock'); d.hidden=false; $('#pw').value=''; $('#pwErr').textContent=''; setTimeout(()=>$('#pw').focus(),30);
}
function closeUnlock(){ $('#unlock').hidden=true; }
async function tryUnlock(pw, silent){
  const btn=$('#pwGo'); if(!silent){btn.disabled=true; btn.textContent='Checking…';}
  try{ NOTES=await decryptNotes(pw); sess.set('pw',pw); if(!silent) st.notes=true; closeUnlock(); render(); return true; }
  catch(e){ if(!silent) $('#pwErr').textContent=e.message==='nocrypto'?'This browser cannot decrypt notes. Open the page over https in a modern browser.':'Wrong password. Please try again.'; if(silent) sess.del('pw'); return false; }
  finally{ if(!silent){btn.disabled=false; btn.textContent='Unlock';} }
}
function toggleNotes(){
  if(st.notes){st.notes=false;render();return;}
  if(NOTES){st.notes=true;render();return;}
  openUnlock();
}
function lockNotes(){NOTES=null;st.notes=false;sess.del('pw');render();}

/* ---------- Sidebar ---------- */
function buildSide(){
  const ul=$('#mlist'); ul.innerHTML='';
  MEETINGS.forEach((m,i)=>{
    const li=document.createElement('li');
    const tag=m.status==='exam'?'<span class="tag exam">Exam</span>':(m.status==='soon'?'<span class="tag soon">Soon</span>':'');
    li.innerHTML='<button class="mbtn '+(m.status==='soon'?'soon':'')+'" data-i="'+i+'"><span class="no">'+String(m.no).padStart(2,'0')+'</span><span class="t">'+m.title+'</span>'+tag+'</button>';
    ul.appendChild(li);
  });
  ul.addEventListener('click',e=>{const b=e.target.closest('.mbtn');if(!b)return;go(+b.dataset.i,0);if(window.matchMedia('(max-width:900px)').matches)toggleMenu(false);});
}
function markSide(){document.querySelectorAll('.mbtn').forEach(b=>b.setAttribute('aria-current',+b.dataset.i===st.m?'true':'false'));}

/* ---------- Render ---------- */
let SL=[];
function render(){
  const m=MEETINGS[st.m]; SL=m.slides;
  if(st.s>=SL.length) st.s=SL.length-1; if(st.s<0) st.s=0;
  $('#ttl').innerHTML='Meeting '+m.no+' · '+m.title+'<small>'+m.subtitle+'</small>';
  $('#bMode1').setAttribute('aria-pressed',st.mode==='slide'); $('#bMode2').setAttribute('aria-pressed',st.mode==='read');
  $('#bNotes').setAttribute('aria-pressed',st.notes);
  $('#bNotes').innerHTML=ic(NOTES?'note':'lock','')+'<span class="lbl">Note</span>';
  const v=$('#view'); stopClosing();
  if(st.mode==='slide'){
    const sl=SL[st.s];
    const slideHTML='<section class="slide '+sl.cls+'" aria-label="Slide '+(st.s+1)+'">'+sl.html+'</section>';
    const restHTML='<div class="ctrl"><button class="ibtn" id="prev" aria-label="Previous slide">'+ic('left','')+'</button><span class="count">'+(st.s+1)+' / '+SL.length+'</span><button class="ibtn" id="next" aria-label="Next slide">'+ic('right','')+'</button><div class="bar"><i style="width:'+((st.s+1)/SL.length*100)+'%"></i></div><button class="ibtn" id="fs">'+ic('full','')+'<span class="lbl">Full Screen</span></button></div>'+
      '<p class="hint">Keys: ← → next/previous slide · F full screen · N note · R read mode · T theme</p>'+notesBox(st.s);
    /* Full screen: keep the same #stage element so the browser stays in full screen; only swap its content */
    const fsEl=document.fullscreenElement;
    if(fsEl&&fsEl.id==='stage'&&fsEl.parentNode===v){
      fsEl.innerHTML=slideHTML;
      Array.from(v.children).forEach(c=>{if(c!==fsEl)c.remove();});
      fsEl.insertAdjacentHTML('afterend',restHTML);
    } else {
      v.innerHTML='<div class="stage" id="stage">'+slideHTML+'</div>'+restHTML;
    }
    $('#prev').onclick=()=>step(-1); $('#next').onclick=()=>step(1);
    $('#fs').onclick=()=>{const el=$('#stage');try{if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});}catch(e){}};
  } else {
    v.innerHTML='<div class="read">'+SL.map((sl,i)=>'<section class="slide '+sl.cls+'" id="s'+(i+1)+'">'+sl.html+'</section>'+notesBox(i)).join('')+'</div>';
  }
  mountW(v); startClosing(v); markSide(); setHash();
}
function step(d){
  const n=st.s+d;
  if(n<0){ if(st.m>0){st.m--;st.s=999;} else return; }
  else if(n>=SL.length){ if(st.m<MEETINGS.length-1){st.m++;st.s=0;} else return; }
  else st.s=n;
  render();
}
function go(m,s){st.m=m;st.s=s;render();window.scrollTo(0,0);}
function setHash(){const h='#p'+MEETINGS[st.m].no+(st.mode==='slide'&&st.s>0?'-'+(st.s+1):'');if(location.hash!==h){try{history.replaceState(null,'',h);}catch(e){}}}
function readHash(){const r=/^#p(\d+)(?:-(\d+))?$/.exec(location.hash||'');if(!r)return;const i=MEETINGS.findIndex(x=>x.no===+r[1]);if(i>=0){st.m=i;st.s=r[2]?+r[2]-1:0;}}

/* ---------- Closing slide: quotes + emoji ---------- */

function stopClosing(){if(qTimer){clearInterval(qTimer);qTimer=null;}}
function startClosing(scope){

  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const E=['🎓','📚','💬','🗣️','✨','👏','🙌','💡','🤝','😊','🌟','📝'];

}

/* ---------- Term pop-up ---------- */

let tipFor=null;
function showTip(el){const g=GLOSSARY[el.dataset.term]; if(!g) return; tip.innerHTML='<b>'+g.t+'</b>'+g.d+'<i>Indonesian: '+g.id+'</i>'; tip.hidden=false; tipFor=el;
  const r=el.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;

function hideTip(){tip.hidden=true;tipFor=null;}
document.addEventListener('mouseover',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('mouseout',e=>{const t=e.target.closest('.term');if(t&&!t.contains(e.relatedTarget))hideTip();});
