<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transformasi Digital · SI Unusida</title>
<meta name="description" content="Materi perkuliahan Transformasi Digital (SI24W15), Program Studi Sistem Informasi, Universitas Nahdlatul Ulama Sidoarjo.">
<link rel="icon" type="image/png" href="https://hurufa.github.io/assets/favicon.png">
<link rel="apple-touch-icon" href="https://hurufa.github.io/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,700&family=Darker+Grotesque:wght@700;800;900&family=JetBrains+Mono:wght@500;600;700&family=Amiri:wght@400;700&display=swap">
<style>
:root{
  --bg:#F5F7F8; --surface:#FFFFFF; --surface-2:#ECF0EF; --ink:#2C2E31; --ink-2:#45474B; --muted:#646A6F;
  --line:#D9DFDD; --primary:#495E57; --primary-ink:#FFFFFF; --primary-soft:#E3EBE8;
  --accent:#F4CE14; --accent-soft:#FCF3C4; --accent-ink:#2C2E31;
  --green:#0F7A45; --warn:#C2410C; --warn-soft:#FDE9DD; --ok:#2E7D4F; --ok-soft:#E1F2E7; --bad:#B42318; --bad-soft:#FBE4E1;
  --shadow:0 1px 2px rgba(35,45,40,.06),0 8px 24px rgba(35,45,40,.08);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --side:288px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1B1E20; --surface:#24282A; --surface-2:#2C3133; --ink:#ECEFEE; --ink-2:#D3D8D6; --muted:#A3AAA7;
    --line:#3A4043; --primary:#9DBFB2; --primary-ink:#15201C; --primary-soft:#2C3934;
    --accent:#F4CE14; --accent-soft:#3F3818; --accent-ink:#1B1E20;
    --green:#5CC08A; --warn:#FF9A5C; --warn-soft:#46291A; --ok:#6FD39A; --ok-soft:#1E3A2A; --bad:#FF8A80; --bad-soft:#45221F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1B1E20; --surface:#24282A; --surface-2:#2C3133; --ink:#ECEFEE; --ink-2:#D3D8D6; --muted:#A3AAA7;
  --line:#3A4043; --primary:#9DBFB2; --primary-ink:#15201C; --primary-soft:#2C3934;
  --accent:#F4CE14; --accent-soft:#3F3818; --accent-ink:#1B1E20;
  --green:#5CC08A; --warn:#FF9A5C; --warn-soft:#46291A; --ok:#6FD39A; --ok-soft:#1E3A2A; --bad:#FF8A80; --bad-soft:#45221F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink-2);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100%}
.app.collapsed{grid-template-columns:0 1fr}

/* Sidebar */
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:transform .2s ease}
.app.collapsed .side{transform:translateX(-100%);visibility:hidden}
.brand{display:flex;gap:12px;align-items:center;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand img{width:44px;height:auto;flex:none}
.brand b{display:block;color:var(--ink);font-size:15px;line-height:1.25}
.brand span{font-size:12px;color:var(--muted)}
.side h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 18px 6px;font-weight:700}
.mlist{list-style:none;margin:0;padding:0 10px 18px;display:grid;gap:2px}
.mbtn{width:100%;display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:8px 8px;border-radius:10px;cursor:pointer}
.mbtn:hover{background:var(--surface-2)}
.mbtn[aria-current="true"]{background:var(--primary-soft)}
.mbtn .no{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--primary);background:var(--surface-2);border-radius:7px;text-align:center;padding:3px 0}
.mbtn[aria-current="true"] .no{background:var(--primary);color:var(--primary-ink)}
.mbtn .t{font-size:13.5px;line-height:1.3;color:var(--ink)}
.mbtn.soon .t{color:var(--muted)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;white-space:nowrap}
.tag.soon{background:var(--surface-2);color:var(--muted)}
.tag.exam{background:var(--warn-soft);color:var(--warn)}
.tag.new{background:var(--accent);color:var(--accent-ink)}
.side .foot{margin-top:auto;padding:14px 18px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}

/* Top bar */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .title{flex:1;min-width:160px;font-weight:700;color:var(--ink);font-size:15px;line-height:1.3}
.top .title small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.ibtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.ibtn:hover{border-color:var(--primary)}
.ibtn[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.ibtn svg{width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.seg svg{width:16px;height:16px}

/* Slide mode */
.view{padding:20px 16px 40px;width:100%;max-width:1320px;margin:0 auto}
.stage{container-type:inline-size;position:relative;width:100%;aspect-ratio:16/9;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.stage .slide{position:absolute;inset:0;overflow:auto;font-size:clamp(9px,1.55cqw,30px)}
.ctrl{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.ctrl .count{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:64px;text-align:center}
.bar{flex:1;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .25s}
.hint{font-size:12px;color:var(--muted)}
.notes{margin-top:14px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:12px;padding:12px 16px;color:var(--ink)}
.notes h4{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.notes p,.notes li{margin:.25em 0;font-size:14.5px}
.notes ul{margin:.2em 0;padding-left:1.2em}
:fullscreen .stage, .stage:fullscreen{border-radius:0;border:0}
.stage:fullscreen{background:var(--surface)}

/* Read mode */
.read{max-width:880px;margin:0 auto;display:grid;gap:18px}
.read .slide{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;font-size:16.5px}
.read .notes{margin-top:-8px}

/* Slide content */
.slide{padding:2.6em 3.4em;color:var(--ink-2)}
.slide h1,.slide h2{color:var(--ink);line-height:1.15;text-wrap:balance;margin:0 0 .55em;letter-spacing:-.01em}
.slide h2{font-size:2em;font-weight:800}
.slide h1{font-size:2.9em;font-weight:800}
.slide h3{color:var(--ink);font-size:1.15em;margin:0 0 .35em}
.slide p{margin:.35em 0}
.slide ul,.slide ol{margin:.3em 0;padding-left:1.25em}
.slide li{margin:.32em 0}
.slide li::marker{color:var(--primary);font-weight:700}
.eyebrow{font-family:var(--mono);font-size:.78em;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin-bottom:.6em;display:flex;gap:.6em;align-items:center;flex-wrap:wrap}
.eyebrow .chip{background:var(--primary-soft);padding:.15em .6em;border-radius:99px}
.lead{font-size:1.2em;color:var(--ink)}
.muted{color:var(--muted)}
.id{color:var(--muted);font-style:italic}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.4em;align-items:start}
.cols.c3{grid-template-columns:repeat(3,1fr)}
.cols.w{grid-template-columns:1.25fr 1fr}
.card{background:var(--surface-2);border-radius:.8em;padding:.9em 1.1em}
.card h3{display:flex;gap:.45em;align-items:center}
.card p{font-size:.95em}
.card.hl{background:var(--accent-soft)}
.card.warn{background:var(--warn-soft)}
.card.warn h3{color:var(--warn)}
.card.ok{background:var(--ok-soft)}
.ic{width:1.3em;height:1.3em;flex:none;color:var(--primary)}
.warn .ic{color:var(--warn)}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:.8em}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:.8em}
.big{font-size:1.5em;font-weight:800;color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.35em 1em;align-items:baseline}
.kv dt{font-family:var(--mono);font-size:.8em;font-weight:600;color:var(--primary);white-space:nowrap}
.kv dd{margin:0}
.callout{border-left:.3em solid var(--accent);background:var(--accent-soft);padding:.7em 1em;border-radius:0 .6em .6em 0;color:var(--ink)}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.quote{font-size:1.25em;font-weight:600;color:var(--ink);line-height:1.4}
table.t{border-collapse:collapse;width:100%;font-size:.95em}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:.45em .6em;text-align:left;vertical-align:top}
table.t th{color:var(--ink);font-size:.85em;text-transform:uppercase;letter-spacing:.04em}
.tw{overflow-x:auto}
.phrase{font-family:var(--mono);font-size:.88em;background:var(--surface-2);padding:.1em .45em;border-radius:.35em;color:var(--ink)}

/* Title slide */
.cover{display:flex;flex-direction:column;justify-content:center;height:100%;gap:.3em;background:
  radial-gradient(60em 30em at 110% -10%,var(--primary-soft),transparent 60%),
  linear-gradient(transparent 0 0)}
.cover .logo{width:5.2em;margin-bottom:1em}
.cover .meta{margin-top:1.6em;display:flex;gap:2.2em;flex-wrap:wrap;font-size:.9em}
.cover .meta b{display:block;color:var(--ink)}
.cover .strip{position:absolute;left:0;right:0;bottom:0;height:.55em;background:linear-gradient(90deg,var(--primary) 0 60%,var(--accent) 60% 100%)}
.read .cover{min-height:26em;position:relative}

/* Figures */
figure.fig{margin:.6em 0 0}
figure.fig svg{width:100%;height:auto;max-height:17em;display:block;color:var(--ink)}
figure.fig figcaption{font-size:.82em;color:var(--muted);margin-top:.4em}
.s-box{fill:var(--surface);stroke:var(--primary);stroke-width:2}
.s-soft{fill:var(--primary-soft);stroke:var(--primary);stroke-width:2}
.s-acc{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.s-hl{fill:var(--accent);stroke:none}
.s-warn{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2}
.s-line{stroke:currentColor;stroke-width:2;fill:none}
.s-dash{stroke:var(--muted);stroke-width:1.6;stroke-dasharray:6 6;fill:none}
.s-warnline{stroke:var(--warn);stroke-width:2.2;fill:none}
.s-t{fill:currentColor;font-family:var(--font);font-size:15px;font-weight:700}
.s-s{fill:var(--muted);font-family:var(--font);font-size:12.5px;font-weight:500}
.s-tw{fill:var(--warn);font-family:var(--font);font-size:13px;font-weight:700}
.s-ta{fill:var(--accent-ink);font-family:var(--font);font-size:15px;font-weight:800}
.s-hd{fill:var(--primary);font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em}

/* Assessment bar */
.assess{display:flex;height:3.4em;border-radius:.6em;overflow:hidden;margin:.6em 0 .4em;font-size:.9em}
.assess div{display:flex;flex-direction:column;justify-content:center;padding:0 .8em;color:var(--primary-ink);min-width:0}
.assess div b{font-size:1.15em}
.assess .a1{background:var(--primary)}
.assess .a2{background:var(--accent);color:var(--accent-ink)}
.assess .a3{background:color-mix(in srgb,var(--primary) 70%,var(--ink))}
.assess .a4{background:var(--warn);color:#fff}
.weeks{display:grid;grid-template-columns:repeat(16,1fr);gap:.25em;margin-top:.8em}
.weeks span{font-family:var(--mono);font-size:.7em;text-align:center;padding:.35em 0;border-radius:.35em;background:var(--surface-2);color:var(--muted)}
.weeks span.ex{background:var(--warn-soft);color:var(--warn);font-weight:700}
.weeks span.on{background:var(--accent);color:var(--accent-ink);font-weight:700}

/* Chat mockup */
.chat{background:var(--surface-2);border-radius:.8em;padding:.8em;display:grid;gap:.45em;font-size:.92em}
.chat .who{font-size:.75em;color:var(--muted);font-weight:700}
.bub{max-width:88%;padding:.45em .7em;border-radius:.8em;background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.bub.me{justify-self:end;background:var(--primary-soft)}
.bub small{display:block;color:var(--muted);font-size:.72em;text-align:right}

/* Glossary term + tooltip */
.term{border-bottom:2px dotted var(--primary);cursor:help;color:inherit;font-weight:600;background:none;padding:0;border-top:0;border-left:0;border-right:0;font-size:inherit;line-height:inherit;font-family:inherit}
.tip{position:fixed;z-index:60;max-width:300px;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:10px;font-size:13.5px;line-height:1.45;box-shadow:var(--shadow);pointer-events:none}
.tip b{display:block;font-size:14px}
.tip i{display:block;color:var(--accent);font-style:normal;font-weight:700;font-size:12.5px;margin-top:4px}
.gl dt{font-weight:700;color:var(--ink)}
.gl dd{margin:0 0 .5em}
.gl dd i{color:var(--primary);font-style:normal;font-weight:600}
.gl{columns:2;column-gap:2em;font-size:.92em}
.gl div{break-inside:avoid}

/* Quiz */
.quiz{display:grid;gap:.5em;margin-bottom:.9em}
.quiz .q{font-weight:700;color:var(--ink);margin:0}
.quiz .opts{display:grid;grid-template-columns:1fr 1fr;gap:.4em}
.quiz button{border:1px solid var(--line);background:var(--surface);border-radius:.55em;padding:.45em .7em;text-align:left;cursor:pointer;font-size:.92em}
.quiz button:hover{border-color:var(--primary)}
.quiz button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.quiz button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.quiz .fb{font-size:.88em;margin:0;min-height:1.3em;color:var(--ink)}

/* Placeholder */
.soonbox{display:flex;flex-direction:column;justify-content:center;height:100%}
.soonbox .pill{align-self:flex-start;margin-bottom:1em}

/* Closing */
.closing{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden;background:radial-gradient(50em 26em at 50% 120%,var(--accent-soft),transparent 70%)}
.read .closing{min-height:24em}
.closing h1{font-size:3.6em;margin-bottom:.2em}
.closing .qwrap{max-width:34em;min-height:6.5em;position:relative;z-index:2}
.closing .qt{font-size:1.3em;font-weight:600;color:var(--ink);line-height:1.4;transition:opacity .5s}
.closing .qa{margin-top:.5em;color:var(--muted);font-size:.9em;transition:opacity .5s}
.closing .emo{position:absolute;inset:0;pointer-events:none;z-index:1}
.closing .emo span{position:absolute;bottom:-2em;font-size:1.8em;opacity:.8;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14em) translateX(1em) rotate(12deg)}100%{transform:translateY(-30em) translateX(-1em) rotate(-8deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.closing .emo span{animation:none;display:none}.side{transition:none}.bar i{transition:none}}

/* Menu button for phone */
.menu-t{display:none}
@media (max-width:900px){
  .app,.app.collapsed{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:50;transform:translateX(-100%);box-shadow:var(--shadow);visibility:hidden}
  .app.open .side{transform:none;visibility:visible}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
  .top .lbl{display:none}
  .slide{padding:1.8em 2em}
  .read .slide{padding:1.4em 1.2em}
  .cols,.cols.w,.cols.c3{grid-template-columns:1fr}
  .grid5,.grid4{grid-template-columns:1fr 1fr}
  .quiz .opts{grid-template-columns:1fr}
  .gl{columns:1}
}
@media print{.side,.top,.ctrl{display:none}}


/* ===== Revisi v2 ===== */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em}
.cite{color:var(--muted);font-weight:500;font-size:.85em;white-space:nowrap}
.en{font-style:italic}
.notes dl.nt{margin:.2em 0 0;display:grid;gap:.15em}
.notes dl.nt dt{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin-top:.55em}
.notes dl.nt dt:first-child{margin-top:.1em}
.notes dl.nt dd{margin:0;font-size:14.5px;line-height:1.55}
.notes dl.nt dd ul,.notes dl.nt dd ol{margin:.2em 0;padding-left:1.2em}
ol.refs{list-style:none;padding:0;margin:.4em 0 0;display:grid;gap:.55em}
ol.refs li{padding-left:2.2em;text-indent:-2.2em;margin:0;line-height:1.45}
.closing .emo span{opacity:.4}
@media (max-width:900px){.grid3{grid-template-columns:1fr 1fr}}
.grid3>*,.grid4>*,.grid5>*,.cols>*{min-width:0}
.card{overflow-wrap:break-word}
@media (max-width:600px){.grid3,.grid5,.grid4{grid-template-columns:1fr!important}.read .slide{font-size:15.5px}}
.card.obek{font-size:.84em}
.stage .gl{columns:3;column-gap:1.6em;font-size:.8em}
.stage .gl dd{margin-bottom:.35em}
.stage .quiz{gap:.28em;margin-bottom:.45em}
.stage .quiz button{padding:.32em .6em}
.stage .quiz .fb{min-height:1.1em}
.read{grid-template-columns:minmax(0,1fr)}.view{min-width:0}
.notes .nhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.notes .nhead h4{margin:0}
.lockb{display:inline-flex;align-items:center;gap:4px;border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));background:transparent;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink)}
.lockb svg{width:13px;height:13px}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none!important}
.modal form{width:min(380px,100%);background:var(--surface);color:var(--ink-2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px}
.modal h2{margin:0 0 4px;font-size:18px;color:var(--ink);display:flex;gap:8px;align-items:center}
.modal h2 svg{width:18px;height:18px;color:var(--primary)}
.modal p{margin:0 0 12px;font-size:13.5px;color:var(--muted)}
.modal input{width:100%;font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.modal input:focus{outline:3px solid var(--accent);outline-offset:1px}
.modal .err{color:var(--bad);font-size:13px;min-height:1.3em;margin:6px 0 10px}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
.modal .row button{font:inherit;font-size:13.5px;font-weight:700;border-radius:9px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.modal .row button.pri{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}

/* ===== Revisi v3.1 (MPSI): URL panjang di referensi, slide padat ===== */
ol.refs li{overflow-wrap:anywhere}
.stage ol.refs{font-size:.9em;gap:.4em}
.stage .gl{font-size:.74em}


/* ===== Revisi v3.3 (KMO): judul berkata panjang di HP, kuis lebih rapat ===== */
@media (max-width:600px){.read .soonbox h1,.read .cover h1,.read .closing h1{font-size:2.1em;overflow-wrap:break-word;hyphens:auto}}
.stage .quiz{gap:.2em;margin-bottom:.35em}
.stage .quiz .opts{gap:.25em}

/* ===== Tema Brutalism (v4) =====
   Sumber gaya: skill "brutalism" (typeui.sh / awesome-design-skills).
   Koral #DD614C · mustard #DAA144 · tinta #111827 · kertas #F4F1EA.
   Judul: Darker Grotesque · isi: Atkinson Hyperlegible Next · label: JetBrains Mono. */
:root{
  --coral:#DD614C; --mustard:#DAA144; --paper:#F4F1EA;
  --bg:#F4F1EA; --surface:#FFFFFF; --surface-2:#F1ECE1; --ink:#111827; --ink-2:#1F2937; --muted:#4B5563;
  --line:#111827; --rule:#D8D0BF; --hatch:#E7E1D3;
  --primary:#B5412E; --primary-ink:#FFFFFF; --primary-soft:#F9DED7;
  --accent:#DAA144; --accent-soft:#F7E9CC; --accent-ink:#111827;
  --green:#15803D; --warn:#A1350E; --warn-soft:#FBE2D3; --ok:#15803D; --ok-soft:#DDF3E3; --bad:#B91C1C; --bad-soft:#FDE2E2;
  --side-bg:#DAA144; --side-ink:#111827; --side-muted:#2B2B2B;
  --bw:2px; --sh:5px; --r:6px;
  --shadow:var(--sh) var(--sh) 0 var(--line);
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --display:"Darker Grotesque","Atkinson Hyperlegible Next",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --surface:#1C1C1C; --surface-2:#262626; --ink:#F5F3EE; --ink-2:#E7E3DA; --muted:#BDB7AA;
    --line:#F5F3EE; --rule:#3A3A3A; --hatch:#222;
    --primary:#F29482; --primary-ink:#111111; --primary-soft:#3D241E;
    --accent:#DAA144; --accent-soft:#3A2F18; --accent-ink:#111111;
    --green:#6FD39A; --warn:#FFA071; --warn-soft:#46291A; --ok:#6FD39A; --ok-soft:#1E3A2A; --bad:#FF8A80; --bad-soft:#45221F;
    --side-bg:#181818; --side-ink:#F5F3EE; --side-muted:#BDB7AA;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1C1C1C; --surface-2:#262626; --ink:#F5F3EE; --ink-2:#E7E3DA; --muted:#BDB7AA;
  --line:#F5F3EE; --rule:#3A3A3A; --hatch:#222;
  --primary:#F29482; --primary-ink:#111111; --primary-soft:#3D241E;
  --accent:#DAA144; --accent-soft:#3A2F18; --accent-ink:#111111;
  --green:#6FD39A; --warn:#FFA071; --warn-soft:#46291A; --ok:#6FD39A; --ok-soft:#1E3A2A; --bad:#FF8A80; --bad-soft:#45221F;
  --side-bg:#181818; --side-ink:#F5F3EE; --side-muted:#BDB7AA;
}
body{background-color:var(--bg);background-image:linear-gradient(var(--hatch) 1px,transparent 1px),linear-gradient(90deg,var(--hatch) 1px,transparent 1px);background-size:32px 32px;font-size:16.5px}
:focus-visible{outline:3px dashed var(--coral);outline-offset:3px;border-radius:2px}

/* Sidebar: blok mustard dengan garis tegas */
.side{background:var(--side-bg);color:var(--side-ink);border-right:3px solid var(--line)}
.brand{border-bottom:3px solid var(--line);background:var(--surface)}
.brand b{font-family:var(--display);font-weight:900;font-size:21px;line-height:.95;text-transform:uppercase;color:var(--ink)}
.brand span{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.side h3{font-family:var(--mono);color:var(--side-ink);letter-spacing:.1em}
.mlist{gap:6px;padding:0 12px 18px}
.mbtn{border:var(--bw) solid transparent;border-radius:4px;padding:6px 8px;color:var(--side-ink)}
.mbtn:hover{background:var(--surface);color:var(--ink);border-color:var(--line)}
.mbtn[aria-current="true"]{background:var(--coral);color:#111827;border-color:#111827;box-shadow:3px 3px 0 #111827}
.mbtn .no{border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:2px}
.mbtn[aria-current="true"] .no{background:#111827;color:var(--mustard);border-color:#111827}
.mbtn .t{color:inherit;font-weight:700;font-size:14px}
.mbtn.soon .t{color:var(--side-muted);font-weight:500}
.mbtn[aria-current="true"] .t{color:#111827}
.tag{border-radius:2px;font-family:var(--mono);font-size:9.5px;border:1.5px solid currentColor}
.tag.soon{background:transparent;color:var(--side-muted)}
.tag.exam{background:#111827;color:var(--mustard);border-color:#111827}
.side .foot{border-top:3px solid var(--line);color:var(--side-ink);font-family:var(--mono);font-size:11px}

/* Bilah atas dan tombol */
.top{background:var(--bg);backdrop-filter:none;border-bottom:3px solid var(--line)}
.top .title{font-family:var(--display);font-weight:900;font-size:21px;line-height:1;text-transform:uppercase;letter-spacing:.005em}
.top .title small{font-family:var(--font);text-transform:none;font-size:12.5px;font-weight:600;margin-top:3px}
.ibtn,.seg{border:var(--bw) solid var(--line);border-radius:4px;background:var(--surface);box-shadow:3px 3px 0 var(--line);font-weight:700}
.ibtn:hover{border-color:var(--line);background:var(--accent-soft)}
.ibtn:active{transform:translate(3px,3px);box-shadow:none}
.ibtn[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--coral);color:#111827;border-color:var(--line)}
.seg{overflow:hidden}
.seg button{border-radius:0;font-weight:700}
.seg button+button{border-left:var(--bw) solid var(--line)}

/* Panggung slide */
.stage{border:3px solid var(--line);border-radius:8px;box-shadow:8px 8px 0 var(--line)}
.ctrl .count{font-weight:700;color:var(--ink)}
.bar{height:12px;border:var(--bw) solid var(--line);border-radius:2px;background:var(--surface)}
.bar i{background:var(--coral);border-radius:0}
.hint{font-family:var(--mono);font-size:11px}
.read .slide{border:3px solid var(--line);border-radius:8px;box-shadow:6px 6px 0 var(--line)}
.notes{background:var(--accent-soft);border:var(--bw) solid var(--line);border-left:10px solid var(--mustard);border-radius:4px}
.notes h4,.notes dl.nt dt{font-family:var(--mono)}
.notes dl.nt dt{color:var(--primary)}
.lockb{border:1.5px solid var(--line);border-radius:3px}

/* Tipografi slide */
.slide{color:var(--ink-2);line-height:1.5}
.slide h1,.slide h2{font-family:var(--display);color:var(--ink);letter-spacing:0;line-height:.92}
.slide h1{font-size:3.6em;font-weight:900;text-transform:uppercase}
.slide h2{font-size:2.55em;font-weight:900;margin-bottom:.45em}
.slide h3{font-weight:700}
.slide li::marker{color:var(--primary)}
.eyebrow{color:var(--ink);font-weight:700}
.eyebrow .chip{background:var(--ink);color:var(--mustard);border-radius:2px;padding:.2em .6em}
.lead{font-weight:500}
.muted{color:var(--muted)}

/* Kartu, callout, tabel */
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:4px 4px 0 var(--line)}
.card.hl{background:var(--accent-soft)}
.card.warn{background:var(--warn-soft)}
.card.ok{background:var(--ok-soft)}
.ic{color:var(--primary)}
.callout{background:var(--accent-soft);border:var(--bw) solid var(--line);border-left:.45em solid var(--coral);border-radius:4px;color:var(--ink)}
.callout.warn{background:var(--warn-soft);border-left-color:var(--warn)}
.quote{font-weight:700}
.kv dt{color:var(--primary);font-weight:700}
table.t{border:var(--bw) solid var(--line)}
table.t th{background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:.72em;letter-spacing:.06em;border-bottom:0}
table.t th,table.t td{border-bottom:1px solid var(--rule)}
table.t td+td,table.t th+th{border-left:1px solid var(--rule)}
.phrase{background:var(--accent-soft);border:1px solid var(--line);border-radius:2px}

/* Sampul dan penutup */
.cover{background:linear-gradient(var(--hatch) 1px,transparent 1px) 0 0/2em 2em,linear-gradient(90deg,var(--hatch) 1px,transparent 1px) 0 0/2em 2em,var(--surface)}
.cover .meta b{font-family:var(--mono);font-size:.8em;text-transform:uppercase;letter-spacing:.06em}
.cover .strip{height:.9em;border-top:3px solid var(--line);background:linear-gradient(90deg,var(--coral) 0 55%,var(--mustard) 55% 85%,#111827 85% 100%)}
.closing{background:linear-gradient(var(--hatch) 1px,transparent 1px) 0 0/2em 2em,linear-gradient(90deg,var(--hatch) 1px,transparent 1px) 0 0/2em 2em,var(--surface)}
.closing h1{font-size:4.6em}
.closing .qwrap{background:var(--accent-soft);border:var(--bw) solid var(--line);box-shadow:4px 4px 0 var(--line);padding:.8em 1.1em;border-radius:4px}
.closing .qa{font-family:var(--mono);font-size:.75em}

/* Diagram SVG */
.s-box{fill:var(--surface);stroke:var(--line);stroke-width:2.5}
.s-soft{fill:var(--primary-soft);stroke:var(--line);stroke-width:2.5}
.s-acc{fill:var(--accent-soft);stroke:var(--line);stroke-width:2.5}
.s-hl{fill:var(--mustard)}
.s-warn{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2.5}
.s-dash{stroke:var(--muted)}
.s-hd{fill:var(--ink);font-weight:700}
.s-t{font-weight:700}
.s-s{fill:var(--muted);font-weight:500}

/* Batang penilaian dan minggu */
.assess{border:var(--bw) solid var(--line);border-radius:4px}
.assess div+div{border-left:var(--bw) solid var(--line)}
.assess .a1{background:var(--coral);color:#111827}
.assess .a2{background:var(--mustard);color:#111827}
.assess .a3{background:#111827;color:#F4F1EA}
.assess .a4{background:var(--surface);color:var(--ink)}
.weeks span{border:1.5px solid var(--line);border-radius:2px;background:var(--surface)}
.weeks span.on{background:var(--coral);color:#111827}
.weeks span.ex{background:#111827;color:var(--mustard)}

/* Chat, istilah, kuis */
.chat{background:var(--surface-2);border:var(--bw) solid var(--line);border-radius:6px}
.bub{border:1.5px solid var(--line);box-shadow:none;border-radius:6px}
.bub.me{background:var(--primary-soft)}
.term{border-bottom:2px dotted var(--primary);font-weight:700}
.tip{background:#111827;color:#F4F1EA;border:2px solid var(--mustard);border-radius:4px;box-shadow:4px 4px 0 var(--mustard)}
.tip i{color:var(--mustard)}
.gl dd i{color:var(--primary)}
.quiz .q{font-weight:700}
.quiz button{border:var(--bw) solid var(--line);border-radius:4px;background:var(--surface);box-shadow:3px 3px 0 var(--line);font-weight:600}
.quiz button:hover{background:var(--accent-soft);border-color:var(--line)}
.quiz button.right{background:var(--ok-soft);border-color:var(--ok);box-shadow:3px 3px 0 var(--ok)}
.quiz button.wrong{background:var(--bad-soft);border-color:var(--bad);box-shadow:3px 3px 0 var(--bad)}

/* Kerangka "soon" dan dialog */
.soonbox .pill{font-size:.75em;padding:.3em .7em}
.tag.pill.soon{color:var(--ink)}
.modal form{border:3px solid var(--line);border-radius:6px;box-shadow:8px 8px 0 var(--line)}
.modal h2{font-family:var(--display);font-weight:900;font-size:24px;text-transform:uppercase}
.modal input{border:var(--bw) solid var(--line);border-radius:4px}
.modal .row button{border:var(--bw) solid var(--line);border-radius:4px;box-shadow:3px 3px 0 var(--line)}
.modal .row button.pri{background:var(--coral);color:#111827;border-color:var(--line)}

@media (max-width:900px){
  .top .title{font-size:18px}
  .side{border-right:3px solid var(--line)}
}
@media (max-width:600px){
  .read .slide{box-shadow:4px 4px 0 var(--line)}
  .card{box-shadow:3px 3px 0 var(--line)}
}
/* Penyesuaian mode gelap dan HP */
.eyebrow .chip{background:#111827;color:var(--mustard)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .eyebrow .chip,:root:not([data-theme="light"]) .tag.exam{background:var(--mustard);color:#111111;border-color:var(--mustard)}
}
:root[data-theme="dark"] .eyebrow .chip,:root[data-theme="dark"] .tag.exam{background:var(--mustard);color:#111111;border-color:var(--mustard)}
@media (max-width:600px){
  .top{gap:6px;padding:8px 12px}
  .top .title{font-size:16px;min-width:0}
  .top .title small{display:none}
  .stage{box-shadow:4px 4px 0 var(--line)}
}

/* ===== Kutipan teks asli + terjemahan (v4.2) ===== */
.qt{margin:0 0 .6em}
.qt:last-child{margin-bottom:0}
.qt .ar{font-family:'Amiri','Noto Naskh Arabic','Scheherazade New',serif;font-size:1.35em;line-height:1.85;direction:rtl;text-align:right;margin:0 0 .3em;color:var(--ink)}
.qt .quote{display:block;margin:0;font-size:1.05em}
.qt .quote[lang="en"]{font-style:italic}
.qt .tr{margin:.35em 0 0;font-size:.95em;color:var(--ink-2)}
.qt .src{margin-top:.4em;font-size:.8em;color:var(--muted)}
.cols.wr{grid-template-columns:1fr 1.3fr}
.slide .qt .quote{font-size:1em;font-weight:600;line-height:1.4}
.slide .qt .quote[lang="en"]{font-weight:500}
.slide .qt .tr{font-size:.92em;line-height:1.45}
@media (max-width:900px){.cols.wr{grid-template-columns:1fr}}
.qh{display:flex;align-items:center;gap:.4em;margin:0 0 .5em}

/* ===== Tombol kembali ke homepage (v4.3) ===== */
.homeback{display:flex;align-items:center;gap:.4em;margin:12px 12px 0;padding:7px 10px;background:var(--surface);color:var(--ink);border:var(--bw) solid var(--line);border-radius:4px;box-shadow:3px 3px 0 var(--line);font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.02em;text-decoration:none;flex:0 0 auto}
.homeback:hover{background:var(--coral);color:#111827}
.homeback:active{transform:translate(3px,3px);box-shadow:none}
.homeback+.brand{margin-top:12px;border-top:3px solid var(--line)}

</style>
</head>

const GLOSSARY={"digitization":{"t":"Digitization","d":"Mengubah informasi analog (kertas, suara, gambar fisik) menjadi format digital tanpa mengubah cara kerja.","id":"digitisasi"},"digitalization":{"t":"Digitalization","d":"Memakai teknologi digital untuk mengubah atau mengotomasi proses bisnis yang sudah ada.","id":"digitalisasi"},"digital-transformation":{"t":"Digital transformation","d":"Perubahan menyeluruh pada organisasi, termasuk model bisnis, proses, dan budaya, yang dipicu kombinasi teknologi digital untuk menciptakan nilai baru.","id":"transformasi digital"},"digital-technology":{"t":"Digital technology","d":"Kombinasi teknologi informasi, komputasi, komunikasi, dan konektivitas, misalnya cloud, data, AI, IoT, dan mobile.","id":"teknologi digital"},"business-model":{"t":"Business model","d":"Cara organisasi menciptakan, menyampaikan, dan menangkap nilai.","id":"model bisnis"},"value-proposition":{"t":"Value proposition","d":"Manfaat yang ditawarkan organisasi kepada pelanggan atau pengguna layanannya.","id":"proposisi nilai"},"customer-network":{"t":"Customer network","d":"Pelanggan sebagai jaringan yang aktif saling terhubung, memberi ulasan, dan memengaruhi satu sama lain.","id":"jaringan pelanggan"},"disruption":{"t":"Disruption","d":"Perubahan pasar ketika pendatang baru dengan model bisnis berbeda menggeser pemain lama.","id":"disrupsi"},"legacy-system":{"t":"Legacy system","d":"Sistem lama yang masih dipakai tetapi sulit diubah atau diintegrasikan dengan teknologi baru.","id":"sistem warisan"},"inertia":{"t":"Inertia","d":"Kecenderungan organisasi mempertahankan cara kerja, struktur, dan sumber daya yang sudah ada.","id":"inersia / kelembaman organisasi"},"digital-economy":{"t":"Digital economy","d":"Kegiatan ekonomi yang berlangsung melalui atau bergantung pada teknologi digital, misalnya e-commerce dan pembayaran digital.","id":"ekonomi digital"},"gmv":{"t":"Gross merchandise value (GMV)","d":"Total nilai transaksi barang/jasa yang terjadi melalui platform digital dalam periode tertentu.","id":"nilai transaksi bruto"},"super-app":{"t":"Super app","d":"Satu aplikasi yang menggabungkan banyak layanan, misalnya transportasi, pesan-antar makanan, dan pembayaran.","id":"aplikasi super"},"stakeholder":{"t":"Stakeholder","d":"Orang, kelompok, atau organisasi yang memengaruhi atau dipengaruhi oleh sebuah inisiatif.","id":"pemangku kepentingan"},"cloud-computing":{"t":"Cloud computing","d":"Model akses sumber daya komputasi bersama (server, penyimpanan, aplikasi) melalui jaringan, sesuai kebutuhan, dan cepat disediakan.","id":"komputasi awan"},"saas":{"t":"Software as a Service (SaaS)","d":"Aplikasi siap pakai yang dijalankan penyedia; pengguna cukup memakai lewat browser atau aplikasi.","id":"perangkat lunak sebagai layanan"},"paas":{"t":"Platform as a Service (PaaS)","d":"Platform untuk membangun dan menjalankan aplikasi sendiri tanpa mengelola server dan sistem operasi.","id":"platform sebagai layanan"},"iaas":{"t":"Infrastructure as a Service (IaaS)","d":"Sewa server virtual, penyimpanan, dan jaringan; pengguna mengelola sistem operasi dan aplikasinya.","id":"infrastruktur sebagai layanan"},"elasticity":{"t":"Rapid elasticity","d":"Kemampuan kapasitas cloud bertambah atau berkurang cepat mengikuti beban.","id":"elastisitas cepat"},"big-data":{"t":"Big data","d":"Data yang volumenya besar, datangnya cepat, dan jenisnya beragam sehingga butuh cara pengolahan baru.","id":"mahadata"},"analytics":{"t":"Analytics","d":"Pemakaian data, statistik, dan model untuk memahami keadaan dan mendukung keputusan.","id":"analitik"},"ai":{"t":"Artificial intelligence (AI)","d":"Sistem berbasis mesin yang, dari masukan yang diterima, menyimpulkan cara menghasilkan keluaran seperti prediksi, konten, rekomendasi, atau keputusan.","id":"kecerdasan artifisial"},"generative-ai":{"t":"Generative AI","d":"Jenis AI yang menghasilkan konten baru (teks, gambar, kode, suara) berdasarkan pola dari data latihnya.","id":"AI generatif"},"customer-experience":{"t":"Customer experience","d":"Keseluruhan pengalaman pelanggan saat berinteraksi dengan organisasi di semua titik kontak.","id":"pengalaman pelanggan"},"operational-backbone":{"t":"Operational backbone","d":"Sistem inti, data, dan proses terintegrasi yang menjamin operasi harian berjalan andal.","id":"tulang punggung operasional"},"digital-platform":{"t":"Digital platform","d":"Kumpulan komponen bisnis, data, dan infrastruktur yang dapat dipakai ulang untuk cepat membangun layanan digital baru.","id":"platform digital"},"vendor-lock-in":{"t":"Vendor lock-in","d":"Ketergantungan pada satu penyedia sehingga pindah ke penyedia lain menjadi mahal atau sulit.","id":"ketergantungan pada vendor"},"hallucination":{"t":"Hallucination","d":"Keluaran AI generatif yang terdengar meyakinkan tetapi salah atau tidak berdasar.","id":"halusinasi AI"},"iot":{"t":"Internet of Things (IoT)","d":"Jaringan benda fisik (sensor, kamera, mesin) yang terhubung ke internet sehingga bisa mengirim data dan dikendalikan dari jauh.","id":"internet untuk segala"},"sensor":{"t":"Sensor","d":"Perangkat yang mengukur keadaan fisik (suhu, ketinggian air, gerak) lalu mengubahnya menjadi data.","id":"sensor / pengindra"},"actuator":{"t":"Actuator","d":"Perangkat yang melakukan tindakan fisik berdasarkan perintah, misalnya menyalakan pompa atau membuka katup.","id":"aktuator / penggerak"},"gateway":{"t":"Gateway","d":"Perangkat penghubung yang meneruskan data dari banyak perangkat IoT ke jaringan atau cloud.","id":"gerbang penghubung"},"interoperability":{"t":"Interoperability","d":"Kemampuan sistem yang berbeda untuk bertukar dan memakai data bersama.","id":"interoperabilitas / saling bisa bekerja sama"},"mobile-first":{"t":"Mobile-first","d":"Merancang layanan dengan mengutamakan pengguna ponsel sejak awal.","id":"mengutamakan ponsel"},"social-commerce":{"t":"Social commerce","d":"Jual beli yang berlangsung di dalam atau lewat media sosial dan aplikasi pesan.","id":"perdagangan sosial"},"api":{"t":"Application Programming Interface (API)","d":"Pintu dengan aturan tertentu yang memungkinkan satu aplikasi meminta data atau layanan dari aplikasi lain.","id":"antarmuka pemrograman aplikasi"},"open-api":{"t":"Open API","d":"API yang dibuka untuk dipakai pihak lain dengan standar dan izin yang jelas.","id":"API terbuka"},"external-developer-platform":{"t":"External developer platform","d":"Kumpulan komponen digital organisasi yang dibuka untuk dipakai pihak luar (mitra, pengembang) membangun layanan.","id":"platform pengembang eksternal"},"fhir":{"t":"HL7 FHIR","d":"Standar internasional pertukaran data kesehatan secara elektronik, banyak dipakai lewat API.","id":"standar interoperabilitas data kesehatan"},"bmc":{"t":"Business Model Canvas (BMC)","d":"Kanvas satu halaman berisi sembilan blok untuk menggambarkan, menganalisis, dan merancang model bisnis.","id":"kanvas model bisnis"},"customer-segment":{"t":"Customer Segments","d":"Kelompok orang atau organisasi yang ingin dijangkau dan dilayani organisasi.","id":"segmen pelanggan"},"channel":{"t":"Channels","d":"Cara organisasi berkomunikasi dengan dan menjangkau segmen pelanggan untuk menyampaikan proposisi nilai.","id":"saluran"},"customer-relationship":{"t":"Customer Relationships","d":"Jenis hubungan yang dibangun organisasi dengan segmen pelanggan tertentu.","id":"hubungan pelanggan"},"revenue-stream":{"t":"Revenue Streams","d":"Uang yang diperoleh organisasi dari setiap segmen pelanggan.","id":"arus pendapatan"},"key-resource":{"t":"Key Resources","d":"Aset terpenting yang dibutuhkan agar model bisnis berjalan.","id":"sumber daya utama"},"key-activity":{"t":"Key Activities","d":"Hal terpenting yang harus dikerjakan organisasi agar model bisnisnya berjalan.","id":"aktivitas utama"},"key-partnership":{"t":"Key Partnerships","d":"Jaringan pemasok dan mitra yang membuat model bisnis berjalan.","id":"kemitraan utama"},"cost-structure":{"t":"Cost Structure","d":"Seluruh biaya yang timbul untuk menjalankan model bisnis.","id":"struktur biaya"},"customer-job":{"t":"Getting the job done","d":"Nilai yang tercipta karena produk atau layanan membantu pelanggan menyelesaikan suatu pekerjaan.","id":"membantu menyelesaikan pekerjaan"}};
const QUOTES=[{"q":"Digital transformation is not about technology—it is about strategy and new ways of thinking.","a":"David L. Rogers","s":"The Digital Transformation Playbook, 2016"},{"q":"Software is eating the world.","a":"Marc Andreessen","s":"\"Why Software Is Eating the World\", The Wall Street Journal, 20 Aug 2011"},{"q":"Technology is nothing. What's important is that you have a faith in people, that they're basically good and smart, and if you give them tools, they'll do wonderful things with them.","a":"Steve Jobs","s":"Interview with Jeff Goodell, Rolling Stone, 1994"},{"q":"Indeed, Allah will not change the condition of a people until they change what is in themselves.","a":"Al-Qur'an, Ar-Ra'd 13:11","s":"Sahih International translation"}];
const MEETINGS=[{"no":1,"title":"Konsep Transformasi Digital","subtitle":"Digitisasi, digitalisasi, transformasi digital, pendorong, dan hambatannya","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 1</span><span>Transformasi Digital · SI24W15</span></div><h1>Konsep Transformasi Digital</h1><p class=\"lead\">Digitisasi, digitalisasi, transformasi digital, pendorong, dan hambatannya</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Program Studi</b>Sistem Informasi, Unusida</div><div><b>Semester</b>3 · 2 SKS</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-1</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menjelaskan konsep digitisasi, digitalisasi, dan transformasi digital beserta pendorongnya (C2).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian </h3><ol><li>Ketepatan membedakan digitisasi, digitalisasi, dan transformasi digital.</li><li>Ketepatan menjelaskan pendorong dan hambatan transformasi digital.</li><li>Ketepatan memberi contoh transformasi digital di Indonesia.</li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menjelaskan konsep transformasi digital, teknologi pendorongnya, dan model bisnis digital.</dd><dt>CPL-3</dt><dd class=\"id\">Menguasai konsep teoritis Sistem Informasi, Ilmu Komputer, dan Bisnis Digital secara umum serta konsep khusus secara mendalam untuk memformulasikan solusi prosedural.</dd><dt>Waktu</dt><dd>Tatap muka 2×50 menit · Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Tes Tulis (UTS: 5%)</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Peta perkuliahan</span><span>16 pertemuan · 2 SKS · Case Study</span></div><h2>Satu semester, satu organisasi mitra</h2><p>Setiap kelompok menganalisis <b>satu organisasi mitra nyata</b> (UMKM, instansi pemerintah, perguruan tinggi, atau pesantren/lembaga NU): dari teknologi dan model bisnisnya sampai roadmap transformasinya.</p><div class=\"assess\" role=\"img\" aria-label=\"Penilaian: Tugas 1 30 persen, UTS 20 persen, Tugas 2 30 persen, UAS 20 persen\"><div class=\"a1\" style=\"width:30%\"><b>30%</b>Tugas 1</div><div class=\"a2\" style=\"width:20%\"><b>20%</b>UTS</div><div class=\"a3\" style=\"width:30%\"><b>30%</b>Tugas 2</div><div class=\"a4\" style=\"width:20%\"><b>20%</b>UAS</div></div><div class=\"cols\" style=\"margin-top:.8em\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Tugas 1 · Kondisi saat ini</h3><p>Pemetaan teknologi digital, Business Model Canvas, serta analisis proses dan customer journey organisasi mitra. Dipresentasikan di Pertemuan 7.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Tugas 2 · Arah ke depan</h3><p>Asesmen kematangan digital, strategi dan roadmap transformasi, serta kajian aspek legal, etika, dan keberlanjutan untuk organisasi yang sama.</p></div></div><div class=\"weeks\" aria-hidden=\"true\"><span class=\"on\">1</span><span class=\"\">2</span><span class=\"\">3</span><span class=\"\">4</span><span class=\"\">5</span><span class=\"\">6</span><span class=\"\">7</span><span class=\"ex\">8</span><span class=\"\">9</span><span class=\"\">10</span><span class=\"\">11</span><span class=\"\">12</span><span class=\"\">13</span><span class=\"\">14</span><span class=\"\">15</span><span class=\"ex\">16</span></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Kontrak kuliah</span><span>Kita sepakati bersama</span></div><h2>Kesepakatan kelas kita</h2><div class=\"grid5\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Tepat waktu</h3><p>Hadir sebelum kelas dimulai. Tugas dikumpulkan sesuai tenggat.</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Kerja tim</h3><p>Setiap anggota punya peran dan kontribusi yang tercatat (<i>At Taawun</i>).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg>Menjaga mitra</h3><p>Santun, menepati janji, dan menjaga kerahasiaan data mitra (<i>Al Amanah</i>).</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Jujur</h3><p>Data dan sumber apa adanya. Hasil AI generatif tidak diakui sebagai tulisan sendiri (<i>As Shidqu</i>).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>Bertanya</h3><p>Kesulitan segera disampaikan, jangan ditunda sampai tenggat.</p></div></div><p class=\"muted\" style=\"margin-top:1em\">Ketentuan lain (kehadiran, keterlambatan pengumpulan) mengikuti peraturan akademik Unusida.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pemanasan</span><span>3 menit · berpasangan</span></div><h2>Sekadar digital, atau benar-benar berubah?</h2><div class=\"cols w\"><div><p class=\"lead\">Beri tanda <b>A</b> bila hanya mengubah bentuk data, <b>B</b> bila mengubah cara kerja, <b>C</b> bila mengubah cara organisasi menciptakan nilai.</p><ol><li>Pesantren memindai rapor kertas santri menjadi PDF</li><li>Warung kopi menerima pembayaran QRIS</li><li>Kelurahan membuka pengajuan surat pengantar lewat formulir daring</li><li>Ojek pangkalan menjadi aplikasi transportasi, pesan-antar, dan pembayaran</li><li>Kampus memindahkan jadwal kuliah dari papan pengumuman ke website</li><li>UMKM batik mulai menjual desain sesuai pesanan lewat marketplace dan live streaming</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Petunjuk</h3><p>Tanyakan: <b>Apa yang berubah?</b> Hanya bentuk datanya, prosesnya, atau cara organisasi mendapat pendapatan dan melayani pelanggan?</p><p class=\"muted\">Jawaban dibahas di slide berikutnya.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Konsep</span><span>Indikator 1</span></div><h2>Tiga tahap: dari data ke organisasi</h2><figure class=\"fig\"><svg viewBox=\"0 0 860 280\" style=\"max-height:13em\" role=\"img\" aria-label=\"Tiga tahap bertingkat seperti anak tangga. Digitization: informasi analog diubah menjadi digital. Digitalization: proses yang ada diubah atau diotomasi dengan teknologi digital. Digital transformation: perubahan menyeluruh organisasi hingga model bisnis baru. Semakin ke kanan, cakupan perubahan makin luas.\"><defs><marker id=\"d3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><line x1=\"30\" y1=\"262\" x2=\"830\" y2=\"262\" class=\"s-line\" marker-end=\"url(#d3)\"/><text x=\"830\" y=\"252\" text-anchor=\"end\" class=\"s-hd\">CAKUPAN PERUBAHAN MAKIN LUAS</text><rect x=\"30\" y=\"150\" width=\"250\" height=\"90\" rx=\"12\" class=\"s-soft\"/><text x=\"155\" y=\"180\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:16px\">Digitization</text><text x=\"155\" y=\"204\" text-anchor=\"middle\" class=\"s-s\">analog → digital</text><text x=\"155\" y=\"226\" text-anchor=\"middle\" class=\"s-hd\" style=\"font-size:11px\">FOKUS: DATA/INFORMASI</text><rect x=\"300\" y=\"100\" width=\"250\" height=\"140\" rx=\"12\" class=\"s-soft\"/><text x=\"425\" y=\"130\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:16px\">Digitalization</text><text x=\"425\" y=\"154\" text-anchor=\"middle\" class=\"s-s\">proses diubah/diotomasi</text><text x=\"425\" y=\"176\" text-anchor=\"middle\" class=\"s-hd\" style=\"font-size:11px\">FOKUS: PROSES BISNIS</text><rect x=\"570\" y=\"50\" width=\"250\" height=\"190\" rx=\"12\" class=\"s-acc\"/><text x=\"695\" y=\"80\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:16px\">Digital transformation</text><text x=\"695\" y=\"104\" text-anchor=\"middle\" class=\"s-s\">model bisnis &amp; organisasi</text><text x=\"695\" y=\"126\" text-anchor=\"middle\" class=\"s-hd\" style=\"font-size:11px\">FOKUS: SELURUH ORGANISASI</text></svg><figcaption>Tiga tahap transformasi digital, diadaptasi dari Verhoef et al. (2021). Nama tahap ditulis sesuai sumber.</figcaption></figure><div class=\"grid3\" style=\"margin-top:.5em\"><div class=\"card\"><p><b><button type=\"button\" class=\"term\" data-term=\"digitization\">Digitization</button></b>: informasi analog diubah menjadi digital.</p></div><div class=\"card\"><p><b><button type=\"button\" class=\"term\" data-term=\"digitalization\">Digitalization</button></b>: proses yang ada diubah atau diotomasi dengan teknologi digital.</p></div><div class=\"card hl\"><p><b><button type=\"button\" class=\"term\" data-term=\"digital-transformation\">Digital transformation</button></b>: perubahan menyeluruh yang melahirkan model bisnis baru.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Definisi</span><span>Indikator 1</span></div><h2>Apa itu transformasi digital?</h2><div class=\"cols w\"><div><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"A process that aims to improve an entity by triggering significant changes to its properties through combinations of information, computing, communication, and connectivity technologies.\"</p><p class=\"tr\">\"Sebuah proses yang bertujuan memperbaiki suatu entitas dengan memicu perubahan-perubahan signifikan pada sifat-sifatnya melalui kombinasi-kombinasi teknologi informasi, komputasi, komunikasi, dan konektivitas.\"</p><div class=\"src\">Vial (2019); terjemahan harfiah penyusun</div></blockquote><ul style=\"margin-top:.8em\"><li><b>Proses</b>: berlangsung terus, bukan proyek sekali jadi.</li><li><b>Perubahan signifikan</b>: bukan sekadar menambah aplikasi.</li><li><b>Kombinasi teknologi</b>: <button type=\"button\" class=\"term\" data-term=\"digital-technology\">teknologi digital</button> bekerja bersama, bukan satu alat saja.</li></ul></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4\"/></svg>Bukan soal teknologi</h3><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"Digital transformation is not about technology—it is about strategy and new ways of thinking.\"</p><p class=\"tr\">\"Transformasi digital bukanlah tentang teknologi; ia adalah tentang strategi dan cara-cara berpikir yang baru.\"</p><div class=\"src\">Rogers (2016); terjemahan harfiah penyusun</div></blockquote></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Contoh</span><span>Kasus ilustrasi · indikator 1</span></div><h2>Tiga tahap di tiga organisasi</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Organisasi</th><th>Digitization</th><th>Digitalization</th><th>Digital transformation</th></tr></thead><tbody><tr><td><b>Pesantren</b></td><td>Data santri dan rapor dipindai atau diketik ke spreadsheet</td><td>Pembayaran syahriah lewat virtual account; nilai diinput ustaz di aplikasi</td><td>Wali santri memantau perkembangan anak secara daring; pesantren membuka kelas daring berbayar untuk alumni dan masyarakat</td></tr><tr><td><b>UMKM keripik</b></td><td>Buku catatan pesanan difoto dan disimpan di galeri HP</td><td>Kasir digital mencatat stok dan penjualan otomatis</td><td>Menjual paket langganan bulanan ke kantor-kantor berdasarkan data pola pesanan</td></tr><tr><td><b>Kelurahan</b></td><td>Arsip surat kertas dipindai menjadi PDF</td><td>Pengajuan surat pengantar lewat formulir daring</td><td>Layanan terintegrasi dengan data kependudukan; warga tidak perlu datang dan tidak perlu menyerahkan fotokopi berulang</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.4em\">Kasus ilustrasi.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Pendorong</span><span>Indikator 2</span></div><h2>Lima domain yang berubah di era digital</h2><div class=\"tw\"><table class=\"t\"><thead><tr><th>Domain</th><th>Dari…</th><th>Menjadi…</th><th>Contoh di Indonesia</th></tr></thead><tbody><tr><td><b>Customers</b></td><td>pasar massal yang pasif</td><td><button type=\"button\" class=\"term\" data-term=\"customer-network\">jaringan pelanggan</button> yang aktif</td><td>ulasan pembeli di marketplace</td></tr><tr><td><b>Competition</b></td><td>pesaing dalam industri yang sama</td><td>penantang dari luar industri</td><td>bank bersaing dengan dompet digital</td></tr><tr><td><b>Data</b></td><td>mahal, dikumpulkan terbatas</td><td>mengalir terus; aset strategis</td><td>jejak transaksi QRIS</td></tr><tr><td><b>Innovation</b></td><td>produk jadi, uji belakangan</td><td>eksperimen cepat, berulang</td><td>fitur aplikasi diuji ke sebagian pengguna</td></tr><tr><td><b>Value</b></td><td><button type=\"button\" class=\"term\" data-term=\"value-proposition\">proposisi nilai</button> tetap</td><td>terus beradaptasi</td><td>toko buku menjadi komunitas dan langganan</td></tr></tbody></table></div><p class=\"muted\" style=\"font-size:.8em;margin-top:.3em\">Kolom dari–menjadi diringkas dari Rogers (2016); contoh oleh dosen (ilustrasi).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\" style=\"background:var(--warn-soft);color:var(--warn)\">Hambatan</span><span>Indikator 2</span></div><h2>Mengapa transformasi sering tersendat?</h2><div class=\"grid3\"><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg><button type=\"button\" class=\"term\" data-term=\"inertia\">Inersia</button></h3><p>Struktur, kebiasaan, dan anggaran lama membuat organisasi cenderung bertahan pada cara lama.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Resistensi</h3><p>Pegawai khawatir kehilangan peran, beban kerja bertambah, atau tidak percaya diri memakai teknologi.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg><button type=\"button\" class=\"term\" data-term=\"legacy-system\">Sistem warisan</button></h3><p>Aplikasi lama sulit diintegrasikan; data tersebar di banyak aplikasi yang tidak saling bicara.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/></svg>Talenta &amp; literasi</h3><p>Kurang SDM yang paham teknologi sekaligus proses bisnis.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Visi kepemimpinan</h3><p>Transformasi dianggap \"urusan bagian IT\", bukan agenda pimpinan.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>Sumber daya</h3><p>Anggaran dan waktu terbatas; hasil jangka pendek tidak langsung terlihat.</p></div></div><p class=\"muted\" style=\"margin-top:.6em;font-size:.85em\">Inersia dan resistensi sebagai penghambat diuraikan Vial <span class=\"cite\">(2019)</span>; butir lainnya rangkuman dosen dari Westerman et al. (2014) dan Rogers (2023).</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Lanskap Indonesia</span><span>Indikator 3</span></div><h2><button type=\"button\" class=\"term\" data-term=\"digital-economy\">Ekonomi digital</button> Indonesia</h2><div class=\"grid3\"><div class=\"card hl\"><div class=\"big\">79,5%</div><p>penetrasi internet 2024, atau sekitar <b>221,5 juta</b> penduduk <span class=\"cite\">(APJII, 2024)</span>.</p></div><div class=\"card hl\"><div class=\"big\">US$90 miliar</div><p><button type=\"button\" class=\"term\" data-term=\"gmv\">GMV</button> ekonomi digital Indonesia 2024, terbesar di Asia Tenggara, tumbuh 13% dari 2023 <span class=\"cite\">(Google et al., 2024)</span>.</p></div><div class=\"card\"><div class=\"big\">Perpres 82/2023</div><p>kebijakan percepatan transformasi digital dan keterpaduan layanan digital nasional.</p></div></div><div class=\"callout\" style=\"margin-top:.9em\">Pengguna sudah digital; pertanyaannya adalah apakah <b>organisasi</b> di sekitarnya (UMKM, instansi, kampus, pesantren) ikut berubah.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\" style=\"background:var(--warn-soft);color:var(--warn)\">Studi kasus</span><span>Swasta dan pemerintah · indikator 3</span></div><h2>Dua contoh transformasi di Indonesia</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"/><path d=\"M12 18h.01\"/></svg>Gojek</h3><ul><li>2010: layanan ojek dengan <b>20 pengemudi dan 1 call center</b>.</li><li>2015: aplikasi diluncurkan; pesanan naik dari sekitar 3.000 menjadi 10.000 per hari.</li><li>Kemudian berkembang menjadi <button type=\"button\" class=\"term\" data-term=\"super-app\">super app</button>: transportasi, pesan-antar makanan, pembayaran, dan layanan bisnis.</li></ul><p class=\"muted\" style=\"font-size:.85em\"><span class=\"cite\">(Liputan6.com, 2022)</span></p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/></svg>PeduliLindungi → SATUSEHAT Mobile</h3><ul><li>Mulai 1 Maret 2023, aplikasi PeduliLindungi bertransformasi menjadi SATUSEHAT Mobile.</li><li>Fungsi bergeser dari penanganan pandemi ke catatan kesehatan pribadi.</li><li>Direncanakan terhubung dengan rekam medis elektronik melalui platform SATUSEHAT.</li></ul><p class=\"muted\" style=\"font-size:.85em\"><span class=\"cite\">(Antara, 2023)</span></p></div></div><div class=\"callout\" style=\"margin-top:.8em\">Pada tahap mana masing-masing? Apa pendorong dan hambatannya?</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Diskusi</span><span>Kelompok 4–5 orang · 15 menit</span></div><h2>Bedah contoh transformasi di sekitar kita</h2><div class=\"cols\"><div><p class=\"lead\">Pilih satu organisasi yang Anda kenal (UMKM, instansi, kampus, pesantren/lembaga NU).</p><ol><li>Apa inisiatif digital yang dilakukan?</li><li>Termasuk tahap apa: digitization, digitalization, atau digital transformation? Beri alasan.</li><li>Domain mana (Rogers) yang menjadi pendorongnya?</li><li>Hambatan apa yang terlihat atau mungkin muncul?</li></ol></div><div class=\"tw\"><table class=\"t\"><thead><tr><th>Aspek</th><th>Temuan kelompok</th></tr></thead><tbody><tr><td>Organisasi &amp; inisiatif</td><td>…</td></tr><tr><td>Tahap + alasan</td><td>…</td></tr><tr><td>Pendorong</td><td>…</td></tr><tr><td>Hambatan</td><td>…</td></tr></tbody></table><p class=\"muted\" style=\"font-size:.85em;margin-top:.4em\">Salin tabel ini di kertas atau dokumen kelompok.</p></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li><b>Digitization</b> mengubah data, <b>digitalization</b> mengubah proses, <b>digital transformation</b> mengubah organisasi dan model bisnis.</li><li>Transformasi digital adalah perubahan signifikan yang dipicu <b>kombinasi</b> teknologi, bukan satu aplikasi.</li><li>Pendorongnya lima domain: <b>customers, competition, data, innovation, value</b>.</li><li>Hambatan utama: <b>inersia dan resistensi</b>, ditambah sistem warisan, talenta, visi, sumber daya.</li><li>Indonesia sudah sangat terhubung; tantangannya adalah <b>organisasi</b> yang ikut berubah.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"a\" data-why=\"Hanya bentuk informasinya yang berubah dari analog ke digital; proses dan layanan belum berubah.\"><p class=\"q\">Pesantren memindai rapor kertas santri menjadi PDF. Ini termasuk…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. digitization</button><button type=\"button\" data-o=\"b\">B. digitalization</button><button type=\"button\" data-o=\"c\">C. digital transformation</button><button type=\"button\" data-o=\"d\">D. disruption</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"Lima domain Rogers: Customers, Competition, Data, Innovation, Value.\"><p class=\"q\">Manakah yang BUKAN domain transformasi digital menurut Rogers (2016)?</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Customers</button><button type=\"button\" data-o=\"b\">B. Competition</button><button type=\"button\" data-o=\"c\">C. Hardware</button><button type=\"button\" data-o=\"d\">D. Value</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"b\" data-why=\"Vial (2019) menyoroti inersia organisasi dan resistensi dari pegawai.\"><p class=\"q\">Dua penghambat utama transformasi digital menurut Vial (2019) adalah…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. biaya dan waktu</button><button type=\"button\" data-o=\"b\">B. inersia dan resistensi</button><button type=\"button\" data-o=\"c\">C. regulasi dan pajak</button><button type=\"button\" data-o=\"d\">D. internet dan listrik</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit</span></div><h2>Tugas mandiri</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bab pengantar Rogers (2016), <i>The Digital Transformation Playbook</i>, tentang lima domain; atau bab pengantar Rogers (2023), <i>The Digital Transformation Roadmap</i>.</p></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Menulis ringkasan kasus</h3><p>Pilih <b>satu kasus transformasi digital di Indonesia</b> (selain Gojek dan SATUSEHAT) dari sumber tepercaya. Tulis ringkasan 300–400 kata dalam bahasa Indonesia: apa yang berubah, termasuk tahap apa, pendorong (lima domain), hambatan, dan pelajaran untuk organisasi lain. Cantumkan sumber (APA 7).</p></div></div><div class=\"callout\" style=\"margin-top:.8em\">Mulai pikirkan calon <b>organisasi mitra</b>. Kelompok dan mitra dibentuk di Pertemuan 2.</div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Digitization</span></dt><dd>Mengubah informasi analog (kertas, suara, gambar fisik) menjadi format digital tanpa mengubah cara kerja. <i>(digitisasi)</i></dd></div><div><dt><span class=\"en\">Digitalization</span></dt><dd>Memakai teknologi digital untuk mengubah atau mengotomasi proses bisnis yang sudah ada. <i>(digitalisasi)</i></dd></div><div><dt><span class=\"en\">Digital transformation</span></dt><dd>Perubahan menyeluruh pada organisasi, termasuk model bisnis, proses, dan budaya, yang dipicu kombinasi teknologi digital untuk menciptakan nilai baru. <i>(transformasi digital)</i></dd></div><div><dt><span class=\"en\">Digital technology</span></dt><dd>Kombinasi teknologi informasi, komputasi, komunikasi, dan konektivitas, misalnya cloud, data, AI, IoT, dan mobile. <i>(teknologi digital)</i></dd></div><div><dt><span class=\"en\">Business model</span></dt><dd>Cara organisasi menciptakan, menyampaikan, dan menangkap nilai. <i>(model bisnis)</i></dd></div><div><dt><span class=\"en\">Value proposition</span></dt><dd>Manfaat yang ditawarkan organisasi kepada pelanggan atau pengguna layanannya. <i>(proposisi nilai)</i></dd></div><div><dt><span class=\"en\">Customer network</span></dt><dd>Pelanggan sebagai jaringan yang aktif saling terhubung, memberi ulasan, dan memengaruhi satu sama lain. <i>(jaringan pelanggan)</i></dd></div><div><dt><span class=\"en\">Disruption</span></dt><dd>Perubahan pasar ketika pendatang baru dengan model bisnis berbeda menggeser pemain lama. <i>(disrupsi)</i></dd></div><div><dt><span class=\"en\">Legacy system</span></dt><dd>Sistem lama yang masih dipakai tetapi sulit diubah atau diintegrasikan dengan teknologi baru. <i>(sistem warisan)</i></dd></div><div><dt><span class=\"en\">Inertia</span></dt><dd>Kecenderungan organisasi mempertahankan cara kerja, struktur, dan sumber daya yang sudah ada. <i>(inersia / kelembaman organisasi)</i></dd></div><div><dt><span class=\"en\">Digital economy</span></dt><dd>Kegiatan ekonomi yang berlangsung melalui atau bergantung pada teknologi digital, misalnya e-commerce dan pembayaran digital. <i>(ekonomi digital)</i></dd></div><div><dt><span class=\"en\">Gross merchandise value (GMV)</span></dt><dd>Total nilai transaksi barang/jasa yang terjadi melalui platform digital dalam periode tertentu. <i>(nilai transaksi bruto)</i></dd></div><div><dt><span class=\"en\">Super app</span></dt><dd>Satu aplikasi yang menggabungkan banyak layanan, misalnya transportasi, pesan-antar makanan, dan pembayaran. <i>(aplikasi super)</i></dd></div><div><dt><span class=\"en\">Stakeholder</span></dt><dd>Orang, kelompok, atau organisasi yang memengaruhi atau dipengaruhi oleh sebuah inisiatif. <i>(pemangku kepentingan)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\" style=\"font-size:.74em;gap:.3em\"><li>Asosiasi Penyelenggara Jasa Internet Indonesia. (2024, 7 Februari). <i>APJII: Jumlah pengguna internet Indonesia tembus 221 juta orang</i>. https://apjii.or.id/berita/d/apjii-jumlah-pengguna-internet-indonesia-tembus-221-juta-orang</li><li>Antara. (2023, 28 Februari). <i>Kemenkes: PeduliLindungi bertransformasi jadi SatuSehat mulai besok</i>. https://www.antaranews.com/berita/3417786/</li><li>Google, Temasek, &amp; Bain &amp; Company. (2024). <i>e-Conomy SEA 2024</i>. https://economysea.withgoogle.com/</li><li>Liputan6.com. (2022, 15 Desember). <i>Profil PT Gojek Indonesia, sejarah, alamat kantor, dan produk layanannya</i>. https://www.liputan6.com/hot/read/5154461/</li><li>Peraturan Presiden Republik Indonesia Nomor 82 Tahun 2023 tentang Percepatan Transformasi Digital dan Keterpaduan Layanan Digital Nasional.</li><li>Rogers, D. L. (2016). <i>The digital transformation playbook: Rethink your business for the digital age</i>. Columbia Business School Publishing.</li><li>Rogers, D. L. (2023). <i>The digital transformation roadmap: Rebuild your organization for continuous change</i>. Columbia Business School Publishing.</li><li>Verhoef, P. C., Broekhuizen, T., Bart, Y., Bhattacharya, A., Dong, J. Q., Fabian, N., &amp; Haenlein, M. (2021). Digital transformation: A multidisciplinary reflection and research agenda. <i>Journal of Business Research, 122</i>, 889–901. https://doi.org/10.1016/j.jbusres.2019.09.022</li><li>Vial, G. (2019). Understanding digital transformation: A review and a research agenda. <i>The Journal of Strategic Information Systems, 28</i>(2), 118–144. https://doi.org/10.1016/j.jsis.2019.01.003</li><li>Westerman, G., Bonnet, D., &amp; McAfee, A. (2014). <i>Leading digital: Turning technology into business transformation</i>. Harvard Business Review Press.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 2.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":2,"title":"Teknologi Pendorong (1)","subtitle":"Cloud computing, big data dan analitik, AI dan generative AI","status":"ready","slides":[{"cls":"cover","html":"<img class=\"logo\" alt=\"Logo Universitas Nahdlatul Ulama Sidoarjo\" src=\"__LOGO__\"><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 2</span><span>Transformasi Digital · SI24W15</span></div><h1>Teknologi Pendorong (1)</h1><p class=\"lead\">Cloud computing, big data dan analitik, AI dan generative AI</p><div class=\"meta\"><div><b>Dosen</b>Rizky Aditya Nugroho, S.T., M.Eng.</div><div><b>Blok</b>Pertemuan 2–3 · Sub-CPMK-2</div><div><b>Hari ini</b>Konsep + bentuk kelompok &amp; pilih mitra</div></div><div class=\"strip\"></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Capaian pembelajaran</span><span>Jejak OBE</span></div><h2>Apa yang akan Anda kuasai</h2><div class=\"cols w\"><div><div class=\"callout\"><div class=\"eyebrow\" style=\"margin:0 0 .3em\">Sub-CPMK-2 · Pertemuan 2–3</div><div class=\"lead\" style=\"font-weight:700\">Mahasiswa mampu menjelaskan peran teknologi pendorong (cloud, data, AI, IoT, mobile) dalam transformasi digital (C2).</div></div><h3 style=\"margin-top:1em\">Indikator pencapaian <span class=\"muted\" style=\"font-weight:500\">(hari ini: indikator 1 dan 2 untuk cloud, data, dan AI; indikator 3 dimulai)</span></h3><ol><li>Ketepatan menjelaskan karakteristik setiap teknologi pendorong.</li><li>Ketepatan mengaitkan teknologi dengan nilai bisnis yang dihasilkan.</li><li>Ketepatan mengidentifikasi teknologi yang dipakai organisasi mitra. <span class=\"muted\">(dimulai hari ini, dilanjutkan Pertemuan 3)</span></li></ol></div><div class=\"card obek\"><dl class=\"kv\"><dt>CPMK-1</dt><dd>Mahasiswa mampu menjelaskan konsep transformasi digital, teknologi pendorongnya, dan model bisnis digital.</dd><dt>CPL-3</dt><dd class=\"id\">Menguasai konsep teoritis Sistem Informasi, Ilmu Komputer, dan Bisnis Digital secara umum serta konsep khusus secara mendalam untuk memformulasikan solusi prosedural.</dd><dt>Waktu</dt><dd>Tatap muka 2×50 menit · Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit (per minggu)</dd><dt>Penilaian</dt><dd>Penilaian Hasil Produk (Tugas 1: 10%) dan Tes Tulis (UTS: 5%) untuk blok Pertemuan 2–3</dd></dl></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Ulasan</span><span>Pertemuan 1 dalam 3 pertanyaan</span></div><h2>Masih ingat?</h2><ol class=\"lead\"><li>Apa beda digitization, digitalization, dan digital transformation?</li><li>Sebutkan lima domain transformasi digital menurut Rogers.</li><li>Mengapa membeli aplikasi mahal belum tentu berarti transformasi digital?</li></ol>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Kerangka</span><span>Indikator 2</span></div><h2>Teknologi menciptakan nilai di tiga area</h2><figure class=\"fig\"><svg viewBox=\"0 0 860 250\" role=\"img\" aria-label=\"Teknologi digital seperti cloud, data dan analitik, AI, IoT, mobile, dan API di kiri, dihubungkan panah ke tiga area penciptaan nilai di kanan: customer experience, operational processes, dan business models.\"><defs><marker id=\"dv\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 10 5 0 10z\" fill=\"currentColor\"/></marker></defs><text x=\"20\" y=\"22\" class=\"s-hd\">TEKNOLOGI DIGITAL</text><rect x=\"20\" y=\"32\" width=\"220\" height=\"29\" rx=\"8\" class=\"s-acc\"/><text x=\"130\" y=\"51\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Cloud</text><rect x=\"20\" y=\"67\" width=\"220\" height=\"29\" rx=\"8\" class=\"s-acc\"/><text x=\"130\" y=\"86\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Data &amp; analitik</text><rect x=\"20\" y=\"102\" width=\"220\" height=\"29\" rx=\"8\" class=\"s-acc\"/><text x=\"130\" y=\"121\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">AI / GenAI</text><rect x=\"20\" y=\"137\" width=\"220\" height=\"29\" rx=\"8\" class=\"s-box\"/><text x=\"130\" y=\"156\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">IoT</text><rect x=\"20\" y=\"172\" width=\"220\" height=\"29\" rx=\"8\" class=\"s-box\"/><text x=\"130\" y=\"191\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">Mobile &amp; sosial</text><rect x=\"20\" y=\"207\" width=\"220\" height=\"29\" rx=\"8\" class=\"s-box\"/><text x=\"130\" y=\"226\" text-anchor=\"middle\" class=\"s-t\" style=\"font-size:13px\">API &amp; platform</text><line x1=\"250\" y1=\"130\" x2=\"440\" y2=\"130\" class=\"s-line\" marker-end=\"url(#dv)\"/><text x=\"345\" y=\"120\" text-anchor=\"middle\" class=\"s-s\">dipakai untuk mengubah…</text><text x=\"460\" y=\"22\" class=\"s-hd\">AREA PENCIPTAAN NILAI</text><rect x=\"460\" y=\"34\" width=\"380\" height=\"58\" rx=\"12\" class=\"s-soft\"/><text x=\"650\" y=\"58\" text-anchor=\"middle\" class=\"s-t\">Customer experience</text><text x=\"650\" y=\"78\" text-anchor=\"middle\" class=\"s-s\">cara melayani &amp; memahami pelanggan</text><rect x=\"460\" y=\"104\" width=\"380\" height=\"58\" rx=\"12\" class=\"s-soft\"/><text x=\"650\" y=\"128\" text-anchor=\"middle\" class=\"s-t\">Operational processes</text><text x=\"650\" y=\"148\" text-anchor=\"middle\" class=\"s-s\">cara bekerja di dalam organisasi</text><rect x=\"460\" y=\"174\" width=\"380\" height=\"58\" rx=\"12\" class=\"s-soft\"/><text x=\"650\" y=\"198\" text-anchor=\"middle\" class=\"s-t\">Business models</text><text x=\"650\" y=\"218\" text-anchor=\"middle\" class=\"s-s\">cara menciptakan &amp; menangkap nilai</text></svg><figcaption>Tiga area tempat teknologi digital menciptakan nilai, diadaptasi dari Westerman et al. (2014). Kotak kuning: dibahas hari ini; lainnya di Pertemuan 3.</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Teknologi 1</span><span>Cloud computing · indikator 1</span></div><h2>Apa itu <button type=\"button\" class=\"term\" data-term=\"cloud-computing\">cloud computing</button>?</h2><div style=\"font-size:.88em\"><blockquote class=\"callout qt\"><p class=\"quote\" lang=\"en\">\"Cloud computing is a model for enabling ubiquitous, convenient, on-demand network access to a shared pool of configurable computing resources (e.g., networks, serv
