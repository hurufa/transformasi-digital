x\">aplikasi saldo santri</text><rect x=\"800\" y=\"0\" width=\"200\" height=\"260\" class=\"s-soft\"/><text x=\"810\" y=\"21\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">1 </tspan>Customer Segments</text><text x=\"810\" y=\"43\" class=\"s-s\" style=\"font-size:12px\">santri mukim</text><text x=\"810\" y=\"61\" class=\"s-s\" style=\"font-size:12px\">wali santri</text><text x=\"810\" y=\"79\" class=\"s-s\" style=\"font-size:12px\">warga sekitar pondok</text><rect x=\"0\" y=\"260\" width=\"500\" height=\"100\" class=\"s-box\"/><text x=\"10\" y=\"281\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">9 </tspan>Cost Structure</text><text x=\"10\" y=\"303\" class=\"s-s\" style=\"font-size:12px\">pembelian barang dagangan</text><text x=\"10\" y=\"321\" class=\"s-s\" style=\"font-size:12px\">honor pengurus</text><text x=\"10\" y=\"339\" class=\"s-s\" style=\"font-size:12px\">langganan aplikasi</text><rect x=\"500\" y=\"260\" width=\"500\" height=\"100\" class=\"s-soft\"/><text x=\"510\" y=\"281\" class=\"s-t\" style=\"font-size:12.5px\"><tspan class=\"s-hd\" style=\"font-size:11px\">5 </tspan>Revenue Streams</text><text x=\"510\" y=\"303\" class=\"s-s\" style=\"font-size:12px\">margin penjualan barang</text><text x=\"510\" y=\"321\" class=\"s-s\" style=\"font-size:12px\">biaya layanan titip belanja</text></svg><figcaption>Business Model Canvas kasus ilustrasi koperasi pondok pesantren (kopontren), memakai kanvas Osterwalder &amp; Pigneur (2010).</figcaption></figure>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\" style=\"background:var(--warn-soft);color:var(--warn)\">Perhatian</span><span>Indikator 1</span></div><h2>Kesalahan umum saat mengisi BMC</h2><div class=\"grid3\"><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Segmen terlalu umum</h3><p>\"Masyarakat umum\" tidak membantu. Sebut kelompok yang berbeda kebutuhannya.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 2 10 5-10 5L2 7l10-5z\"/><path d=\"M2 17l10 5 10-5M2 12l10 5 10-5\"/></svg>Fitur, bukan nilai</h3><p>\"Ada aplikasi\" bukan proposisi nilai. Tulis manfaatnya bagi segmen.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3\"/></svg>Saluran = hubungan</h3><p>Channels menjawab \"lewat apa\"; Customer Relationships menjawab \"hubungan seperti apa\".</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/></svg>Blok tidak nyambung</h3><p>Ada segmen tanpa saluran, atau biaya tanpa aktivitas yang menimbulkannya.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Rencana, bukan kenyataan</h3><p>Tugas ini memetakan kondisi <b>saat ini</b>; ide perbaikan dicatat terpisah.</p></div><div class=\"card warn\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>Tanpa bukti</h3><p>Setiap isi blok sebaiknya bersumber dari wawancara, observasi, atau dokumen mitra.</p></div></div><p class=\"muted\" style=\"margin-top:.6em;font-size:.85em\">Rangkuman dosen.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Workshop BMC</span><span>Kelompok proyek · 30 menit</span></div><h2>Gambar kanvas organisasi mitra Anda</h2><div class=\"cols w\"><div><ol><li>Gambar kanvas sembilan blok di kertas plano atau A3 (atau papan digital).</li><li>Isi blok sesuai urutan 1–9; satu gagasan per sticky note.</li><li>Pakai bahan dari tabel pemetaan teknologi dan wawancara mitra.</li><li>Lingkari isi yang <b>berbasis teknologi digital</b>.</li><li>Rumuskan satu kalimat <b>proposisi nilai digital</b> mitra.</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>Periksa sebelum selesai</h3><ul><li>Kesembilan blok terisi.</li><li>Setiap segmen punya saluran dan nilai.</li><li>Isi yang belum pasti diberi tanda tanya untuk ditanyakan ke mitra.</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Workshop BMC</span><span>Galeri berputar · 15 menit</span></div><h2>Periksa kanvas kelompok lain</h2><div class=\"cols\"><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg>Cara kerja</h3><ol><li>Tempel kanvas di dinding.</li><li>Setiap kelompok berpindah ke kanvas kelompok di sebelahnya.</li><li>Tulis masukan di sticky note berwarna lain.</li><li>Kembali ke kanvas sendiri, baca semua masukan.</li></ol></div><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>Tiga pertanyaan masukan</h3><ul><li>Blok mana yang masih kosong atau terlalu umum?</li><li>Adakah blok yang tidak nyambung dengan blok lain?</li><li>Apakah proposisi nilai digitalnya menyebut manfaat, bukan fitur?</li></ul></div></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Rangkuman</span></div><h2>Poin-poin kunci</h2><ul class=\"lead\"><li>Model bisnis menjelaskan bagaimana organisasi <b>menciptakan, menyampaikan, dan menangkap nilai</b>.</li><li>BMC punya <b>sembilan blok</b>: sisi pelanggan, sisi organisasi, serta biaya dan pendapatan.</li><li>Proposisi nilai adalah <b>sekumpulan produk dan layanan</b> yang menciptakan nilai bagi segmen tertentu.</li><li>Nilai bisa datang dari banyak unsur: kemudahan, harga, pengurangan risiko, aksesibilitas, dan lain-lain.</li><li>Proposisi nilai <b>digital</b>: nilainya muncul karena teknologi digital.</li></ul>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Cek pemahaman</span><span>Klik jawaban</span></div><h2>Kuis singkat</h2><div class=\"quiz\" data-ans=\"b\" data-why=\"Kalimat itu menyatakan manfaat bagi segmen wali santri, jadi termasuk proposisi nilai.\"><p class=\"q\">\"Wali santri bisa memantau saldo anaknya dari rumah.\" Kalimat ini paling tepat ditulis di blok…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Channels</button><button type=\"button\" data-o=\"b\">B. Value Propositions</button><button type=\"button\" data-o=\"c\">C. Key Resources</button><button type=\"button\" data-o=\"d\">D. Revenue Streams</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"a\" data-why=\"Komisi adalah biaya yang timbul untuk menjalankan model bisnis.\"><p class=\"q\">Biaya komisi marketplace yang dibayar UMKM masuk ke blok…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Cost Structure</button><button type=\"button\" data-o=\"b\">B. Revenue Streams</button><button type=\"button\" data-o=\"c\">C. Key Partnerships</button><button type=\"button\" data-o=\"d\">D. Customer Relationships</button></div><p class=\"fb\" aria-live=\"polite\"></p></div><div class=\"quiz\" data-ans=\"c\" data-why=\"Cost reduction: organisasi membantu pelanggan mengurangi biaya mereka sendiri.\"><p class=\"q\">Pelanggan menghemat ongkos dan waktu karena tidak perlu datang ke kantor. Unsur nilai menurut Osterwalder &amp; Pigneur ini adalah…</p><div class=\"opts\"><button type=\"button\" data-o=\"a\">A. Price</button><button type=\"button\" data-o=\"b\">B. Newness</button><button type=\"button\" data-o=\"c\">C. Cost reduction</button><button type=\"button\" data-o=\"d\">D. Brand/Status</button></div><p class=\"fb\" aria-live=\"polite\"></p></div>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Sebelum pertemuan berikutnya</span><span>Belajar mandiri 2×60 menit · Penugasan terstruktur 2×60 menit</span></div><h2>Tugas 1 bagian kedua: BMC mitra</h2><div class=\"cols w\"><div class=\"card hl\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/></svg>Business Model Canvas organisasi mitra (10%)</h3><ul><li>Rapikan draf kanvas hari ini menjadi BMC digital (satu halaman) dengan sembilan blok.</li><li>Konfirmasi isi bertanda tanya kepada narahubung mitra.</li><li>Tandai isi yang berbasis teknologi digital dan tulis satu paragraf <b>proposisi nilai digital</b> mitra.</li><li>Di Pertemuan 5 ditambah analisis: mitra lebih dekat ke model <b>pipeline</b> atau <b>platform</b>.</li></ul><p class=\"muted\" style=\"font-size:.85em\">Tenggat: <b>[PERLU DIISI]</b> (tidak tercantum di RPS).</p></div><div class=\"card\"><h3><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>Membaca</h3><p>Bagian sembilan blok dan pola model bisnis platform (multi-sided platforms) dalam Osterwalder &amp; Pigneur (2010), serta bab tentang platform dalam Rogers (2016), sebagai persiapan Pertemuan 5.</p></div></div><p class=\"muted\" style=\"margin-top:.7em\">Lembar tugas dan rubrik dibagikan terpisah. Ditulis dalam bahasa Indonesia; pemakaian AI disebutkan.</p>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Glosarium</span><span>Arahkan kursor atau ketuk kata bergaris titik di slide</span></div><h2>Istilah kunci pertemuan ini</h2><dl class=\"gl\"><div><dt><span class=\"en\">Business model</span></dt><dd>Cara organisasi menciptakan, menyampaikan, dan menangkap nilai. <i>(model bisnis)</i></dd></div><div><dt><span class=\"en\">Business Model Canvas (BMC)</span></dt><dd>Kanvas satu halaman berisi sembilan blok untuk menggambarkan, menganalisis, dan merancang model bisnis. <i>(kanvas model bisnis)</i></dd></div><div><dt><span class=\"en\">Customer Segments</span></dt><dd>Kelompok orang atau organisasi yang ingin dijangkau dan dilayani organisasi. <i>(segmen pelanggan)</i></dd></div><div><dt><span class=\"en\">Value proposition</span></dt><dd>Manfaat yang ditawarkan organisasi kepada pelanggan atau pengguna layanannya. <i>(proposisi nilai)</i></dd></div><div><dt><span class=\"en\">Channels</span></dt><dd>Cara organisasi berkomunikasi dengan dan menjangkau segmen pelanggan untuk menyampaikan proposisi nilai. <i>(saluran)</i></dd></div><div><dt><span class=\"en\">Customer Relationships</span></dt><dd>Jenis hubungan yang dibangun organisasi dengan segmen pelanggan tertentu. <i>(hubungan pelanggan)</i></dd></div><div><dt><span class=\"en\">Revenue Streams</span></dt><dd>Uang yang diperoleh organisasi dari setiap segmen pelanggan. <i>(arus pendapatan)</i></dd></div><div><dt><span class=\"en\">Key Resources</span></dt><dd>Aset terpenting yang dibutuhkan agar model bisnis berjalan. <i>(sumber daya utama)</i></dd></div><div><dt><span class=\"en\">Key Activities</span></dt><dd>Hal terpenting yang harus dikerjakan organisasi agar model bisnisnya berjalan. <i>(aktivitas utama)</i></dd></div><div><dt><span class=\"en\">Key Partnerships</span></dt><dd>Jaringan pemasok dan mitra yang membuat model bisnis berjalan. <i>(kemitraan utama)</i></dd></div><div><dt><span class=\"en\">Cost Structure</span></dt><dd>Seluruh biaya yang timbul untuk menjalankan model bisnis. <i>(struktur biaya)</i></dd></div><div><dt><span class=\"en\">Getting the job done</span></dt><dd>Nilai yang tercipta karena produk atau layanan membantu pelanggan menyelesaikan suatu pekerjaan. <i>(membantu menyelesaikan pekerjaan)</i></dd></div></dl>"},{"cls":"","html":"<div class=\"eyebrow\"><span class=\"chip\">Daftar referensi</span><span>APA 7</span></div><h2>Sumber yang dipakai di pertemuan ini</h2><ol class=\"refs\"><li>Liputan6.com. (2022, 15 Desember). <i>Profil PT Gojek Indonesia, sejarah, alamat kantor, dan produk layanannya</i>. https://www.liputan6.com/hot/read/5154461/</li><li>Antara. (2023, 28 Februari). <i>Kemenkes: PeduliLindungi bertransformasi jadi SatuSehat mulai besok</i>. https://www.antaranews.com/berita/3417786/</li><li>Osterwalder, A., &amp; Pigneur, Y. (2010). <i>Business model generation: A handbook for visionaries, game changers, and challengers</i>. John Wiley &amp; Sons.</li><li>Rogers, D. L. (2016). <i>The digital transformation playbook: Rethink your business for the digital age</i>. Columbia Business School Publishing.</li><li>Westerman, G., Bonnet, D., &amp; McAfee, A. (2014). <i>Leading digital: Turning technology into business transformation</i>. Harvard Business Review Press.</li></ol><p class=\"muted\" style=\"margin-top:1em;font-size:.88em\">Sumber kutipan pada slide penutup ditampilkan langsung bersama kutipannya.</p>"},{"cls":"closingslide","html":"<div class=\"closing\"><div class=\"emo\" aria-hidden=\"true\"></div><h1>Terima kasih!</h1><p class=\"muted\" style=\"margin:0 0 1.4em\">Sampai jumpa di Pertemuan 5.</p><div class=\"qwrap\" aria-live=\"polite\"><div class=\"qt\"></div><div class=\"qa\"></div></div></div>"}]},{"no":5,"title":"Model Bisnis Digital (2)","subtitle":"Model bisnis platform dan ekosistem, efek jaringan, contoh platform digital Indonesia","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 5</span><span>Sub-CPMK-3 (Pertemuan 4–5) · CPMK-1 · CPL-3</span></div><h1>Model Bisnis Digital (2)</h1><p class=\"lead\">Model bisnis platform dan ekosistem, efek jaringan, contoh platform digital Indonesia</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Mahasiswa mampu memetakan model bisnis dan platform digital suatu organisasi dengan Business Model Canvas (C3).</div><p class=\"muted\" style=\"margin-top:1em\">Materi lengkap akan tersedia di sini sebelum perkuliahan.</p></div>"}]},{"no":6,"title":"Transformasi Proses Bisnis","subtitle":"Pemodelan proses as-is dan to-be, otomasi proses","status":"soon","slides":[{"cls":"","html":"<div class=\"soonbox\"><span class=\"tag soon pill\">Coming soon</span><div class=\"eyebrow\"><span class=\"chip\">Pertemuan 6</span><span>Sub-CPMK-4 (Pertemuan 6–7) · CPMK-2 · CPL-4</span></div><h1>Transformasi Proses Bisnis</h1><p class=\"lead\">Pemodelan proses as-is dan to-be, otomasi proses</p><div class=\"callout\" style=\"margin-top:1.2em\"><b>Capaian pembelajaran:</b> Maha /* ============ RUNTIME (UI in English; content in Indonesian) ============ */
(function(){
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(COURSE.key+':'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(COURSE.key+':'+k,JSON.stringify(v));}catch(e){}}};
const sess={get(k){try{return sessionStorage.getItem(COURSE.key+':'+k);}catch(e){return null;}},set(k,v){try{sessionStorage.setItem(COURSE.key+':'+k,v);}catch(e){}},del(k){try{sessionStorage.removeItem(COURSE.key+':'+k);}catch(e){}}};
const st={m:0,s:0,mode:store.get('mode','slide'),notes:false};
const root=document.documentElement;
const savedTheme=store.get('theme',null); if(savedTheme) root.setAttribute('data-theme',savedTheme);
MEETINGS.forEach(m=>m.slides.forEach(s=>{s.html=s.html.split('__LOGO__').join(LOGO);}));

/* ---------- Encrypted lecturer notes ---------- */
let NOTES=null; // {meetingNo:[html per slide]} after unlock
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptNotes(pw){
  if(!(window.crypto&&crypto.subtle)) throw new Error('nocrypto');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(NOTES_ENC.salt),iterations:NOTES_ENC.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(NOTES_ENC.iv)},key,b64(NOTES_ENC.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
function noteOf(i){const a=NOTES&&NOTES[MEETINGS[st.m].no];return a&&a[i]?a[i]:'';}
function notesBox(i){
  if(!st.notes) return '';
  const n=noteOf(i);
  return '<div class="notes"><div class="nhead"><h4>Lecturer Note</h4><button class="lockb" type="button" data-lock="1">'+ic('lock','')+'Lock</button></div>'+(n||'<p class="muted" style="margin:0">No note for this slide.</p>')+'</div>';
}
function openUnlock(){
  const d=$('#unlock'); d.hidden=false; $('#pw').value=''; $('#pwErr').textContent=''; setTimeout(()=>$('#pw').focus(),30);
}
function closeUnlock(){ $('#unlock').hidden=true; }
async function tryUnlock(pw, silent){
  const btn=$('#pwGo'); if(!silent){btn.disabled=true; btn.textContent='Checking…';}
  try{ NOTES=await decryptNotes(pw); sess.set('pw',pw); if(!silent) st.notes=true; closeUnlock(); render(); return true; }
  catch(e){ if(!silent) $('#pwErr').textContent=e.message==='nocrypto'?'This browser cannot decrypt notes. Open the page over https in a modern browser.':'Wrong password. Please try again.'; if(silent) sess.del('pw'); return false; }
  finally{ if(!silent){btn.disabled=false; btn.textContent='Unlock';} }
}
function toggleNotes(){
  if(st.notes){st.notes=false;render();return;}
  if(NOTES){st.notes=true;render();return;}
  openUnlock();
}
function lockNotes(){NOTES=null;st.notes=false;sess.del('pw');render();}

/* ---------- Sidebar ---------- */
function buildSide(){
  const ul=$('#mlist'); ul.innerHTML='';
  MEETINGS.forEach((m,i)=>{
    const li=document.createElement('li');
    const tag=m.status==='exam'?'<span class="tag exam">Exam</span>':(m.status==='soon'?'<span class="tag soon">Soon</span>':'');
    li.innerHTML='<button class="mbtn '+(m.status==='soon'?'soon':'')+'" data-i="'+i+'"><span class="no">'+String(m.no).padStart(2,'0')+'</span><span class="t">'+m.title+'</span>'+tag+'</button>';
    ul.appendChild(li);
  });
  ul.addEventListener('click',e=>{const b=e.target.closest('.mbtn');if(!b)return;go(+b.dataset.i,0);if(window.matchMedia('(max-width:900px)').matches)toggleMenu(false);});
}
function markSide(){document.querySelectorAll('.mbtn').forEach(b=>b.setAttribute('aria-current',+b.dataset.i===st.m?'true':'false'));}

/* ---------- Render ---------- */
let SL=[];
function render(){
  const m=MEETINGS[st.m]; SL=m.slides;
  if(st.s>=SL.length) st.s=SL.length-1; if(st.s<0) st.s=0;
  $('#ttl').innerHTML='Meeting '+m.no+' · '+m.title+'<small>'+m.subtitle+'</small>';
  $('#bMode1').setAttribute('aria-pressed',st.mode==='slide'); $('#bMode2').setAttribute('aria-pressed',st.mode==='read');
  $('#bNotes').setAttribute('aria-pressed',st.notes);
  $('#bNotes').innerHTML=ic(NOTES?'note':'lock','')+'<span class="lbl">Note</span>';
  const v=$('#view'); stopClosing();
  if(st.mode==='slide'){
    const sl=SL[st.s];
    const slideHTML='<section class="slide '+sl.cls+'" aria-label="Slide '+(st.s+1)+'">'+sl.html+'</section>';
    const restHTML='<div class="ctrl"><button class="ibtn" id="prev" aria-label="Previous slide">'+ic('left','')+'</button><span class="count">'+(st.s+1)+' / '+SL.length+'</span><button class="ibtn" id="next" aria-label="Next slide">'+ic('right','')+'</button><div class="bar"><i style="width:'+((st.s+1)/SL.length*100)+'%"></i></div><button class="ibtn" id="fs">'+ic('full','')+'<span class="lbl">Full Screen</span></button></div>'+
      '<p class="hint">Keys: ← → next/previous slide · F full screen · N note · R read mode · T theme</p>'+notesBox(st.s);
    /* Full screen: keep the same #stage element so the browser stays in full screen; only swap its content */
    const fsEl=document.fullscreenElement;
    if(fsEl&&fsEl.id==='stage'&&fsEl.parentNode===v){
      fsEl.innerHTML=slideHTML;
      Array.from(v.children).forEach(c=>{if(c!==fsEl)c.remove();});
      fsEl.insertAdjacentHTML('afterend',restHTML);
    } else {
      v.innerHTML='<div class="stage" id="stage">'+slideHTML+'</div>'+restHTML;
    }
    $('#prev').onclick=()=>step(-1); $('#next').onclick=()=>step(1);
    $('#fs').onclick=()=>{const el=$('#stage');try{if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});}catch(e){}};
  } else {
    v.innerHTML='<div class="read">'+SL.map((sl,i)=>'<section class="slide '+sl.cls+'" id="s'+(i+1)+'">'+sl.html+'</section>'+notesBox(i)).join('')+'</div>';
  }
  startClosing(v); markSide(); setHash();
}
function step(d){
  const n=st.s+d;
  if(n<0){ if(st.m>0){st.m--;st.s=999;} else return; }
  else if(n>=SL.length){ if(st.m<MEETINGS.length-1){st.m++;st.s=0;} else return; }
  else st.s=n;
  render();
}
function go(m,s){st.m=m;st.s=s;render();window.scrollTo(0,0);}
function setHash(){const h='#p'+MEETINGS[st.m].no+(st.mode==='slide'&&st.s>0?'-'+(st.s+1):'');if(location.hash!==h){try{history.replaceState(null,'',h);}catch(e){}}}
function readHash(){const r=/^#p(\d+)(?:-(\d+))?$/.exec(location.hash||'');if(!r)return;const i=MEETINGS.findIndex(x=>x.no===+r[1]);if(i>=0){st.m=i;st.s=r[2]?+r[2]-1:0;}}

/* ---------- Closing slide: quotes + emoji ---------- */
let qTimer=null;
function stopClosing(){if(qTimer){clearInterval(qTimer);qTimer=null;}}
function startClosing(scope){
  const boxes=scope.querySelectorAll('.closing'); if(!boxes.length) return;
  let qi=Math.floor(Math.random()*QUOTES.length);
  const show=()=>boxes.forEach(b=>{const q=QUOTES[qi],t=b.querySelector('.qt'),a=b.querySelector('.qa');t.style.opacity=0;a.style.opacity=0;setTimeout(()=>{t.textContent='"'+q.q+'"';a.textContent='— '+q.a+' · '+q.s;t.style.opacity=1;a.style.opacity=1;},350);});
  show(); qTimer=setInterval(()=>{qi=(qi+1)%QUOTES.length;show();},8000);
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const E=['🎓','📚','💬','🗣️','✨','👏','🙌','💡','🤝','😊','🌟','📝'];
  boxes.forEach(b=>{const L=b.querySelector('.emo'); if(!L||L.childElementCount) return;
    for(let i=0;i<12;i++){const s=document.createElement('span');s.textContent=E[i%E.length];s.style.left=(4+Math.random()*92)+'%';s.style.fontSize=(1.2+Math.random()*1.3)+'em';s.style.opacity=(.35+Math.random()*.1).toFixed(2);s.style.animationDuration=(18+Math.random()*12)+'s';s.style.animationDelay=(-Math.random()*26)+'s';L.appendChild(s);}});
}

/* ---------- Term pop-up ---------- */
const tip=document.createElement('div'); tip.className='tip'; tip.hidden=true; tip.setAttribute('role','tooltip'); document.body.appendChild(tip);
let tipFor=null;
function showTip(el){const g=GLOSSARY[el.dataset.term]; if(!g) return; tip.innerHTML='<b>'+g.t+'</b>'+g.d+'<i>Indonesian: '+g.id+'</i>'; tip.hidden=false; tipFor=el;
  const r=el.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-w/2),window.innerWidth-w-8); let y=r.top-h-8; if(y<8) y=r.bottom+8;
  tip.style.left=x+'px'; tip.style.top=y+'px';}
function hideTip(){tip.hidden=true;tipFor=null;}
document.addEventListener('mouseover',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('mouseout',e=>{const t=e.target.closest('.term');if(t&&!t.contains(e.relatedTarget))hideTip();});
document.addEventListener('focusin',e=>{const t=e.target.closest('.term');if(t)showTip(t);});
document.addEventListener('focusout',e=>{if(e.target.closest('.term'))hideTip();});
document.addEventListener('click',e=>{const t=e.target.closest('.term'); if(t){ if(tipFor===t) hideTip(); else showTip(t); } else if(!e.target.closest('.tip')) hideTip();
  if(e.target.closest('[data-lock]')){lockNotes();return;}
  const qb=e.target.closest('.quiz button'); if(qb){const q=qb.closest('.quiz'); if(q.dataset.done)return; q.dataset.done=1; const ok=qb.dataset.o===q.dataset.ans;
    q.querySelectorAll('button').forEach(b=>{if(b.dataset.o===q.dataset.ans)b.classList.add('right');}); if(!ok)qb.classList.add('wrong');
    q.querySelector('.fb').innerHTML=(ok?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.dataset.why;}});
window.addEventListener('scroll',hideTip,{passive:true});

/* ---------- Controls ---------- */
function toggleMenu(force){const a=$('#app');const mobile=window.matchMedia('(max-width:900px)').matches;
  if(mobile){const open=force===undefined?!a.classList.contains('open'):force;a.classList.toggle('open',open);$('#scrim').hidden=!open;$('#bMenu').setAttribute('aria-expanded',open);}
  else{const c=force===undefined?!a.classList.contains('collapsed'):!force;a.classList.toggle('collapsed',c);$('#bMenu').setAttribute('aria-expanded',!c);store.set('collapsed',c);}}
function setMode(md){st.mode=md;store.set('mode',md);render();}
function isDark(){const t=root.getAttribute('data-theme');return t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;}
function paintTheme(){$('#bTheme').innerHTML=ic(isDark()?'sun':'moon','')+'<span class="lbl">'+(isDark()?'Light':'Dark')+'</span>';}
function toggleTheme(){const t=isDark()?'light':'dark';root.setAttribute('data-theme',t);store.set('theme',t);paintTheme();}

document.addEventListener('keydown',e=>{
  if(!$('#unlock').hidden){ if(e.key==='Escape') closeUnlock(); return; }
  if(e.target.closest&&e.target.closest('input,textarea'))return; if(e.altKey||e.ctrlKey||e.metaKey)return;
  const k=e.key;
  if(st.mode==='slide'&&(k==='ArrowRight'||k==='PageDown'||k===' ')){e.preventDefault();step(1);}
  else if(st.mode==='slide'&&(k==='ArrowLeft'||k==='PageUp')){e.preventDefault();step(-1);}
  else if(k==='f'||k==='F'){if(st.mode==='slide')$('#fs').click();}
  else if(k==='n'||k==='N'){e.preventDefault();toggleNotes();}
  else if(k==='r'||k==='R')setMode(st.mode==='slide'?'read':'slide');
  else if(k==='t'||k==='T')toggleTheme();
  else if(k==='Escape')hideTip();
});
let tx=null; document.addEventListener('touchstart',e=>{if(e.target.closest('#stage'))tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>60&&st.mode==='slide')step(d<0?1:-1);},{passive:true});

/* ---------- Init ---------- */
$('#brandLogo').src=LOGO;
$('#bMenu').innerHTML=ic('menu','');
$('#bMode1').innerHTML=ic('slides','')+'<span class="lbl">Slides</span>';
$('#bMode2').innerHTML=ic('book','')+'<span class="lbl">Read</span>';
$('#bMenu').onclick=()=>toggleMenu(); $('#scrim').onclick=()=>toggleMenu(false);
$('#bMode1').onclick=()=>setMode('slide'); $('#bMode2').onclick=()=>setMode('read');
$('#bNotes').onclick=toggleNotes; $('#bTheme').onclick=toggleTheme;
$('#unlockForm').addEventListener('submit',e=>{e.preventDefault();const pw=$('#pw').value;if(pw)tryUnlock(pw,false);});
$('#pwCancel').onclick=closeUnlock;
$('#unlock').addEventListener('click',e=>{if(e.target.id==='unlock')closeUnlock();});
if(store.get('collapsed',false)&&!window.matchMedia('(max-width:900px)').matches)$('#app').classList.add('collapsed');
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme);
buildSide(); readHash(); paintTheme(); render();
const saved=sess.get('pw'); if(saved) tryUnlock(saved,true);
window.addEventListener('hashchange',()=>{readHash();render();});
})();


</script>
